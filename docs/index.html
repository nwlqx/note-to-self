  background-image: linear-gradient(to bottom, transparent 55%, var(--pink) 55%, var(--pink) 90%, transparent 90%);
  padding-inline: 0.1em; margin-inline-start: -0.1em;
}
.tray-empty { margin: 0; color: var(--ink-faint); font-size: var(--text-xs); }
.cal-sub h2, .day-title, .month-title { background-image: none; padding-inline: 0; margin-inline-start: 0; }
.m-month-name { background-image: none; padding-inline: 0; margin-inline-start: 0; }
.meals .m-h2 { background-image: none; padding-inline: 0; margin-inline-start: 0; }
/* Meals: today's date gets a highlighter stroke instead of a circle */
.ml-day[data-today] .ml-dnum {
  width: auto; height: auto; display: inline; border-radius: 0; font-size: var(--text-3xl); color: var(--ink);
  --hl-c: color-mix(in srgb, var(--peach) var(--hl-mix, 100%), transparent);
  background: linear-gradient(to bottom, transparent 52%, var(--hl-c) 52%, var(--hl-c) 92%, transparent 92%);
  padding-inline: 0.12em; margin-inline-end: -0.12em;
}
.todo-head { justify-content: flex-end; align-items: center; }
.todo-head { margin-top: calc(var(--gap-section) - 16px); margin-bottom: 8px; }
/* Meals: the week summary shares a row with the week arrows */
.ml-head { align-items: center; }
.ml-head .ml-summary { margin: 0; }
.ml-head .m-month-nav { margin-left: auto; flex: none; }
.day-strip + .all-day, .day-strip + .schedule { margin-top: var(--s5); }

/* Meals: Breakfast / Lunch / Dinner as table headers instead of a label on every card */
.ml-axis-label { font-size: var(--text-2xs); font-weight: 600; letter-spacing: 0.02em; color: var(--ink-soft); }
@media (min-width: 700px) {
  .ml-week {
    grid-template-columns: max-content repeat(7, minmax(0, 1fr));
    grid-template-rows: auto repeat(3, auto);
    grid-auto-flow: column; column-gap: 8px; row-gap: 6px;
  }
  .ml-axis, .ml-day { display: contents; }
  .ml-axis-label { align-self: center; padding-right: 6px; }
  .ml-slot { height: 100%; }
}
@media (max-width: 699px) {
  .ml-axis { display: grid; grid-template-columns: 44px repeat(3, minmax(0, 1fr)); gap: 6px; padding: 0 0 6px; }
  .ml-axis-label { padding-left: 8px; }
}
/* Meals: an Others row for desserts, snacks and drinks */
.ml-slot[data-slot="others"]:not([data-empty]) { background: var(--lavender-soft); }
@media (min-width: 700px) {
  .ml-week { grid-template-rows: auto repeat(4, auto); }
  .ml-slot[data-slot="others"] .ml-slot-label { display: none; }
}
@media (max-width: 699px) {
  .ml-day { grid-template-rows: auto auto; }
  .ml-day-head { grid-row: 1 / span 2; }
  .ml-slot[data-slot="others"] { grid-column: 2 / -1; min-height: 0; flex-direction: row; align-items: baseline; gap: 8px; padding: 6px 8px; }
}
@media (max-width: 699px) { .ml-axis-label[data-slot="others"] { display: none; } }
/* Meals: Food budget bar */
.ml-food { margin: var(--s4) 0 var(--s6); }
.ml-food-title { font-weight: 600; font-size: var(--text-md); }
.ml-food-bar { display: flex; height: 22px; border-radius: 7px; overflow: hidden; background: var(--surface-sunken); }
.ml-food-spent { background: var(--peach); }
.ml-food-planned {
  background: repeating-linear-gradient(135deg, var(--peach) 0 6px, color-mix(in srgb, var(--peach) 45%, var(--surface)) 6px 12px);
  box-shadow: inset 2px 0 0 var(--surface);
}
.ml-food-left { display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden; }
.ml-food-left span { font-size: var(--text-xs); font-weight: 600; color: var(--ink-soft); white-space: nowrap; padding: 0 8px; font-variant-numeric: tabular-nums; }
.ml-food-legend li { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--ink-soft); }
.ml-key { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.ml-key-spent { background: var(--peach); }
.ml-key-planned { background: repeating-linear-gradient(135deg, var(--peach) 0 3px, color-mix(in srgb, var(--peach) 45%, var(--surface)) 3px 6px); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--peach-ink) 25%, transparent); }
.ml-food .m-stack-wrap { margin: 0; padding: 0; }
.ml-food-seg { all: unset; box-sizing: border-box; height: 100%; cursor: default; transition: opacity 120ms; }
.ml-food-seg:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
.ml-food-seg[data-dim] { opacity: .5; }
.ml-key-left { background: var(--surface-sunken); box-shadow: inset 0 0 0 1px var(--line-strong); }
.ml-food-seg.ml-food-spent { background: var(--peach); }
.ml-food-seg.ml-food-planned { background: repeating-linear-gradient(135deg, var(--peach) 0 6px, color-mix(in srgb, var(--peach) 45%, var(--surface)) 6px 12px); box-shadow: inset 2px 0 0 var(--surface); }
.ml-food-seg.ml-food-left { display: flex; align-items: center; justify-content: center; overflow: hidden; }
/* Food budget bar in pink */
.ml-food-seg.ml-food-spent, .ml-key-spent { background: var(--pink); }
.ml-food-seg.ml-food-planned { background: repeating-linear-gradient(135deg, var(--pink) 0 6px, color-mix(in srgb, var(--pink) 45%, var(--surface)) 6px 12px); }
.ml-key-planned { background: repeating-linear-gradient(135deg, var(--pink) 0 3px, color-mix(in srgb, var(--pink) 45%, var(--surface)) 3px 6px); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pink-ink) 25%, transparent); }
/* Meals: livelier colours, one full pastel per meal */
.ml-slot[data-slot="breakfast"]:not([data-empty]) { background: var(--yellow); color: var(--on-yellow); }
.ml-slot[data-slot="lunch"]:not([data-empty]) { background: var(--pistachio); color: var(--on-pistachio); }
.ml-slot[data-slot="dinner"]:not([data-empty]) { background: var(--peach); color: var(--on-peach); }
.ml-slot[data-slot="others"]:not([data-empty]) { background: var(--lavender); color: var(--on-lavender); }
.ml-slot:not([data-empty]) { box-shadow: none; }
.ml-slot:not([data-empty]) .ml-cost, .ml-slot:not([data-empty]) .ml-slot-label { color: inherit; opacity: .75; }
.ml-axis-label::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.ml-axis-label[data-slot="breakfast"]::before { background: var(--yellow); }
.ml-axis-label[data-slot="lunch"]::before { background: var(--pistachio); }
.ml-axis-label[data-slot="dinner"]::before { background: var(--peach); }
.ml-axis-label[data-slot="others"]::before { background: var(--lavender); }
/* Meals: each dish in its own pastel (set per card), not one colour per row */
.ml-slot:not([data-empty])[data-slot] { background: var(--mh, var(--surface)); color: var(--ink-fixed); }
.ml-axis-label::before { display: none; }
/* row headers get a dot in their meal's colour again */
.ml-axis-label::before { display: inline-block; }
.ml-axis-label[data-slot="breakfast"]::before { background: var(--sand); }
.ml-axis-label[data-slot="lunch"]::before { background: var(--pink); }
.ml-axis-label[data-slot="dinner"]::before { background: var(--lavender); }
.ml-axis-label[data-slot="others"]::before { background: var(--snow); }
.ml-axis-label[data-slot="breakfast"]::before { background: var(--pink); }
.ml-axis-label[data-slot="lunch"]::before { background: var(--sand); }
/* Food budget bar in green, so it doesn't clash with the pink breakfast cards */
.ml-food-seg.ml-food-spent, .ml-key-spent { background: var(--pistachio); }
.ml-food-seg.ml-food-planned { background: repeating-linear-gradient(135deg, var(--pistachio) 0 6px, color-mix(in srgb, var(--pistachio) 45%, var(--surface)) 6px 12px); }
.ml-key-planned { background: repeating-linear-gradient(135deg, var(--pistachio) 0 3px, color-mix(in srgb, var(--pistachio) 45%, var(--surface)) 3px 6px); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pistachio-ink) 25%, transparent); }
/* area icons */
.area-row { grid-template-columns: auto 1fr auto; }
.area-row .area-name { grid-column: 2; }
.area-row .swatches { grid-column: 2; }
.area-row .row-actions { grid-column: 3; }
.area-icon-btn { grid-row: 1; grid-column: 1; width: 40px; height: 40px; min-height: var(--control-md); padding: 0; display: grid; place-items: center; border-radius: 10px; background: var(--cb); color: var(--co, var(--ink-fixed)); }
.area-icon-btn[aria-expanded="true"] { box-shadow: inset 0 0 0 2px var(--ink); }
.area-icon-grid { grid-column: 1 / -1; color: var(--ink); }
.area-head .area-icon { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--cb); color: var(--co, var(--ink-fixed)); flex: none; }
/* "Light rose" made lighter and cooler so it reads differently from baby pink */
:root { --rose: #FDE3EF; --rose-soft: #FEF2F8; --rose-ink: #A0456F; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --rose: #EDC9DA; --rose-soft: #3C2B33; --rose-ink: #F2C6DA; } }
:root[data-theme="dark"] { --rose: #EDC9DA; --rose-soft: #3C2B33; --rose-ink: #F2C6DA; }
:root[data-palette="2"] { --rose: #F8E7EF; --rose-soft: #FCF4F8; --rose-ink: #8E4A68; }
@media (prefers-color-scheme: dark) { :root[data-palette="2"]:not([data-theme="light"]) { --rose: #E6D0DA; --rose-soft: #3A2F34; --rose-ink: #F0D3E0; } }
:root[data-palette="2"][data-theme="dark"] { --rose: #E6D0DA; --rose-soft: #3A2F34; --rose-ink: #F0D3E0; }
/* peach: more saturated so it doesn't read as beige */
:root { --peach: #FCC39B; --peach-soft: #FEE8D8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --peach: #EEB487; } }
:root[data-theme="dark"] { --peach: #EEB487; }
:root[data-palette="2"] { --peach: #EEC9B4; --peach-soft: #F8EAE1; }
@media (prefers-color-scheme: dark) { :root[data-palette="2"]:not([data-theme="light"]) { --peach: #DDB9A4; } }
:root[data-palette="2"][data-theme="dark"] { --peach: #DDB9A4; }
/* peach: the original pinkish peach, just deeper */
:root { --peach: #F3BEA3; --peach-soft: #FBE7DC; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --peach: #E2AE95; } }
:root[data-theme="dark"] { --peach: #E2AE95; }
:root[data-palette="2"] { --peach: #E9C4B4; --peach-soft: #F7E9E2; }
@media (prefers-color-scheme: dark) { :root[data-palette="2"]:not([data-theme="light"]) { --peach: #D9B4A5; } }
:root[data-palette="2"][data-theme="dark"] { --peach: #D9B4A5; }
/* peach: pinker, less orange */
:root { --peach: #F2C0B2; --peach-soft: #FBE9E4; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --peach: #E1B0A3; } }
:root[data-theme="dark"] { --peach: #E1B0A3; }
:root[data-palette="2"] { --peach: #EAC6BB; --peach-soft: #F7EBE6; }
@media (prefers-color-scheme: dark) { :root[data-palette="2"]:not([data-theme="light"]) { --peach: #D9B6AB; } }
:root[data-palette="2"][data-theme="dark"] { --peach: #D9B6AB; }
/* peach: a touch more muted */
:root { --peach: #E9C5BA; --peach-soft: #F8ECE8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --peach: #D8B5AA; } }
:root[data-theme="dark"] { --peach: #D8B5AA; }
/* the "peach" swatch is now a light red */
:root { --peach: #F2AFAE; --peach-soft: #FCE7E7; --peach-ink: #9A3338; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --peach: #E09E9D; --peach-soft: #3E2626; --peach-ink: #F2B3B2; } }
:root[data-theme="dark"] { --peach: #E09E9D; --peach-soft: #3E2626; --peach-ink: #F2B3B2; }
:root[data-palette="2"] { --peach: #E4B7B5; --peach-soft: #F6E8E7; --peach-ink: #8A4442; }
@media (prefers-color-scheme: dark) { :root[data-palette="2"]:not([data-theme="light"]) { --peach: #D3A7A5; --peach-soft: #3A2C2B; --peach-ink: #EBC2C0; } }
:root[data-palette="2"][data-theme="dark"] { --peach: #D3A7A5; --peach-soft: #3A2C2B; --peach-ink: #EBC2C0; }
/* baby pink: brighter, leaning magenta */
:root { --pink: #F6C3D8; --pink-soft: #FCE8F0; --pink-ink: #A2336A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --pink: #E7B2C9; --pink-soft: #41283A; --pink-ink: #F3BBD3; } }
:root[data-theme="dark"] { --pink: #E7B2C9; --pink-soft: #41283A; --pink-ink: #F3BBD3; }
/* Theme 2 keeps its own Queen Pink */
:root[data-palette="2"] { --pink: #E8CCD7; --pink-soft: #F5E8ED; --pink-ink: #8A4C64; }
@media (prefers-color-scheme: dark) { :root[data-palette="2"]:not([data-theme="light"]) { --pink: #DDBFCB; --pink-soft: #3E3036; --pink-ink: #EDC6D5; } }
:root[data-palette="2"][data-theme="dark"] { --pink: #DDBFCB; --pink-soft: #3E3036; --pink-ink: #EDC6D5; }
/* purples for areas: pastel purple (lavender) and a deeper purple (violet) */
:root { --violet: #C6B1EC; --violet-soft: #EEE7FA; --violet-ink: #5B3A9A; --on-violet: var(--ink-fixed); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --violet: #B9A4E0; --violet-soft: #30283F; --violet-ink: #D4C4F3; } }
:root[data-theme="dark"] { --violet: #B9A4E0; --violet-soft: #30283F; --violet-ink: #D4C4F3; }
:root[data-palette="2"] { --violet: #BFB4D6; --violet-soft: #ECE8F3; --violet-ink: #554874; }
@media (prefers-color-scheme: dark) { :root[data-palette="2"]:not([data-theme="light"]) { --violet: #B2A7C9; --violet-soft: #312D3B; --violet-ink: #D3CBE6; } }
:root[data-palette="2"][data-theme="dark"] { --violet: #B2A7C9; --violet-soft: #312D3B; --violet-ink: #D3CBE6; }

/* ---------- greeting: wraps like normal text, the name stays whole ----------
   Only the first line steps around the buttons; "afternoon, Natasha" can share a line. */
.greeting h1 { display: block; padding-right: 0; min-height: 0; }
.greeting-spacer { float: right; width: calc(var(--bar-w, 150px) + var(--s3)); height: var(--head-h); }
.greeting-hello, .greeting-name { display: inline; }
.greeting-name { white-space: nowrap; }
@media (max-width: 899px) {
  .greeting h1 { font-size: clamp(2rem, 9vw, 3rem); line-height: 1.04; }
  /* keep the greeting the largest text on phones */
  .view-head h1 { font-size: var(--text-4xl); }
  .m-big:not(.small) { font-size: var(--text-4xl); }
}

/* ---------- sync status: smaller and quieter ---------- */
.sync { font-size: var(--text-2xs); color: var(--ink-faint); opacity: .8; font-style: normal; }
@media (max-width: 899px) {
  /* on phones it sits under the round buttons instead of beside them */
  .topbar .sync { position: absolute; top: calc(100% + 4px); right: 4px; font-size: var(--text-2xs); white-space: nowrap; }
}
.m-tile-name .project-icon { width: 22px; height: 22px; border-radius: 7px; background: var(--cs); color: var(--c); align-items: center; justify-content: center; }

/* ---------- Mobile matrix: every card gets its own "Add a task"; one left edge for everything ---------- */
@media (max-width: 899px) {
  /* headings start where the task text inside the card starts */
  .matrix .quad-cell .quad-head { padding: 0 0 0 16px; }
  /* "+ Add a task" and "1 more" line up with the task titles; the plus glyph's own inset is taken out */
  .matrix .quad .inline-add { padding-left: 3px; }
  .matrix .quad .text-btn.small { padding-left: 6px; }
  .matrix .quad .inline-add-form { padding-left: 6px; padding-right: 4px; }
  .matrix .quad .inline-add-form input { min-width: 0; width: 100%; }
  /* the tick circle sits centred on the first line of the title */
  /* smaller tick circle, centred on the first line of the title: body padding + half the leftover line height */
  .matrix .quad .todo-check, .quad-focus .quad .todo-check {
    width: 18px; height: 18px; min-height: 18px;
    margin-top: calc(8px + (var(--q-title-fs, var(--text-sm)) * 1.35 - 18px) / 2);
  }
  .matrix .quad .todo-check svg { width: 12px; height: 12px; }
  .matrix .quad .todo-title { font-size: var(--q-title-fs, var(--text-sm)); line-height: 1.35; }
  .matrix .quad .todo-body { padding-top: 8px; }
  /* To sort: the add button lines up with the heading */
  .tray > .inline-add { padding-left: 3px; }
  .tray-empty { padding-left: 6px; }
}

/* ---------- Day timeline: tap an empty spot to add a one-hour event ---------- */
.schedule[title] { cursor: pointer; }
.schedule .slot { cursor: pointer; }
.slot.slot-draft {
  background: color-mix(in srgb, var(--pink) 55%, transparent); color: var(--ink);
  box-shadow: inset 0 0 0 1.5px var(--pink-ink); pointer-events: none; z-index: 1;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .slot.slot-draft { color: var(--ink-fixed); background: var(--pink); } }
:root[data-theme="dark"] .slot.slot-draft { color: var(--ink-fixed); background: var(--pink); }
.field-grid.field-grid-two { grid-template-columns: repeat(2, minmax(0, 1fr)); }

/* ---------- preview only: Empty / Filled switch, pinned top centre ---------- */
.preview-toggle {
  position: fixed; z-index: 60; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  display: inline-grid; grid-template-columns: auto auto; box-shadow: 0 6px 18px -10px rgba(0, 0, 0, .35);
}
.preview-toggle button { min-height: var(--control-sm); padding: 0 14px; font-size: var(--text-xs); }
@media (max-width: 899px) { .shell:has(> .preview-toggle) .content { padding-top: calc(env(safe-area-inset-top) + 72px); } }

/* Due today's label sits on the same line as "Friday" in the Today tile, not centred in its header */
.due-head { align-items: flex-start; }
.due-head .tile-label { line-height: 1.2; padding-top: 4px; }
@media (max-width: 480px) { .due-head .tile-label { padding-top: 2px; } }

/* ---------- Day strip (Calendar) styled like the Projects two-week strip ----------
   Label on the left, serif number on the right, weekends on the sunken grey.
   The chosen day (Calendar) and today (Projects) get a pink highlighter stroke on the number only. */
.day-strip { gap: 8px; }
.day-pick, .day-pick[aria-checked="true"], .day-pick[data-today], .day-pick[aria-checked="true"][data-today] {
  display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr; align-items: start; gap: 6px 4px;
  min-height: 84px; padding: 12px 12px 10px; text-align: left;
  background: var(--surface); color: var(--ink); box-shadow: none; border-radius: var(--radius-xl);
}
.day-pick[data-weekend] { background: var(--surface-sunken); }
.day-pick .day-pick-dow, .day-pick[aria-checked="true"] .day-pick-dow { align-self: center; font-size: var(--text-sm); font-weight: 400; color: var(--ink-muted); }
.day-pick[data-today] .day-pick-dow { color: var(--ink); font-weight: 600; }
.day-pick .dp-short { display: none; }
.day-pick .day-pick-num, .day-pick[data-today] .day-pick-num, .day-pick[aria-checked="true"] .day-pick-num, .day-pick[aria-checked="true"][data-today] .day-pick-num {
  width: auto; height: auto; display: inline-block; border-radius: 0; background: none; padding: 0;
  font-family: var(--font-display, "Instrument Serif", Georgia, serif); font-weight: 400; font-size: var(--text-3xl); line-height: 1; color: var(--ink);
}
.day-pick .day-pick-dots, .day-pick[aria-checked="true"] .day-pick-dots { grid-column: 1 / -1; align-self: end; text-align: left; color: var(--ink-muted); }
.day-pick[aria-checked="true"] .day-pick-num, .day-pick[aria-checked="true"][data-today] .day-pick-num,
.strip-day[data-today] .strip-num {
  padding-inline: 0.12em; margin-inline-end: -0.12em;
  background: linear-gradient(to bottom, transparent 50%, color-mix(in srgb, var(--pink) var(--hl-mix, 100%), transparent) 50%, color-mix(in srgb, var(--pink) var(--hl-mix, 100%), transparent) 90%, transparent 90%);
}
/* Projects strip: today is an ordinary tile now, only its number is highlighted */
.strip-day[data-today] { background: var(--surface); color: inherit; }
.strip-day[data-today][data-weekend] { background: var(--surface-sunken); }
.strip-day[data-today] .strip-dow { color: var(--ink); font-weight: 600; }
.strip-day[data-today] .strip-num { color: var(--ink); }
.strip-day[data-today] .strip-item { background: var(--cs); }
/* phones: seven narrow tiles, so the letter sits above the number */
@media (max-width: 640px) {
  .day-strip { gap: 4px; }
  .day-pick, .day-pick[aria-checked="true"], .day-pick[data-today], .day-pick[aria-checked="true"][data-today] {
    grid-template-columns: 1fr; justify-items: center; text-align: center; min-height: 0; padding: 8px 2px 6px; gap: 4px; border-radius: var(--radius-md);
  }
  .day-pick .dp-long { display: none; }
  .day-pick .dp-short { display: inline; }
  .day-pick .day-pick-num, .day-pick[aria-checked="true"] .day-pick-num { font-size: var(--text-2xl); }
  .day-pick .day-pick-dots, .day-pick[aria-checked="true"] .day-pick-dots { text-align: center; }
}
/* Month view: today's number gets the pink highlighter stroke, not a circle */
.month-cell[data-today] .cell-num {
  width: auto; min-width: 0; border-radius: 0; color: var(--ink); font-weight: 600; padding-inline: 0.18em;
  background: linear-gradient(to bottom, transparent 48%, color-mix(in srgb, var(--pink) var(--hl-mix, 100%), transparent) 48%, color-mix(in srgb, var(--pink) var(--hl-mix, 100%), transparent) 82%, transparent 82%);
}
/* Week view: today's number keeps the ink colour and gets the pink highlighter stroke, like the other date views */
.day[data-today] .day-num {
  color: var(--ink); width: fit-content; padding-inline: 0.1em; margin-inline-start: -0.1em; background-color: transparent;
  background-image: linear-gradient(to bottom, transparent 50%, color-mix(in srgb, var(--pink) var(--hl-mix, 100%), transparent) 50%, color-mix(in srgb, var(--pink) var(--hl-mix, 100%), transparent) 88%, transparent 88%);
}
.day[data-today] .day-name { color: var(--ink); font-weight: 600; }
/* Dates are never bold: the pink highlighter is the only "today" / "selected" marker on a date number */
.strip-day[data-today] .strip-num, .strip-num,
.month-cell[data-today] .cell-num, .cell-num,
.day-pick .day-pick-num, .day-pick[data-today] .day-pick-num, .day-pick[aria-checked="true"] .day-pick-num, .day-pick[aria-checked="true"][data-today] .day-pick-num,
.day[data-today] .day-num, .day-num,
.ml-day[data-today] .ml-dnum, .ml-dnum,
.cal-num { font-weight: 400; }
/* Projects: a small label above the two-week strip, same style as the "Projects" / "Unbudgeted" labels on Budgeting */
.due-strip-wrap .strip-label {
  margin: 0 0 var(--s2); padding: 0; background: none; font-family: var(--font-sans); font-size: var(--text-xs); font-weight: 600;
  line-height: 1.3; letter-spacing: .02em; color: var(--ink-soft);
}
/* keyboard hints only where there's a keyboard and a mouse */
@media (hover: none), (pointer: coarse) { .key-hint { display: none; } }
/* Meals: today's date uses the same pink highlighter as every other date */
.ml-day[data-today] .ml-dnum { --hl-c: color-mix(in srgb, var(--pink) var(--hl-mix, 100%), transparent); }

/* ---------- polish pass ---------- */
/* A screen-reader label inside the scrolling two-week strip escaped the strip and widened the page on phones */
.due-strip, .strip-item, .todo-proj-icon { position: relative; }
/* Readable secondary text: weekday labels and "Add" on Meals sit at 4.5:1 or better */
.strip-dow { color: var(--ink-muted); }
.ml-add { color: var(--ink-muted); }
.ml-groc li[data-done] .ml-groc-name { color: var(--ink-muted); }
.ml-slot-label { font-size: var(--text-2xs); }
/* Fingertip-sized tap areas on touch screens without changing how things look:
   an invisible 44px hit area around small controls */
@media (pointer: coarse) {
  .check, .todo-check, .m-card-foot, .m-stack-title, .m-stack-legend button, .ml-food-seg { position: relative; }
  .check::before, .todo-check::before { content: ''; position: absolute; inset: -13px; }
  .m-card-foot::before, .m-stack-title::before, .m-stack-legend button::before { content: ''; position: absolute; inset: -10px -4px; }
  .ml-food-seg::before { content: ''; position: absolute; inset: -11px 0; }
  .ml-slot[data-slot="others"] { min-height: var(--control-lg); }
}
/* long project or category names end in an ellipsis instead of being cut mid-letter */
.m-tile-name { min-width: 0; }
.m-tile-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Settings › Areas: move/remove buttons sit on the same line as the name box, not floating between rows */
.area-row .row-actions { grid-row: 1; align-self: center; }
/* Projects strip: "Overdue" sits on the same line as "Today" and the day names, even without a number beside it */
.strip-head { min-height: 1.75rem; align-items: center; }
/* one safety net for every animation and transition when the device asks for reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}
/* Overdue sits above the two-week strip at every width (it used to scroll away as the first column on phones) */
.due-strip-wrap > .strip-overdue {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3);
  min-height: 0; margin-bottom: 6px; padding: var(--s3) var(--s4);
}
.due-strip-wrap > .strip-overdue .strip-head { margin: 0; flex: none; min-height: 0; }
.due-strip-wrap > .strip-overdue ul { display: flex; flex-direction: row; flex-wrap: wrap; gap: var(--s2); }
/* Projects: cards keep a card width on narrower screens too, so a lone project doesn't stretch across the page */
@media (max-width: 899px) { .project-list { grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); } }
/* Overdue: a plain checklist (tick circle, icon, title, due date) instead of coloured pills */
.due-strip-wrap > .strip-overdue { display: block; }
.due-strip-wrap > .strip-overdue .strip-head { margin-bottom: 4px; }
.overdue-list { display: grid !important; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: 0 var(--s5) !important; }
.overdue-row { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 0; border-top: 1px solid color-mix(in srgb, var(--danger) 14%, transparent); }
.overdue-row .overdue-check { width: 20px; height: 20px; min-height: 20px; margin-top: 1px; background: transparent; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--ink) 40%, transparent); }
.overdue-row .overdue-check:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
.overdue-body { display: flex; flex-direction: column; gap: 1px; text-align: left; min-width: 0; color: var(--ink); }
.overdue-title { font-size: var(--text-md); font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.overdue-title .todo-proj-icon { margin-right: 5px; vertical-align: -2px; color: var(--ink-muted); }
.overdue-date { font-size: var(--text-xs); color: var(--danger); }
.overdue-body:hover .overdue-title { text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
@media (max-width: 640px) { .overdue-list { grid-template-columns: 1fr; } }
/* Overdue band lines up with the two-week strip below it, which bleeds 16px into the side margins on narrower screens */
@media (max-width: 899px) { .due-strip-wrap > .strip-overdue { margin-inline: -16px; } }

/* ---------- To-do cards: a small "+ Add" pinned to each card's bottom left ---------- */
/* margin-top: auto pushes it to the bottom of the card, so it sits at the same height in every card. */
.card-add { margin-top: auto; padding-top: var(--s1); }
.card-add .inline-add, .matrix .quad .card-add .inline-add {
  min-height: var(--control-xs); padding: 0 var(--s1); gap: 3px; margin: 0;
  font-size: var(--text-xs); white-space: nowrap; color: inherit; opacity: .6;
  border-radius: var(--radius-sm); transition: opacity .15s var(--ease-2);
}
.card-add .inline-add:hover, .card-add .inline-add:focus-visible { opacity: 1; }
.card-add .inline-add svg { width: 13px; height: 13px; flex: none; }
.tray .card-add .inline-add { color: var(--ink-soft); }
@media (prefers-reduced-motion: reduce) { .card-add .inline-add { transition: none; } }
.inline-add-rest { white-space: pre; }
/* "2 more" under the Bills card's list; the rest open in the Bills drawer */
.m-bill-more { align-self: flex-start; padding-left: 0; }
/* the Bills drawer's title, at page-title scale */
.m-bills-heading { font-size: var(--text-4xl); line-height: 1.1; }
.m-bills-head { width: 100%; text-align: left; color: inherit; min-height: var(--control-lg); margin: -10px 0 -8px; align-items: center; border-radius: var(--radius-sm); }
.m-bills-head:hover .m-stack-title { text-decoration: underline; text-underline-offset: 3px; }
.m-bills-head:hover .m-stack-title svg { opacity: 1; transform: translate(1px, -1px); }
/* phones: the quadrant header ("Do ↗") is one wide tap target that opens it full screen */
.quad-open { display: inline-flex; opacity: .55; transition: transform 120ms, opacity 120ms; }
.quad-title:not(:disabled) { width: 100%; min-height: var(--control-lg); }
.quad-title:not(:disabled):hover .quad-open { opacity: 1; transform: translate(1px, -1px); }
.matrix .quad-cell .quad-title .quad-open { margin-left: -6px; } /* 4px after the name, not the header's 10px gap */
/* desktop: the To sort picker floats under the grid button while the mouse is over it */
.tray li { position: relative; }
.row-picker-pop {
  position: absolute; right: 0; top: calc(100% - 6px); z-index: 5; width: 17rem; padding: 8px;
  background: var(--surface); border-radius: var(--radius-md); box-shadow: 0 0 0 1px var(--line), var(--shadow-lift);
}
/* "Up to date, 2:57am" doubles as a check-now button */
.sync-now { cursor: pointer; padding: 0; background: none; text-align: right; }
.sync-now:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
/* event sheet: "Add to Google Calendar" */
.gcal-add { align-self: flex-start; text-decoration: none; }
.gcal-add svg { flex: none; }
.cal-toggles { margin: calc(-1 * var(--s3)) 0 var(--s4); }
/* project cards: "Next" sits on its own line under the progress count, date pill first */
.project-next { display: flex; align-items: baseline; gap: 8px; min-width: 0; color: inherit; }
.project-next-date {
  flex: none; padding: 2px 9px; border-radius: var(--radius-pill); font-size: var(--text-xs); font-weight: 600;
  background: color-mix(in srgb, currentColor 12%, transparent); white-space: nowrap;
}
.project-next-date[data-late] { color: var(--danger); }
.project-next-title { font-weight: 500; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
/* Google Calendar events: plain rows and blocks with nothing to open, so no pointer or hover */
.is-static { cursor: default; }
.entry-body.is-static:hover .entry-title { text-decoration: none; }
.cell-entry.is-static:hover { background: none; }
.slot.is-static:hover { filter: none; }
.peek-row.is-static:hover { background: none; }
.proj-new-list { white-space: nowrap; }
.project-tools { flex-wrap: wrap; }
.plists { scroll-margin-top: 80px; } /* clear of the top bar when "+ Checklist" scrolls here */
/* To-do header: project filter on the left, one "Add task" on the right */
.todo-head { justify-content: space-between; align-items: center; }
.todo-head .proj-filter { margin-left: 0; }
.todo-add { flex: none; display: inline-flex; align-items: center; gap: 4px; min-height: var(--control-sm); padding: 0; font-size: var(--text-sm); } /* same size as "All projects" */
</style>
