.area-block .area-head { --hl: var(--cb); }
.quad-cell[data-q="do"] { --hl: var(--pink); }
.quad-cell[data-q="schedule"] { --hl: var(--pistachio); }
.quad-cell[data-q="delegate"] { --hl: var(--yellow); }
.quad-cell[data-q="drop"] { --hl: var(--snow); }
.content { --hl-mix: 100%; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .content { --hl-mix: 34%; } }
:root[data-theme="dark"] .content { --hl-mix: 34%; }

.view-head h1, .greeting-name, .project-title-row h1, .cal-sub h2, .month-title, .area-head h2, .tray-head h2,
.quad-name, .todo-head h2, .day-title, .m-month-name, .m-h2, .panel h2, .gantt-area .gantt-label {
  --hl-c: color-mix(in srgb, var(--hl) var(--hl-mix), transparent);
  width: fit-content;
  background-image: linear-gradient(to bottom, transparent 52%, var(--hl-c) 52%, var(--hl-c) 92%, transparent 92%);
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
  padding-inline: 0.14em; margin-inline-start: -0.14em;
}
/* the highlight is for section headings only, not the big page titles */
.view-head h1, .greeting-name, .project-title-row h1 { background-image: none; padding-inline: 0; margin-inline-start: 0; }
/* headings with a dot or a count: highlight the words only */
.area-head h2, .tray-head h2 { background-image: none; padding-inline: 0; margin-inline-start: 0; }
.area-head .hl-text, .tray-head .hl-text {
  --hl-c: color-mix(in srgb, var(--hl) var(--hl-mix), transparent);
  background-image: linear-gradient(to bottom, transparent 52%, var(--hl-c) 52%, var(--hl-c) 92%, transparent 92%);
  -webkit-box-decoration-break: clone; box-decoration-break: clone; padding-inline: 0.14em;
}
/* the dot in an area heading uses the same pastel as its highlight */
.area-head .area-swatch { background: var(--cb); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent); }

/* ---------- project lists ---------- */
.proj-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s5); }
.proj-body .plists { order: -1; }
@media (min-width: 1100px) {
  .proj-body { grid-template-columns: minmax(0, 1fr) 20rem; gap: var(--s6); align-items: start; }

}
.plists { display: flex; flex-direction: column; gap: var(--s2); min-width: 0; }
.plists-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
.plists-title { font-family: var(--font-display); font-weight: 400; font-size: 1.625rem; line-height: 1.1; }
.plists-title .hl-text {
  --hl-c: color-mix(in srgb, var(--cb) var(--hl-mix, 100%), transparent);
  background-image: linear-gradient(to bottom, transparent 52%, var(--hl-c) 52%, var(--hl-c) 92%, transparent 92%);
  padding-inline: 0.14em; margin-inline-start: -0.14em;
}
.plists-head .text-btn { display: inline-flex; align-items: center; gap: 4px; }
.plists-empty { margin: 0; font-size: 0.875rem; color: var(--ink-soft); }
.plist-new input { width: 100%; }
.plist { background: var(--surface); border-radius: var(--radius-lg); box-shadow: inset 0 0 0 1px var(--line); padding: 8px 10px 6px; }
.plist-head { position: relative; display: flex; align-items: center; gap: 4px; }
.plist-toggle { width: 28px; height: 28px; display: grid; place-items: center; color: var(--ink-soft); border-radius: var(--radius-sm); flex: none; }
.plist-toggle:hover { background: var(--surface-sunken); color: var(--ink); }
.plist-name { flex: 1; min-width: 0; text-align: left; font-weight: 600; font-size: 0.9375rem; color: inherit; padding: 4px 2px; overflow-wrap: anywhere; }
.plist-name-input { flex: 1; min-width: 0; min-height: 32px; height: 32px; padding: 2px 8px; font-weight: 600; }
.plist-count { font-size: 0.8125rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.plist-more { width: 30px; height: 30px; min-height: 30px; color: var(--ink-soft); }
.plist-bar { display: block; height: 4px; margin: 4px 4px 6px; border-radius: 2px; background: var(--surface-sunken); overflow: hidden; }

.plist-items { display: flex; flex-direction: column; min-height: 6px; }
.plist-items > li:not(.drop-line) {
  display: grid; grid-template-columns: 14px 26px minmax(0, 1fr) auto; align-items: center; gap: 4px;
  padding: 1px 0; border-radius: var(--radius-sm); touch-action: pan-y; user-select: none; -webkit-user-select: none;
}

@media (hover: none) { .plist-grip { opacity: .6; } }
.plist-items .check { width: 22px; height: 22px; min-height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line-strong); display: grid; place-items: center; color: var(--ink-fixed); background: transparent; }
.plist-items .check[aria-pressed="true"] { background: var(--cb, var(--pistachio)); box-shadow: inset 0 0 0 1.5px var(--c); }
.plist-text { border: 0; background: transparent; min-height: 34px; padding: 4px 6px; font-size: 0.9375rem; min-width: 0; width: 100%; user-select: text; -webkit-user-select: text; }
.plist-text:focus { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong); outline: none; }
.plist-items li[data-done] .plist-text { color: var(--ink-faint); text-decoration: line-through; }
.plist-actions { display: inline-flex; opacity: 0; }
.plist-items > li:hover .plist-actions, .plist-items > li:focus-within .plist-actions { opacity: 1; }
@media (hover: none) { .plist-actions { opacity: 1; } .plist-actions .icon-btn:first-child { display: inline-grid; } }
.plist-actions .icon-btn { width: 30px; height: 30px; min-height: 30px; color: var(--ink-soft); }
.plist-actions .icon-btn:hover { color: var(--ink); }
.plist-add { margin-top: 2px; }
.plist-add input { min-height: 36px; }
.plist .drop-line { border: 1.5px dashed var(--line-strong); border-radius: var(--radius-sm); background: transparent; list-style: none; }

/* done things: greyed out and struck through, everywhere */
.mk-done, .mk-done .mk-done-text { color: var(--ink-faint); }
.mk-done-text { text-decoration: line-through; }
.entry[data-done] .entry-title, .card-tile[data-done] .card-title, .todo-row[data-done] .todo-title,
li[data-done] .cell-title, .all-day li[data-done] .all-day-body, .m-row[data-done] .m-row-title {
  color: var(--ink-faint); text-decoration: line-through; text-decoration-color: currentColor; font-weight: 400;
}
.card-tile[data-done] .card-meta, .entry[data-done] .entry-meta { opacity: .7; }
.mark-key .mk-done span { color: var(--ink-faint); } .mk-done-text { font-weight: 400; }

/* matrix and tray rows: a tick box, then the kind mark, then the title */
.todo-row, .quad .todo-row, .quad-focus .quad .todo-row { grid-template-columns: 30px 16px minmax(0, 1fr) auto; }
.todo-row .mark, .quad .todo-row .mark { width: 16px; height: 36px; }
.todo-check {
  align-self: start; margin-top: 7px; width: 22px; height: 22px; min-height: 22px; border-radius: 50%;
  display: grid; place-items: center; background: transparent; color: var(--ink-fixed);
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, currentColor 45%, transparent); cursor: pointer;
}
.quad .todo-check { color: inherit; }
.todo-check:hover { box-shadow: inset 0 0 0 1.5px currentColor; }
.todo-check[aria-pressed="true"] { background: var(--ink-fixed); color: var(--cream); box-shadow: none; }
.tray .todo-check[aria-pressed="true"] { background: var(--ink); color: var(--canvas); }
.todo-row[data-done] { cursor: default; }
.todo-row[data-done] .mark, .todo-row[data-done] .card-meta { opacity: .5; }
.quad .todo-row[data-done] .todo-title { color: inherit; opacity: .55; }
@media (max-width: 899px) { .quad .todo-row { grid-template-columns: 28px 14px minmax(0, 1fr) auto; } .quad .todo-row .mark { width: 14px; } }
/* tick box on the right */
.todo-row, .quad .todo-row, .quad-focus .quad .todo-row { grid-template-columns: 24px minmax(0, 1fr) auto auto; padding-right: 8px; }
.todo-row .mark, .quad .todo-row .mark { width: 24px; }
.todo-check { margin: 9px 0 0 8px; }
@media (max-width: 899px) { .quad .todo-row { grid-template-columns: 20px minmax(0, 1fr) auto auto; padding-right: 4px; } .quad .todo-row .mark { width: 20px; } .todo-check { margin-left: 4px; } }
/* every task title in the matrix, To sort and Due today is bold, not just deadlines */
.todo-title, .todo-title[data-kind], .due-title { font-weight: 600; }
.todo-row[data-done] .todo-title { font-weight: 600; }


/* matrix: no task/deadline marks; a due date shows with the flower */
.todo-row, .quad .todo-row, .quad-focus .quad .todo-row { grid-template-columns: minmax(0, 1fr) auto auto; padding-left: 10px; }
@media (max-width: 899px) { .quad .todo-row { grid-template-columns: minmax(0, 1fr) auto auto; padding-left: 6px; } }
.todo-row .todo-body { padding-left: 0; }
.due-chip { display: inline-flex; align-items: baseline; gap: 3px; }
.due-flower { font-weight: 700; font-size: 1.05em; line-height: 0; transform: translateY(0.12em); }
.due-flower { font-size: 1.5em; transform: translateY(0.3em); margin-right: 1px; } .due-chip { gap: 2px; }
/* no flower anywhere: dated tasks use the same dot as other tasks */
.glyph-deadline { font-size: inherit; transform: none; }
.card-tile[data-kind="deadline"] .card-mark, .strip-item[data-kind="deadline"] .strip-mark, .due-list li[data-kind="deadline"] .due-mark { font-size: inherit; line-height: inherit; transform: none; }
/* bills in Due today: the $ sits in a little coin, the cost on its own line */
.due-list li[data-bill] { grid-template-columns: 24px 1fr; align-items: start; }
.due-list li[data-bill] .due-mark {
  width: 22px; height: 22px; margin-top: 1px; border-radius: 50%; display: grid; place-items: center;
  background: var(--sand-soft, var(--yellow-soft)); color: var(--sand-ink, var(--yellow-ink)); font-size: 0.8125rem; font-weight: 700; line-height: 1;
}
.due-cost { font-size: 0.8125rem; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; margin-top: 1px; }
.due-cost-tag { font-weight: 400; color: var(--ink-soft); }
.tile-due-all .due-list li:not(.cal-more) { grid-template-columns: 24px 1fr; } .tile-due-all .due-mark { text-align: center; justify-self: center; }

/* ---------- Meals ---------- */
.content[data-page="meals"] { --hl: var(--peach); }
.ml-summary { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 0 0 var(--s4); font-size: 0.9375rem; color: var(--ink-soft); }
.ml-summary strong { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.ml-summary .m-over strong, .ml-summary .m-over { color: var(--danger); }
.ml-week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-bottom: var(--s6); }
.ml-day { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ml-day-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 2px; }
.ml-dow { font-size: 0.8125rem; color: var(--ink-soft); }

.ml-slot {
  display: flex; flex-direction: column; gap: 2px; min-height: 84px; padding: 9px 10px; text-align: left; color: var(--ink);
  border-radius: var(--radius-md); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); min-width: 0;
}

.ml-slot[data-slot="lunch"]:not([data-empty]) { background: var(--pistachio-soft); }
.ml-slot[data-slot="dinner"]:not([data-empty]) { background: var(--peach-soft); }
.ml-slot[data-empty] { background: transparent; box-shadow: inset 0 0 0 1px var(--line); border: 0; }
.ml-slot-label { font-size: 0.6875rem; letter-spacing: 0.02em; color: var(--ink-soft); font-weight: 600; }
.ml-meal { font-size: 0.875rem; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.ml-cost { font-size: 0.75rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; margin-top: auto; }
.ml-add { display: inline-flex; align-items: center; gap: 3px; font-size: 0.8125rem; color: var(--ink-faint); margin-top: auto; }
.ml-slot[data-empty]:hover .ml-add { color: var(--ink); }
@media (max-width: 899px) {
  .ml-week { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .ml-day { display: grid; grid-template-columns: 44px repeat(3, minmax(0, 1fr)); gap: 6px; align-items: stretch; padding: 4px 0; border-top: 1px solid var(--line); }

}

.ml-groc-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); margin-bottom: var(--s2); }

.ml-groc { display: flex; flex-direction: column; }

.ml-groc li:first-child { border-top: 0; }
.ml-groc .check { width: 22px; height: 22px; min-height: 22px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px var(--line-strong); background: transparent; color: var(--ink-fixed); }

.ml-groc-text { display: flex; flex-direction: column; min-width: 0; padding: 4px 0; }

.ml-qty { color: var(--ink-soft); font-size: 0.875rem; }

.ml-groc .icon-btn { width: 32px; height: 32px; min-height: 32px; color: var(--ink-soft); opacity: .6; }
.ml-groc li:hover .icon-btn { opacity: 1; }
.ml-bought-head { display: flex; justify-content: space-between; align-items: center; margin-top: var(--s4); }
.ml-recipes { display: flex; flex-direction: column; gap: 4px; }
.ml-recipe { width: 100%; display: flex; flex-direction: column; gap: 2px; text-align: left; color: inherit; padding: 10px 12px; border-radius: var(--radius-md); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.ml-recipe:hover { box-shadow: inset 0 0 0 1px var(--line-strong); }
.ml-recipe-name { font-weight: 600; font-size: 0.9375rem; }
.ml-pick { flex-wrap: wrap; }
.ml-pick .chip[aria-checked="true"] { background: var(--peach); color: var(--on-peach); }
.ml-ings { display: flex; flex-direction: column; gap: 6px; }
.ml-ings li { display: grid; grid-template-columns: minmax(0, 1fr) 7.5rem 34px; gap: 6px; align-items: center; }
@media (min-width: 900px) { .ml-day-head { height: 34px; align-items: center; } }
.ml-day[data-today] .ml-dnum { width: 1.5em; height: 1.5em; font-size: 1.25rem; }

/* ---------- matrix: project on each task, and a project filter ---------- */
.card-meta .todo-proj { gap: 4px; min-width: 0; }

.todo-head .todo-summary { margin-left: auto; }

.proj-filter-btn {
  display: inline-flex; align-items: center; gap: 5px; min-height: 32px; padding: 0 10px;
  border-radius: 999px; font-size: 0.875rem; color: var(--ink-soft); background: transparent;
  box-shadow: inset 0 0 0 1px var(--line); max-width: 14rem;
}

}

/* bill $ without the coin behind it */

.to-buy { margin-top: 0; margin-bottom: calc(var(--s6) + var(--s3)); }

/* ---------- Budgeting: spending as tiles, details in a side drawer ---------- */
.m-spend { margin-bottom: calc(var(--s6) + var(--s3)); }
.m-spend .m-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); }
.m-spend .m-h2 { background-image: none; padding-inline: 0; margin-inline-start: 0; }
.m-stack { display: flex; height: 10px; border-radius: 999px; overflow: hidden; gap: 2px; margin: var(--s2) 0 var(--s4); }

.m-tiles { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 700px) { .m-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1000px) { .m-tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.m-tile {
  width: 100%; height: 100%; display: flex; flex-direction: column; align-items: stretch; gap: 6px; text-align: left;

  min-height: 0; color: var(--ink);
}

.m-tile-num { font-variant-numeric: tabular-nums; font-size: 1.0625rem; font-weight: 600; }

.m-tile .m-bar { margin: 0; }
.m-tile-left, .m-tile-count { font-size: 0.8125rem; color: var(--ink-soft); }
.m-tile-left.m-over { color: var(--danger); font-weight: 600; }

/* side drawer: a bottom sheet on phones, a panel from the right on bigger screens */
@media (min-width: 700px) {

  .sheet.sheet-side {
    max-width: 28rem; width: 100%; max-height: none; height: 100%; border-radius: 0;
    padding-top: var(--s4); box-shadow: -1px 0 0 var(--rule-strong), -20px 0 50px -24px rgba(20, 30, 40, .35);
    animation: slide-in 240ms cubic-bezier(.2,.7,.2,1);
  }
}
@keyframes slide-in { from { transform: translateX(24px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .sheet.sheet-side { animation: none; } }
.m-drawer-head { display: flex; flex-direction: column; gap: 6px; }
.m-drawer-top { display: flex; align-items: center; justify-content: space-between; }
.m-drawer-top .project-area { display: inline-flex; align-items: center; gap: 6px; }
.m-drawer-month { display: flex; align-items: center; gap: 4px; margin-left: -8px; }
.m-drawer-month .sheet-heading { margin: 0; }
.m-drawer-list { display: flex; flex-direction: column; gap: var(--s3); }
.sheet-side .sheet-actions { position: sticky; bottom: calc(-1 * var(--s5)); background: var(--paper); padding: var(--s3) 0 var(--s2); margin-top: auto; }
.m-stack-wrap { position: relative; margin: var(--s2) 0 var(--s4); padding-top: 2px; }
.m-stack-wrap .m-stack { margin: 0; height: 12px; }
.m-stack-slice { all: unset; cursor: pointer; background: var(--cb); min-width: 4px; height: 100%; transition: opacity 120ms, transform 120ms; }
.m-stack-slice:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.m-stack-slice[data-dim] { opacity: .35; }
.m-stack-tip {
  position: absolute; bottom: calc(100% + 6px); transform: translateX(-50%); white-space: nowrap; pointer-events: none; z-index: 3;
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
  background: var(--surface); box-shadow: var(--shadow-sheet), inset 0 0 0 1px var(--line); font-size: 0.8125rem; color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.m-stack-tip strong { font-weight: 600; }
.m-stack-pct { color: var(--ink-soft); }
.m-stack-tip .m-dot { background: var(--cb); }
.m-stack-tip { bottom: auto; top: calc(100% + 6px); }
.m-stack-slice[data-dim] { opacity: .5; }
/* month bar, styled after the macOS storage bar */
.m-stack-card { padding: 16px 18px 14px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); margin: var(--s2) 0 var(--s4); }
.m-stack-top { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; margin-bottom: 10px; }
.m-stack-title { font-weight: 600; font-size: 1rem; }
.m-stack-sum { color: var(--ink-soft); font-size: 0.9375rem; font-variant-numeric: tabular-nums; }
.m-stack-card .m-stack-wrap { margin: 0; padding: 0; }
.m-stack-card .m-stack { height: 26px; border-radius: 7px; gap: 0; background: var(--surface-sunken); }
.m-stack-card .m-stack-slice { background: var(--c); box-shadow: inset -1px 0 0 var(--surface); min-width: 3px; }
.m-stack-left { display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden; background: var(--surface-sunken); box-shadow: inset 1px 0 0 var(--rule-strong); }
.m-stack-left span { font-size: 0.8125rem; font-weight: 600; color: var(--ink-soft); white-space: nowrap; padding: 0 8px; font-variant-numeric: tabular-nums; }
.m-stack-legend { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.m-stack-legend button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 0.8125rem; color: var(--ink-soft); padding: 2px 0; }
.m-stack-legend button:hover, .m-stack-legend button:focus-visible { color: var(--ink); }
.m-stack-legend button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
.m-stack-legend li[data-dim] { opacity: .5; }
.m-stack-key { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.m-stack-tip .m-dot { background: var(--c); }
.m-tiles-label { margin: var(--s4) 0 var(--s2); font-size: 0.8125rem; font-weight: 600; color: var(--ink-soft); letter-spacing: .02em; }
/* month bar: back to the pastel category colours */
.m-stack-card .m-stack-slice { background: var(--cb); box-shadow: inset -2px 0 0 var(--surface); }
.m-stack-key, .m-stack-tip .m-dot { background: var(--cb); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 25%, transparent); }
/* month bar sits straight on the page, no card */
.m-stack-card { padding: 0; background: none; box-shadow: none; border-radius: 0; }
.m-stack-top { justify-content: flex-end; margin-bottom: 8px; }
.m-stack-top { justify-content: space-between; }
.m-stack-title { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-weight: 600; font-size: 1rem; color: var(--ink); border-radius: 4px; }
.m-stack-title .icon, .m-stack-title svg { opacity: .55; transition: transform 120ms, opacity 120ms; }
.m-stack-title:hover { text-decoration: underline; text-underline-offset: 3px; }

.m-stack-title:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
/* buttons with a leading icon: icon and label on one centred line */
.primary:has(> svg), .secondary:has(> svg) { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.sheet-side .sheet-actions { align-items: center; }
.sheet-side .sheet-actions { border-top: 1px solid var(--rule); }
/* category icons */
.m-cat-edit li { grid-template-columns: 28px 32px minmax(0, 1fr) 9rem 36px; }
.m-icon-btn { width: 32px; height: 32px; min-height: 32px; padding: 0; display: grid; place-items: center; border-radius: 9px; background: var(--cs); color: var(--c); box-shadow: inset 0 0 0 1px var(--line); }

.m-icon-none { color: var(--ink-faint); }

.m-cat-icon { display: inline-flex; flex: none; color: var(--c); }
.m-tile-name .m-cat-icon { width: 22px; height: 22px; border-radius: 7px; background: var(--cs); align-items: center; justify-content: center; }
@media (max-width: 560px) { .m-cat-edit li { grid-template-columns: 28px 32px minmax(0, 1fr) 6.5rem 32px; } }
/* spending tiles: bars in the category's own pastel; only a busted budget turns red */
.m-tile .m-bar, .m-drawer-head .m-bar { height: 7px; border-radius: 4px; }
.m-tile .m-bar > span, .m-drawer-head .m-bar > span { background: var(--cb); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 14%, transparent); border-radius: 4px; }
.m-tile .m-bar[data-over] > span, .m-drawer-head .m-bar[data-over] > span { background: var(--danger); box-shadow: none; }
/* the greeting is the largest text in the app */
.greeting h1 { font-size: 3rem; line-height: 1.02; }
@media (min-width: 900px) { .greeting h1 { font-size: 4.5rem; } }
@media (max-width: 899px) { .m-big:not(.small) { font-size: 2.75rem; } }
.todo-head .proj-filter { margin-left: auto; }
/* the Today and Due cards line up with the Do and Schedule quadrants below */
@media (min-width: 640px) { .bento { max-width: none; column-gap: 10px; } }
@media (min-width: 1200px) { .bento { max-width: calc(100% - 20rem - var(--s6)); } }

/* ---------- spacing rhythm ----------
   page title -> content: 32px; greeting -> cards: 40px;
   between major sections: 48px (40px on phones); section heading -> its content: 16px */
.content { --gap-section: 48px; }
@media (max-width: 699px) { .content { --gap-section: 40px; } }
.view-head { padding-bottom: var(--s6); }
.greeting { padding-bottom: 40px; }
.greeting-date { margin-top: var(--s3); }
/* To-do */
.todo > .bento { margin-bottom: 0; }
.todo-head { margin-top: var(--gap-section); margin-bottom: var(--s4); }
/* Projects */
.due-strip-wrap { margin-bottom: 0; }
.due-strip-wrap + .filters { margin-top: var(--gap-section); }
/* Meals */
.ml-week { margin-bottom: 0; }
.ml-cols { margin-top: var(--gap-section); }
/* Budgeting */
.m-top { margin-bottom: 0; }
.to-buy, .m-spend { margin-top: var(--gap-section); margin-bottom: 0; }
.to-buy .m-section-head, .m-spend .m-section-head, .m-spend > .m-h2 { margin-bottom: var(--s4); }
/* Calendar */
.day-title { margin-top: var(--s6); }
.area-block .quiet-head { margin-top: var(--s5); margin-bottom: var(--s3); }
.area-block + .area-block { margin-top: var(--s4); }
/* project cards: the icon sits centred on the first line of the name, at a size that matches it */

.add-inline { display: inline-flex; align-items: center; gap: 4px; }
/* more breathing room above the page title (and the buttons that share its row) */
.content { padding-top: calc(env(safe-area-inset-top) + 40px); }
.topbar { top: calc(env(safe-area-inset-top) + 40px); padding-top: 0; }
@media (min-width: 900px) {
  .content { padding-top: 64px; }

}
.strip-item { grid-template-columns: minmax(0, 1fr); padding-left: 8px; }
/* project icon before a task name: one small, even gap */

.strip-title .todo-proj-icon { margin-right: 4px; vertical-align: -1px; }

/* settings: theme picker */
.panel-sub { font-family: var(--font-sans); font-size: 0.875rem; font-weight: 600; color: var(--ink-muted); margin: var(--s5) 0 var(--s2); }

.palette-name { display: flex; flex-direction: column; font-weight: 600; font-size: 0.9375rem; }
.palette-name small { font-weight: 400; color: var(--ink-muted); font-size: 0.8125rem; }

/* Theme 2 uses Theme 1's background, surfaces and lines */
:root[data-palette="2"] { --canvas: #FAF9F7; --surface: #FFFDFB; --surface-sunken: #F0EEEC; --line: #E9E6E3; --line-strong: #D4D0CC; --cream: #FFFDFB; --on-primary: #FFFDFB; }
@media (prefers-color-scheme: dark) { :root[data-palette="2"]:not([data-theme="light"]) { --canvas: #262624; --surface: #30302E; --surface-sunken: #1E1E1C; --line: #3B3A37; --line-strong: #52504C; --on-primary: #262624; } }
:root[data-palette="2"][data-theme="dark"] { --canvas: #262624; --surface: #30302E; --surface-sunken: #1E1E1C; --line: #3B3A37; --line-strong: #52504C; --on-primary: #262624; }
.panel h2 { background-image: none; padding-inline: 0; margin-inline-start: 0; }
/* the name in the greeting gets a pink highlighter stroke */
.greeting .greeting-name {
  --hl-c: color-mix(in srgb, var(--pink) var(--hl-mix, 100%), transparent);
  background-image: linear-gradient(to bottom, transparent 55%, var(--hl-c) 55%, var(--hl-c) 90%, transparent 90%);
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
  padding-inline: 0.08em; margin-inline-start: -0.08em;
}
.to-buy .quad .buy-price { color: inherit; }
.to-buy .quad .buy-total { color: inherit; opacity: .75; } .to-buy .quad .buy-total strong { color: inherit; }
/* quick views on the other tabs */
.peek-row-plain { grid-template-columns: 32px minmax(0, 1fr) auto; }
.peek-row-plain .peek-icon { background: var(--cs); color: var(--c); }
.peek-end { font-size: 0.8125rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.peek-glyph { font-weight: 700; font-size: 0.875rem; line-height: 1; }
.peek-late { color: var(--danger); }
.peek-none { color: var(--ink-faint); font-weight: 400; }
.peek-note { margin: 6px 8px 2px; font-size: 0.8125rem; color: var(--ink-soft); }
.peek-sub { margin-top: 10px; }
.peek-money { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; padding: 2px 8px 6px; }
.peek-money-num { font-family: var(--font-display); font-size: 1.75rem; line-height: 1.1; }
.peek-money-bar { flex-basis: 100%; height: 6px; border-radius: 3px; background: var(--surface-sunken); overflow: hidden; margin: 4px 0 2px; }
.peek-money-bar span { display: block; height: 100%; border-radius: 3px; background: var(--ink); }
.peek-money-bar[data-over] span { background: var(--danger); }

/* ---------- comfortable edges on every screen size ----------
   page gutter: 20px on small phones, 24px on large phones and tablets, 32px on laptops */
:root { --gutter: 20px; }
@media (min-width: 480px) { :root { --gutter: 24px; } }
@media (min-width: 900px) { :root { --gutter: 32px; } }
.content { padding-left: calc(var(--gutter) + env(safe-area-inset-left)); padding-right: calc(var(--gutter) + env(safe-area-inset-right)); }
.topbar { right: calc(var(--gutter) + env(safe-area-inset-right)); }
@media (min-width: 900px) { .topbar { right: var(--gutter); } }
.rail { padding-left: var(--gutter); padding-right: var(--gutter); }
/* the floating menu bar fits small phones without touching the edges */
@media (max-width: 400px) {
  .rail { gap: 6px; }
  .rail .dock { gap: 2px; padding: 5px; }
  .dock .tab { width: 44px; height: 44px; }
  .add-btn { width: 54px; height: 54px; }
}
/* a little more room inside the quadrants and lists on phones */
@media (max-width: 699px) {
  .quad { padding: 10px 12px 12px; }
  .todo-row { padding-left: 4px; padding-right: 2px; }
  .tray .todo-list { padding: 0 2px; }
}
/* sheets and drawers */
.sheet { padding-left: calc(20px + env(safe-area-inset-left)); padding-right: calc(20px + env(safe-area-inset-right)); }
@media (min-width: 700px) { .sheet { padding-left: 28px; padding-right: 28px; } }
.greeting { padding-right: 0; }
.greeting h1 { padding-right: calc(var(--bar-w, 150px) + var(--s3)); }

/* roomier: wider page edges and more air between sections */
:root { --gutter: 24px; }
@media (min-width: 480px) { :root { --gutter: 32px; } }
@media (min-width: 900px) { :root { --gutter: 48px; } }
.content { --gap-section: 64px; }
@media (max-width: 699px) { .content { --gap-section: 48px; } }
.view-head { padding-bottom: 40px; }
.greeting { padding-bottom: 48px; }
@media (max-width: 699px) { .view-head { padding-bottom: 32px; } .greeting { padding-bottom: 40px; } }
.todo-head, .to-buy .m-section-head, .m-spend .m-section-head, .m-spend > .m-h2 { margin-bottom: 20px; }
.m-tiles, .bento { gap: 12px; }
.matrix { gap: 12px; }
.sheet { padding-left: calc(24px + env(safe-area-inset-left)); padding-right: calc(24px + env(safe-area-inset-right)); }
@media (min-width: 700px) { .sheet { padding-left: 32px; padding-right: 32px; } }
/* app name on the welcome screen */
.setup-brand { margin: 0 0 calc(-1 * var(--s2)); font-family: var(--font-display); font-size: 1.75rem; line-height: 1; color: var(--ink); }
.setup-brand span {
  background-image: linear-gradient(to bottom, transparent 55%, var(--pink) 55%, var(--pink) 90%, transparent 90%);
  padding-inline: 0.1em; margin-inline-start: -0.1em;
}
</style>
