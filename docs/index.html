* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif);
  font-size: var(--text-base);
  line-height: 1.55;
  font-optical-sizing: auto;
  font-variant-numeric: lining-nums;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { opacity: 0.35; cursor: default; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { margin: 0; font-weight: 500; letter-spacing: -0.01em; line-height: 1.2; }
ul, ol { list-style: none; margin: 0; padding: 0; }
a { color: inherit; }

.shell { min-height: 100dvh; }
.content {
  max-width: 44rem;
  margin: 0 auto;
  padding: var(--s3) var(--s4) calc(96px + env(safe-area-inset-bottom));
}
.topbar {

  padding: calc(env(safe-area-inset-top) + var(--s2)) var(--s4) var(--s2);

}

.sync-problem { color: var(--danger); font-style: normal; }

  background: var(--paper);
  border-top: 1px solid var(--rule);
}
.rail ul { display: flex; gap: var(--s1); }
.tab {
  padding: var(--s2) var(--s3); min-height: var(--control-lg);
  color: var(--ink-soft); font-size: var(--text-base);
  border-radius: 999px;
}
.tab[aria-current="page"] { color: var(--ink); background: var(--paper-raised); box-shadow: inset 0 0 0 1px var(--rule); }
.add-btn {
  display: inline-flex; align-items: center; gap: var(--s2);
  min-height: var(--control-lg); padding: 0 var(--s4);
  background: var(--ink); color: var(--paper);
  border-radius: 999px;
}
.add-label { font-size: var(--text-base); }

@media (min-width: 900px) {
  .rail {
    top: 0; right: auto; width: 13rem; flex-direction: column; align-items: stretch; justify-content: flex-start;
    gap: var(--s5); padding: var(--s7) var(--s5); border-top: 0; border-right: 1px solid var(--rule);
  }
  .rail ul { flex-direction: column; }
  .tab { text-align: left; width: 100%; }
  .add-btn { justify-content: center; }
  .shell { padding-left: 13rem; }
  .content { padding-bottom: var(--s7); }
}

.icon-btn {
  display: inline-grid; place-items: center; width: 44px; height: 44px;
  color: var(--ink-soft); border-radius: 999px;
}
.icon-btn:hover:not(:disabled) { color: var(--ink); background: var(--paper-raised); }
.text-btn { color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 4px; padding: var(--s2) 0; min-height: var(--control-lg); }
.text-btn:hover { text-decoration-color: var(--ink); }
.text-btn.small { font-size: var(--text-xs); min-height: var(--control-sm); }
.text-btn.quiet { color: var(--ink-soft); }
.text-btn.danger { color: var(--danger); }
.primary {
  min-height: var(--control-lg); padding: 0 var(--s5);
  background: var(--ink); color: var(--paper); border-radius: 999px;
}

.view-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); padding: var(--s2) 0 var(--s5); }
.view-head h1 { font-size: var(--text-5xl); font-weight: 400; }
.pager { display: flex; align-items: center; }
.quiet-head { font-size: var(--text-base); font-style: italic; font-weight: 400; color: var(--ink-soft); margin-bottom: var(--s2); }

/* ---------- entries ---------- */
.entry {
  display: grid; grid-template-columns: 32px 1fr; align-items: start;
  min-height: var(--control-md);
}
.mark {
  display: grid; place-items: center;
  width: 32px; height: 40px; margin: 0;
  color: var(--c);
}
button.mark { width: 44px; height: 44px; margin: -2px -6px -2px -6px; border-radius: 999px; }
button.mark:hover { background: var(--paper-raised); }
.glyph { font-size: var(--text-2xl); line-height: 1; font-weight: 600; transform: translateY(-1px); }
.glyph-deadline { font-size: var(--text-2xl); transform: translateY(5px); }
.glyph-event, .glyph-trip { font-size: var(--text-lg); font-weight: 700; }
.entry[data-done] .glyph { font-weight: 400; font-size: var(--text-lg); transform: none; color: var(--ink-faint); }
.entry-body {
  text-align: left; padding: 9px 0 7px; min-height: var(--control-md);
  display: flex; flex-direction: column; gap: 1px;
}
.entry-title { overflow-wrap: anywhere; }
.entry[data-kind="deadline"] .entry-title { font-weight: 600; }
.entry[data-done] .entry-title { color: var(--ink-faint); font-weight: 400; }
.entry-meta { font-size: var(--text-xs); color: var(--ink-soft); font-style: italic; }
.entry-body:hover .entry-title { text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 4px; }

/* ---------- week: a diary page ---------- */
.carried { margin-bottom: var(--s5); padding-bottom: var(--s3); border-bottom: 1px solid var(--rule); }
.days { border-top: 1px solid var(--rule-strong); }
.day {
  position: relative;
  display: grid;
  grid-template-columns: calc(8px + var(--lanes, 0) * 9px) 4.5rem 1fr;
  min-height: 76px;
  border-bottom: 1px solid var(--rule);
}
.gutter { position: relative; }
.bracket {
  position: absolute; top: 0; bottom: 0;
  left: calc(var(--lane) * 9px);
  width: 7px;
  border-left: 2.5px solid var(--c);
}
.bracket[data-start] { top: 18px; border-top: 2.5px solid var(--c); border-top-left-radius: 3px; }
.bracket[data-end] { bottom: 18px; border-bottom: 2.5px solid var(--c); border-bottom-left-radius: 3px; }
.day-label { display: flex; flex-direction: column; align-items: flex-start; padding: 6px 0 var(--s3); }
.day-num {
  font-size: var(--text-5xl); line-height: 1.05; font-weight: 300;
  font-variant-numeric: lining-nums tabular-nums; color: var(--ink-faint);
}
.day-name { font-size: var(--text-xs); color: var(--ink-faint); font-style: italic; }
.day[data-today] .day-num { color: var(--ink); font-weight: 500; }
.day[data-today] .day-name { color: var(--ink); font-style: normal; font-weight: 600; }
.day[data-past] .entries { opacity: 0.72; }
.day .entries { padding: 6px 0 var(--s2); }

.unscheduled { margin-top: var(--s6); }
.unscheduled summary {
  cursor: pointer; list-style: none; min-height: var(--control-lg); display: flex; align-items: center; gap: var(--s2);
  font-style: italic; color: var(--ink-soft);
}
.unscheduled summary::-webkit-details-marker { display: none; }
.unscheduled summary::before { content: '+'; font-style: normal; width: 1rem; }
.unscheduled[open] summary::before { content: '−'; }
.count { font-style: normal; font-variant-numeric: tabular-nums; color: var(--ink-faint); }

/* ---------- chips ---------- */
.filters { display: flex; flex-wrap: wrap; gap: var(--s2); margin-bottom: var(--s5); }
.chip {
  display: inline-flex; align-items: center; gap: var(--s2);
  min-height: var(--control-md); padding: 0 var(--s3);
  border-radius: 999px; box-shadow: inset 0 0 0 1px var(--rule-strong);
  font-size: var(--text-md); text-decoration: none; color: var(--ink);
}
.chip-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chip[aria-pressed="false"] { color: var(--ink-faint); box-shadow: inset 0 0 0 1px var(--rule); }
.chip[aria-pressed="false"] .chip-dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
.chip[aria-pressed="true"] { background: var(--paper-raised); }
.chip-plain[aria-pressed="true"] { box-shadow: inset 0 0 0 1.5px var(--ink); }

/* ---------- timeline ---------- */
.month { padding: var(--s3) 0 var(--s5); }
.month-title { font-size: var(--text-4xl); font-weight: 400; padding-bottom: var(--s3); border-bottom: 1px solid var(--rule-strong); margin-bottom: var(--s2); }
.month-empty { color: var(--ink-faint); font-style: italic; margin: var(--s2) 0; }
.month-gap { color: var(--ink-faint); font-style: italic; margin: var(--s2) 0 var(--s5); padding-top: var(--s3); border-top: 1px solid var(--rule); }
.continuing .entry-title { color: var(--ink-soft); }
.dated-row { display: grid; grid-template-columns: 6.75rem 1fr; border-bottom: 1px solid var(--rule); }
.dated-row:last-child { border-bottom: 0; }
.date-col { padding-top: 9px; font-size: var(--text-md); color: var(--ink-soft); font-variant-numeric: tabular-nums; }

/* ---------- areas ---------- */
.area { padding: var(--s3) 0 var(--s6); scroll-margin-top: 64px; }
.area-head { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--rule-strong); padding-bottom: var(--s2); margin-bottom: var(--s3); }
.area-head h2 { font-size: var(--text-4xl); font-weight: 400; display: flex; align-items: center; gap: var(--s3); }
.area-swatch { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.project { margin-bottom: var(--s4); }
.project-head { display: flex; align-items: baseline; justify-content: space-between; }
.project-head h3 { font-size: var(--text-base); font-weight: 600; }

/* ---------- setup and settings ---------- */
.setup { max-width: 34rem; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 12vh) 0 var(--s7); padding-inline: max(var(--s6), env(safe-area-inset-left)) max(var(--s6), env(safe-area-inset-right)); display: flex; flex-direction: column; gap: var(--s5); align-items: flex-start; }
.setup-title { font-size: clamp(2rem, 7vw, 2.75rem); font-weight: 300; line-height: 1.12; letter-spacing: -0.02em; }
.lede { color: var(--ink-soft); max-width: 32rem; margin: 0; }
.form { display: flex; flex-direction: column; gap: var(--s4); width: 100%; }
label { display: flex; flex-direction: column; gap: var(--s1); font-size: var(--text-md); color: var(--ink-soft); }
input, select, textarea {
  width: 100%; min-height: var(--control-lg); padding: var(--s2) var(--s3);
  background: var(--paper-raised); color: var(--ink);
  border: 1px solid var(--rule-strong); border-radius: 8px;
}
textarea { resize: vertical; }
/* Safari sizes date and time fields to their own content and ignores width: 100%,
   which pushed sheets wider than the phone. Resetting the native look lets them fit. */
input[type="date"], input[type="time"] { display: block; min-width: 0; -webkit-appearance: none; appearance: none; text-align: left; }
input[type="date"]::-webkit-date-and-time-value, input[type="time"]::-webkit-date-and-time-value { text-align: left; }
.hint { font-size: var(--text-md); color: var(--ink-soft); font-style: italic; margin: 0; }
.error { color: var(--danger); margin: 0; font-size: var(--text-md); }

.areas-editor { width: 100%; }
.area-row {
  display: grid; grid-template-columns: 1fr auto; gap: var(--s2) var(--s3); align-items: center;
  padding: var(--s3) 0; border-bottom: 1px solid var(--rule);
}
.area-name { border-left: 4px solid var(--c); }
.swatches { display: flex; flex-wrap: wrap; gap: 2px; grid-column: 1; }
.swatch { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; }
.swatch::after { content: ''; width: 18px; height: 18px; border-radius: 50%; background: var(--c); }
.swatch[aria-checked="true"] { box-shadow: inset 0 0 0 2px var(--ink); }
.row-actions { grid-row: 1 / span 2; grid-column: 2; display: flex; }
.add-areas { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); padding-top: var(--s3); }
.suggest { display: inline-flex; flex-wrap: wrap; align-items: center; gap: var(--s2); color: var(--ink-soft); font-style: italic; }
.suggest .chip { font-style: normal; }

.panel { padding: var(--s3) 0 var(--s6); border-top: 1px solid var(--rule-strong); display: flex; flex-direction: column; gap: var(--s3); }
.panel h2 { font-size: var(--text-xl); padding-top: var(--s2); }
.panel-actions { display: flex; flex-wrap: wrap; gap: var(--s4); align-items: center; }
.cal-map { width: 100%; display: flex; flex-direction: column; gap: var(--s3); }
.cal-map li label { color: var(--ink); }

/* ---------- editor sheet ---------- */
.scrim {
  position: fixed; inset: 0; z-index: 20;
  background: color-mix(in srgb, var(--ink) 28%, transparent);
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  width: 100%; max-width: 36rem; max-height: 92dvh; overflow-y: auto;
  background: var(--paper);
  border-radius: 16px 16px 0 0;
  padding: var(--s5) var(--s4) calc(var(--s5) + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: var(--s4);
  box-shadow: 0 -1px 0 var(--rule-strong);
  animation: rise 220ms cubic-bezier(.2,.7,.2,1);
}
@media (min-width: 700px) {
  .scrim { align-items: center; }
  .sheet { border-radius: 16px; box-shadow: 0 0 0 1px var(--rule-strong), 0 20px 50px -20px rgba(20, 30, 40, .35); }
}
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet-title { font-size: var(--text-xl); font-weight: 400; color: var(--ink-soft); font-style: italic; }
.sheet p { margin: 0; }
.title-input { font-size: var(--text-xl); border: 0; border-bottom: 1px solid var(--rule-strong); border-radius: 0; background: transparent; padding: var(--s2) 0; }
.title-input:focus-visible { outline: none; border-bottom-color: var(--ink); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--rule-strong); padding: 3px; }
.seg button { min-height: var(--control-md); border-radius: 999px; color: var(--ink-soft); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: var(--text-md); }
.seg button[aria-checked="true"] { background: var(--ink); color: var(--paper); }
.seg-mark { font-weight: 700; }
fieldset { border: 0; margin: 0; padding: 0; }
legend { font-size: var(--text-md); color: var(--ink-soft); margin-bottom: var(--s1); padding: 0; }
.area-pick .filters { margin-bottom: 0; }
.field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: var(--s3); }
.field-grid > * { min-width: 0; }
.sheet-actions { display: flex; align-items: center; gap: var(--s4); padding-top: var(--s2); }
.push-right { margin-left: auto; }

/* ---------- projects overview ---------- */
.coming-up { margin-bottom: var(--s6); padding-bottom: var(--s3); border-bottom: 1px solid var(--rule); }
.area-block { padding: var(--s3) 0 var(--s5); }
.project-list li + li { border-top: 1px solid var(--rule); }
.project-row {
  width: 100%; text-align: left; display: flex; flex-direction: column; gap: 2px;
  padding: var(--s3) 0 var(--s3);
}
.project-name { font-size: var(--text-xl); line-height: 1.3; }
.project-row:hover .project-name { text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 5px; }
.progress { display: block; height: 3px; margin-top: var(--s2); background: var(--rule); border-radius: 2px; overflow: hidden; max-width: 16rem; }
.progress span { display: block; height: 100%; background: var(--c); }
.loose { margin-top: var(--s3); }
.archived { margin-top: var(--s5); }

/* ---------- project view ---------- */
.content-wide { max-width: none; }
.proj-header { margin-bottom: var(--s4); } /* full width, so the area line and the tools reach the right edge like the board below */
.back { display: inline-flex; align-items: center; gap: var(--s1); min-height: var(--control-lg); color: var(--ink-soft); margin-left: -6px; }
.back:hover { color: var(--ink); }
.project-title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.project-title-row h1 { font-size: var(--text-5xl); font-weight: 400; line-height: 1.15; }
.project-area { margin: 0 0 var(--s1); display: flex; align-items: center; gap: var(--s2); color: var(--ink-soft); font-style: italic; font-size: var(--text-md); }
.project-tools { display: flex; align-items: center; gap: var(--s2); }
.seg.seg-small { grid-template-columns: repeat(2, auto); }
.seg.seg-small button { min-height: var(--control-md); padding: 0 var(--s3); }

.board {
  display: flex; gap: var(--s4); align-items: flex-start;
  overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain;
  margin: 0 calc(var(--s4) * -1); padding: 0 var(--s4) var(--s4);
  scrollbar-width: thin;
}
.board[data-dragging] { scroll-snap-type: none; }
.column { flex: 0 0 min(84vw, 19rem); scroll-snap-align: start; scroll-margin-left: var(--s4); }
.column-head {
  display: flex; align-items: baseline; justify-content: space-between;
  font-size: var(--text-base); font-weight: 600; padding: var(--s2) 2px var(--s2);
  border-bottom: 1px solid var(--rule-strong); margin-bottom: var(--s3);
}
.column-head .count { font-weight: 400; font-size: var(--text-md); }
.column[data-done-section] .column-head { color: var(--ink-soft); font-weight: 500; }
.cards { display: flex; flex-direction: column; gap: var(--s2); min-height: 48px; }

.card-tile {
  display: grid; grid-template-columns: 18px 1fr; gap: 2px var(--s2); align-items: start;
  padding: var(--s3) var(--s3) var(--s3) var(--s2);
  background: var(--paper-raised);
  border: 1px solid var(--rule);
  border-radius: 6px;
  cursor: grab;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  touch-action: manipulation;
}
.card-tile:hover { border-color: var(--rule-strong); }
.card-mark { color: var(--c); font-weight: 700; font-size: var(--text-lg); line-height: 1.2; text-align: center; }
.card-tile[data-kind="deadline"] .card-mark { font-size: var(--text-xl); line-height: 1.5; }
.card-tile[data-kind="event"] .card-mark, .card-tile[data-kind="trip"] .card-mark { font-size: var(--text-md); line-height: 1.6; }
.card-title { line-height: 1.4; overflow-wrap: anywhere; }
.card-tile[data-kind="deadline"] .card-title { font-weight: 600; }
.card-tile[data-done] { background: transparent; }
.card-tile[data-done] .card-title, .card-tile[data-done] .card-mark { color: var(--ink-faint); font-weight: 400; }
.card-meta {
  grid-column: 2; display: flex; flex-wrap: wrap; gap: var(--s1) var(--s3);
  font-size: var(--text-xs); color: var(--ink-soft); font-style: italic;
}
.card-meta span { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.card-meta .late { color: var(--danger); }
.entry .card-meta { margin-top: 1px; }
.drop-line {
  border: 1.5px dashed var(--c); border-radius: 6px; opacity: 0.7;
  background: color-mix(in srgb, var(--c) 8%, transparent);
}
.drag-ghost {
  position: fixed; top: 0; left: 0; z-index: 30; pointer-events: none; margin: 0;
  box-shadow: 0 12px 30px -10px rgba(20, 30, 40, .35); border-color: var(--rule-strong); cursor: grabbing;
}
.board-hint { margin-top: var(--s2); font-size: var(--text-xs); }

.inline-add { display: inline-flex; align-items: center; gap: var(--s2); min-height: var(--control-lg); color: var(--ink-soft); padding: 0 2px; }
.inline-add:hover { color: var(--ink); }
.inline-add-form { padding-top: var(--s2); display: flex; flex-direction: column; gap: var(--s1); }
.inline-add-form .hint { font-size: var(--text-xs); }
/* Name and price or date share a line when there's room; on a narrow card the second box
   drops underneath and takes the full width (the name grows 3x faster, so it stays the wider one). */
.inline-add-row { display: flex; flex-wrap: wrap; gap: var(--s2); }
.inline-add-row > input { flex: 3 1 8em; min-width: 0; }
.inline-add-row > .inline-add-price { flex: 1 1 5.5em; font-variant-numeric: tabular-nums; }
.inline-add-date { position: relative; display: block; flex: 1 1 9em; min-width: 0; }
.inline-add-date input { width: 100%; padding-right: var(--s2); }
.inline-add-date input::-webkit-calendar-picker-indicator { margin-inline-start: 2px; }
.inline-add-date[data-empty] input:not(:focus)::-webkit-datetime-edit { color: transparent; }
.inline-add-date-label { position: absolute; left: calc(var(--s3) + 1px); top: 50%; transform: translateY(-50%); color: var(--ink-soft); pointer-events: none; }
.inline-add-date input:focus + .inline-add-date-label { display: none; }

.list-layout { max-width: 44rem; }
.list-section { margin-bottom: var(--s5); }

/* ---------- card sheet ---------- */
.sheet-wide { max-width: 40rem; }
.sheet-heading { font-size: var(--text-xl); font-weight: 500; }
.card-sheet-top { display: flex; justify-content: space-between; align-items: center; margin: calc(var(--s3) * -1) 0 calc(var(--s2) * -1); }
.done-btn {
  display: inline-flex; align-items: center; gap: var(--s2); min-height: var(--control-md); padding: 0 var(--s3);
  border-radius: 999px; box-shadow: inset 0 0 0 1px var(--rule-strong); font-size: var(--text-md);
}
textarea.title-input { resize: none; overflow: hidden; min-height: 0; line-height: 1.3; box-sizing: border-box; }
.card-part { display: flex; flex-direction: column; gap: var(--s2); padding-top: var(--s3); border-top: 1px solid var(--rule); }
.card-part h3 { font-size: var(--text-md); font-weight: 400; color: var(--ink-soft); }
.checklist li { display: grid; grid-template-columns: 32px 1fr 36px; align-items: center; }
.checklist input { background: transparent; border-color: transparent; min-height: var(--control-md); padding-left: var(--s2); }
.checklist input:focus { border-color: var(--rule-strong); background: var(--paper-raised); }
.checklist li[data-done] input { color: var(--ink-faint); text-decoration: line-through; text-decoration-color: var(--ink-faint); }
.checklist .icon-btn { width: 36px; height: 36px; }
.check {
  width: 22px; height: 22px; border-radius: 5px; margin: 0 auto;
  box-shadow: inset 0 0 0 1.5px var(--rule-strong);
  display: grid; place-items: center; color: var(--paper);
}
.check[aria-pressed="true"] { background: var(--ink); box-shadow: none; }
.check-add { display: grid; grid-template-columns: 32px 1fr auto; gap: 0 var(--s2); align-items: center; }
.check-add-mark { display: grid; place-items: center; color: var(--ink-faint); }
.links { display: flex; flex-direction: column; gap: var(--s1); }
.links a { display: inline-flex; align-items: center; gap: var(--s2); color: var(--snow-ink); text-underline-offset: 4px; overflow-wrap: anywhere; min-height: var(--control-sm); }
.attachments { display: grid; grid-template-columns: repeat(auto-fill, minmax(7rem, 1fr)); gap: var(--s2); }
.attachment { position: relative; }
.attachment:not(.is-image) { grid-column: 1 / -1; }
.att-open { width: 100%; text-align: left; border-radius: 6px; overflow: hidden; border: 1px solid var(--rule); background: var(--paper-raised); }
.attachment.is-image .att-open { aspect-ratio: 3 / 4; }
.att-open img { width: 100%; height: 100%; object-fit: cover; display: block; }
.att-ph { display: grid; place-items: center; height: 100%; color: var(--ink-faint); font-style: italic; font-size: var(--text-xs); }
.att-file { display: flex; align-items: center; gap: var(--s2); padding: var(--s3); overflow-wrap: anywhere; }
.att-remove {
  position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center; background: var(--paper); color: var(--ink); box-shadow: 0 0 0 1px var(--rule-strong);
}
.card-part .text-btn { display: inline-flex; align-items: center; gap: var(--s2); align-self: flex-start; }

/* ---------- project sheet ---------- */
.section-edit li { display: grid; grid-template-columns: 1fr auto auto; gap: var(--s2); align-items: center; padding: var(--s1) 0; }
.done-pick { flex-direction: row; align-items: center; gap: 6px; font-size: var(--text-md); color: var(--ink-soft); }
.done-pick input { width: 18px; min-height: 18px; height: 18px; accent-color: var(--ink); }
.sheet-actions-end { display: inline-flex; gap: var(--s4); }
@media (max-width: 480px) {
  .section-edit .row-actions .icon-btn { width: 36px; }
  .sheet-actions { flex-wrap: wrap; }
}
body.sheet-open { overflow: hidden; }
/* a sheet only ever scrolls up and down, never sideways */
.sheet { overflow-x: hidden; overscroll-behavior: contain; touch-action: pan-y; }
.sheet > * { flex-shrink: 0; }
.armed { font-weight: 600; }
.confirm-mini { font-size: var(--text-xs); color: var(--danger); white-space: nowrap; padding: 0 4px; }
.icon-btn.armed, .att-remove.armed { width: auto; border-radius: 999px; }
.lightbox {
  position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
  padding: calc(env(safe-area-inset-top) + 48px) 16px calc(env(safe-area-inset-bottom) + 16px);
  background: color-mix(in srgb, var(--paper) 94%, transparent);
}
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; box-shadow: 0 0 0 1px var(--rule-strong); }
.lightbox-close { position: absolute; top: calc(env(safe-area-inset-top) + 8px); right: 8px; color: var(--ink); }
a.att-file { text-decoration: none; color: var(--ink); }

/* ---------- navigation with four tabs ---------- */
@media (max-width: 899px) {
  .rail { padding-left: var(--s2); padding-right: var(--s3); }
  .rail ul { gap: 0; }
  .tab { padding: var(--s2) 10px; font-size: var(--text-md); }
  .add-btn { width: 44px; padding: 0; justify-content: center; }
  .add-label { display: none; }
}

/* ---------- to-do matrix ---------- */
.todo-summary { color: var(--ink-soft); font-style: italic; font-size: var(--text-md); }
.todo-layout { display: grid; gap: var(--s6); }
@media (min-width: 1200px) { .todo-layout { grid-template-columns: minmax(0, 1fr) 20rem; align-items: start; } }
.matrix-wrap { display: grid; grid-template-columns: 1.25rem minmax(0, 1fr); grid-template-rows: auto 1fr; gap: var(--s1) var(--s2); }
.axis { color: var(--ink-faint); font-size: var(--text-xs); font-style: italic; }
.axis-top { grid-column: 2; display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
.axis-top span { padding-left: 2px; }
.axis-side { grid-row: 2; display: grid; grid-template-rows: 1fr 1fr; gap: var(--s2); }
.axis-side span { writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; }
.matrix {
  grid-column: 2; grid-row: 2;
  display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(9rem, auto);
  border: 1px solid var(--rule-strong); border-radius: 8px; overflow: hidden;
}
.quad { min-width: 0; padding: var(--s3) var(--s2) var(--s3); display: flex; flex-direction: column; gap: var(--s1); }
.quad[data-q="do"], .quad[data-q="delegate"] { border-right: 1px solid var(--rule-strong); }
.quad[data-q="do"], .quad[data-q="schedule"] { border-bottom: 1px solid var(--rule-strong); }
.quad[data-q="do"] { background: var(--paper-raised); }
.quad-head { display: flex; flex-direction: column; padding: 0 var(--s1) var(--s1); }
.quad-title { display: flex; align-items: baseline; gap: var(--s2); text-align: left; min-height: var(--control-sm); }
.quad-title:disabled { opacity: 1; cursor: default; }
.quad-name { font-size: var(--text-xl); line-height: 1.2; }
.quad[data-q="do"] .quad-name { font-weight: 600; }
.quad[data-q="drop"] .quad-name { color: var(--ink-soft); }
.quad-hint { font-size: var(--text-xs); color: var(--ink-faint); font-style: italic; line-height: 1.35; }
.quad-empty { margin: 0; padding: 0 var(--s1); color: var(--ink-faint); font-style: italic; font-size: var(--text-xs); }
.quad .text-btn.small { padding-left: var(--s1); align-self: flex-start; }
.quad .inline-add { padding-left: var(--s1); }
.todo-list { display: flex; flex-direction: column; min-height: 8px; }
.todo-row {
  display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: start;
  border-radius: 6px; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  touch-action: manipulation; cursor: grab;
}
.todo-row:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.todo-row .mark { width: 30px; height: 36px; }
.todo-row button.mark { width: 36px; height: 40px; margin: -2px -3px; }
.todo-body { text-align: left; padding: 7px 0 6px; display: flex; flex-direction: column; gap: 1px; min-width: 0; cursor: inherit; }
.todo-title { line-height: 1.35; overflow-wrap: anywhere; }
.todo-title[data-kind="deadline"] { font-weight: 600; }
.sort-btn { width: 40px; height: 40px; color: var(--ink-faint); }
.row-picker { padding: var(--s1) 0 var(--s3) 30px; }
.todo-row.drag-ghost, .drag-ghost { list-style: none; }
.todo .drop-line { border-radius: 6px; --c: var(--ink-soft); }

/* phones: a compact matrix, tap a quadrant to work in it */
@media (max-width: 899px) {
  .matrix { grid-auto-rows: minmax(8.5rem, auto); }
  .quad-name { font-size: var(--text-lg); }
  .quad-hint { display: none; }
  .quad .todo-title { font-size: var(--text-md); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .quad .todo-row { grid-template-columns: 24px minmax(0, 1fr); }
  .quad .todo-row .mark { width: 24px; }
  .quad .todo-row button.mark { width: 32px; margin: -2px -4px; }
  .quad .card-meta { font-size: var(--text-2xs); }
  .quad-focus .quad { padding: 0; }
  .quad-focus .quad-hint { display: block; }
  .quad-focus .quad .todo-title { font-size: var(--text-base); -webkit-line-clamp: unset; display: block; }
  .quad-focus .quad .todo-row { grid-template-columns: 30px minmax(0, 1fr); }
}
.quad-focus { display: flex; flex-direction: column; gap: var(--s2); }

.tray { display: flex; flex-direction: column; gap: var(--s1); }
.tray-head h2 { font-size: var(--text-xl); font-weight: 400; display: flex; gap: var(--s2); align-items: baseline; }
.tray-head .hint { font-size: var(--text-md); margin-top: 2px; }
@media (min-width: 1200px) { .tray { border-left: 1px solid var(--rule); padding-left: var(--s5); } }

.quad-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; max-width: 20rem; }
.quad-picker button[role="radio"] {
  min-height: var(--control-md); border-radius: 6px; box-shadow: inset 0 0 0 1px var(--rule-strong);
  font-size: var(--text-md); color: var(--ink);
}
.quad-picker button[role="radio"][aria-checked="true"] { background: var(--ink); color: var(--paper); box-shadow: none; }
.quad-picker button[data-q="do"] { font-weight: 600; }
.quad-picker.compact button[role="radio"] { min-height: var(--control-md); }
.quad-clear { grid-column: 1 / -1; justify-self: start; }
.part-legend { font-size: var(--text-md); color: var(--ink-soft); margin-bottom: var(--s2); padding: 0; }
fieldset.card-part { border: 0; border-top: 1px solid var(--rule); margin: 0; padding: var(--s3) 0 0; }

/* ---------- projects timeline ---------- */
.view-head .seg-small { flex: none; }
.gantt-block { display: flex; flex-direction: column; gap: var(--s4); }
.gantt {
  --label: 7.75rem;
  overflow-x: auto; overscroll-behavior-x: contain;
  border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule);
  margin: 0 calc(var(--s4) * -1); scrollbar-width: thin;
}
@media (min-width: 900px) { .gantt { --label: 13rem; margin: 0; } }
.gantt-inner { width: calc(var(--label) + var(--track)); position: relative; }
.gantt-row { display: grid; grid-template-columns: var(--label) var(--track); min-height: 52px; }
.gantt-label {
  position: sticky; left: 0; z-index: 2; background: var(--paper);
  padding: var(--s2) var(--s3) var(--s2) var(--s4); border-right: 1px solid var(--rule);
  display: flex; flex-direction: column; justify-content: center; min-width: 0;
}
@media (min-width: 900px) { .gantt-label { padding-left: var(--s2); } }
.gantt-track { position: relative; }
.gantt-months { min-height: 36px; border-bottom: 1px solid var(--rule); }
.gantt-month { position: absolute; top: 9px; padding-left: 6px; font-size: var(--text-xs); color: var(--ink-soft); white-space: nowrap; }
.gantt-year { color: var(--ink-faint); }
.gantt-body { position: relative; }
.gantt-grid { position: absolute; inset: 0 0 0 var(--label); pointer-events: none; }
.gantt-grid span { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--rule); }
.gantt-grid .gantt-today { border-left: 1.5px solid var(--ink); z-index: 1; }
.gantt-today em { position: absolute; top: 2px; left: 4px; font-size: var(--text-2xs); color: var(--ink); white-space: nowrap; }
.gantt-area { min-height: var(--control-md); }
.gantt-area .gantt-label { flex-direction: row; justify-content: flex-start; align-items: center; gap: var(--s2); font-size: var(--text-md); color: var(--ink-soft); font-style: italic; }
.gantt-group + .gantt-group .gantt-area { border-top: 1px solid var(--rule); }
.gantt-name { text-align: left; line-height: 1.3; overflow-wrap: anywhere; font-size: var(--text-sm); }
@media (min-width: 900px) { .gantt-name { font-size: var(--text-base); } }
.gantt-name:hover { text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 4px; }
.gantt-dates { font-size: var(--text-2xs); color: var(--ink-faint); font-style: italic; font-variant-numeric: tabular-nums; }
.gantt-bar {
  position: absolute; top: 50%; height: 14px; margin-top: -7px; border-radius: 4px; overflow: hidden;
  background: color-mix(in srgb, var(--c) 22%, var(--paper)); box-shadow: inset 0 0 0 1.5px var(--c);
}
.gantt-bar[data-derived] { background: transparent; box-shadow: none; border: 1.5px dashed var(--c); }
.gantt-bar:hover { box-shadow: inset 0 0 0 1.5px var(--c), 0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent); }
.gantt-progress { display: block; height: 100%; background: var(--c); opacity: .85; }
.gantt-mark {
  position: absolute; top: 50%; transform: translate(-50%, -150%);
  color: var(--c); font-weight: 700; font-size: var(--text-base); line-height: 1; pointer-events: none;
}
.gantt-mark[data-kind="deadline"] { font-size: var(--text-lg); transform: translate(-50%, -125%); }
.gantt-mark[data-done] { color: var(--ink-faint); }
.gantt-key { font-size: var(--text-xs); max-width: 40rem; }
.gantt-undated ul { display: flex; flex-direction: column; }
.gantt-undated li + li { border-top: 1px solid var(--rule); }
.gantt-undated-name { display: inline-flex; align-items: center; gap: var(--s2); font-size: var(--text-base); }

/* ---------- calendar ---------- */
.cal-sub { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s3); }
.cal-sub h2 { font-size: var(--text-4xl); font-weight: 400; }
.view.month { max-width: 64rem; }
.view.week { max-width: 44rem; }
.month-grid { border-top: 1px solid var(--rule-strong); }
.month-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-bottom: 1px solid var(--rule); }
.month-days span { padding: var(--s2) 6px; font-size: var(--text-xs); color: var(--ink-faint); font-style: italic; }
.month-week {
  --row-top: 36px; --lane-h: 18px;
  position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
  border-bottom: 1px solid var(--rule); min-height: 4.5rem;
}
@media (min-width: 900px) { .month-week { min-height: 7.25rem; } }
.month-cell { position: relative; min-width: 0; border-left: 1px solid var(--rule); padding: 0 4px 6px; }
.month-cell:first-child { border-left: 0; }
.month-cell[data-other] { background: color-mix(in srgb, var(--ink) 3%, transparent); }
.month-cell[data-other] .cell-num { color: var(--ink-faint); }
.month-cell[aria-selected="true"] { background: var(--paper-raised); box-shadow: inset 0 0 0 1.5px var(--ink-soft); }
.cell-day { position: absolute; inset: 0; z-index: 0; display: flex; align-items: flex-start; padding: 6px; border-radius: 0; }
.cell-num {
  display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 4px; border-radius: 999px;
  font-size: var(--text-md); font-variant-numeric: tabular-nums; color: var(--ink-soft);
}
.month-cell[data-today] .cell-num { background: var(--ink); color: var(--paper); font-weight: 600; }
.cell-items {
  position: relative; z-index: 1; pointer-events: none;
  margin-top: calc(var(--row-top) + var(--lanes, 0) * var(--lane-h) + 2px);
  display: flex; flex-direction: column; gap: 1px;
}
.cell-items > * { pointer-events: auto; }
.cell-entry { display: flex; gap: 4px; align-items: baseline; width: 100%; text-align: left; font-size: var(--text-xs); line-height: 1.3; padding: 1px 2px; border-radius: 3px; min-width: 0; }
.cell-entry:hover { background: color-mix(in srgb, var(--c) 12%, transparent); }
.cell-mark { color: var(--c); font-weight: 700; flex: none; }
.cell-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
li[data-done] .cell-title { color: var(--ink-faint); }
li[data-kind="deadline"] .cell-title { font-weight: 600; }
.month-cell[data-past] .cell-items { opacity: .7; }
@media (max-width: 899px) {
  .cell-items { flex-direction: row; flex-wrap: wrap; gap: 0 3px; padding-left: 2px; pointer-events: none; }
  .cell-items > * { pointer-events: none; }
  .cell-dot { color: var(--c); font-weight: 700; font-size: var(--text-md); line-height: 1.1; }
  li[data-done] .cell-dot { color: var(--ink-faint); }
  .cell-more-btn { font-size: var(--text-2xs); color: var(--ink-soft); }
}
.cell-more-btn { font-size: var(--text-2xs); color: var(--ink-soft); padding: 1px 2px; font-style: italic; }
.month-bar {
  position: absolute; z-index: 1; height: 14px;
  top: calc(var(--row-top) + var(--lane) * var(--lane-h));
  left: calc(var(--s) / 7 * 100% + 3px);
  width: calc((var(--e) - var(--s) + 1) / 7 * 100% - 6px);
  background: color-mix(in srgb, var(--c) 22%, var(--paper)); border-top: 1.5px solid var(--c); border-bottom: 1.5px solid var(--c);
  font-size: var(--text-2xs); line-height: 11px; text-align: left; padding: 0 6px; overflow: hidden; white-space: nowrap; color: var(--ink);
}
.month-bar[data-starts] { border-left: 1.5px solid var(--c); border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
.month-bar[data-ends] { border-right: 1.5px solid var(--c); border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
@media (max-width: 899px) { .month-bar { height: 6px; top: calc(var(--row-top) - 2px + var(--lane) * 9px); } .month-week { --lane-h: 9px; } }
.day-detail { margin-top: var(--s5); max-width: 44rem; }

/* ---------- two-week strip on Projects ---------- */
.due-strip-wrap { margin-bottom: var(--s6); }
.due-strip {
  display: flex; overflow-x: auto; scroll-snap-type: x proximity;
  margin: 0 calc(var(--s4) * -1); padding: 0 var(--s4);
  border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule);
  scrollbar-width: thin;
}
.strip-day { flex: 0 0 5.75rem; min-width: 0; scroll-snap-align: start; border-left: 1px solid var(--rule); padding: var(--s2) 6px var(--s3); min-height: 7.5rem; }
.strip-day:first-child { border-left: 0; }
.strip-day[data-week-start] { border-left: 1.5px solid var(--rule-strong); }
.strip-day[data-weekend] { background: color-mix(in srgb, var(--ink) 3%, transparent); }
.strip-head { display: flex; align-items: baseline; justify-content: space-between; gap: 4px; margin-bottom: var(--s2); }
.strip-dow { font-size: var(--text-xs); font-style: italic; color: var(--ink-faint); }
.strip-num { font-size: var(--text-lg); font-variant-numeric: tabular-nums; color: var(--ink-soft); }
.strip-day[data-today] .strip-dow { color: var(--ink); font-style: normal; font-weight: 600; }
.strip-day[data-today] .strip-num { color: var(--ink); font-weight: 600; }
.strip-overdue .strip-dow, .strip-overdue .strip-num { color: var(--danger); font-style: normal; }
.strip-day ul { display: flex; flex-direction: column; gap: var(--s2); }
.strip-item { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 3px; align-items: start; }
.strip-mark { color: var(--c); font-weight: 700; font-size: var(--text-base); line-height: 1.15; width: 22px; height: 24px; margin: -2px -6px 0 -4px; border-radius: 50%; }
.strip-mark:hover { background: var(--paper-raised); }
.strip-item[data-kind="deadline"] .strip-mark { font-size: var(--text-lg); line-height: 1.4; }
.strip-body { text-align: left; display: flex; flex-direction: column; min-width: 0; }
.strip-title { font-size: var(--text-xs); line-height: 1.3; overflow-wrap: break-word; hyphens: auto; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.strip-item[data-kind="deadline"] .strip-title { font-weight: 600; }
.strip-project { font-size: var(--text-2xs); color: var(--ink-faint); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip-body:hover .strip-title { text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 3px; }
@media (min-width: 900px) {
  .due-strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); overflow: visible; margin: 0; padding: 0; }
  .strip-day { border-bottom: 1px solid var(--rule); }
  .strip-day:nth-child(7n + 1) { border-left: 0; }
  .due-strip:has(.strip-overdue) .strip-day:not(.strip-overdue) { border-left: 1px solid var(--rule); }
  .due-strip:has(.strip-overdue) .strip-day:nth-child(7n + 2) { border-left: 0; }
  .strip-overdue { grid-column: 1 / -1; min-height: 0; border-left: 0; display: flex; gap: var(--s4); align-items: baseline; }
  .strip-overdue .strip-head { margin: 0; flex: none; }
  .strip-overdue ul { flex-direction: row; flex-wrap: wrap; gap: var(--s2) var(--s4); }
  .strip-day[data-week-start] { border-left: 0; }
}

/* ======================================================================
   Plans design system: colour blocks, pills, Instrument Serif headings.
   These rules restyle the components above using the design tokens.
   ====================================================================== */
body { font-family: var(--font-sans); font-size: var(--text-base); line-height: 1.5; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

/* type: serif for headings, sans for everything else, no italics */
.view-head h1, .project-title-row h1, .setup-title, .cal-sub h2, .month-title, .area-head h2, .tray-head h2,
.quad-name, .sheet-heading, .panel h2, .project-name, .day-num, .strip-num, .gantt-undated-name {
  font-family: var(--font-display); font-weight: 400; letter-spacing: -0.005em;
}
.view-head h1 { font-size: var(--text-5xl); line-height: 1.05; }
@media (min-width: 900px) { .view-head h1 { font-size: var(--text-7xl); } }
.project-title-row h1 { font-size: var(--text-5xl); line-height: 1.05; }
.cal-sub h2 { font-size: var(--text-4xl); }
.month-title, .area-head h2 { font-size: var(--text-4xl); }
.setup-title { font-size: clamp(2.5rem, 9vw, 3.5rem); line-height: 1.02; }
.entry-meta, .sync, .hint, .card-meta, .month-empty, .day-name, .strip-dow, .strip-project, .gantt-dates,
.gantt-area .gantt-label, .quad-hint, .axis, .todo-summary, .project-area, .quiet-head, .month-days span,
.cell-more-btn, .unscheduled summary, .att-ph, .lede, .sheet-title, .month-gap, .quad-empty { font-style: normal; }
.quiet-head { font-family: var(--font-sans); font-size: var(--text-sm); font-weight: 600; color: var(--ink-muted); letter-spacing: 0.01em; }
.entry-meta, .card-meta { color: var(--ink-muted); }
.entry[data-kind="deadline"] .entry-title, .todo-title[data-kind="deadline"] { font-weight: 600; }
.sync { font-size: var(--text-xs); }

/* buttons, tabs, segmented controls, chips */
.primary { background: var(--primary); color: var(--on-primary); font-weight: 500; padding: 0 22px; }
.text-btn { font-weight: 500; text-decoration-thickness: 1.5px; }
.icon-btn:hover:not(:disabled) { background: var(--surface-sunken); }
.tab { font-weight: 500; }
.tab[aria-current="page"] { background: var(--primary); color: var(--on-primary); box-shadow: none; }
.add-btn { background: var(--primary); color: var(--on-primary); font-weight: 500; }
.seg { background: var(--surface-sunken); box-shadow: none; }
.seg button { color: var(--ink-muted); font-weight: 500; }
.seg button[aria-checked="true"] { background: var(--primary); color: var(--on-primary); }
.chip { background: var(--cs, var(--surface-sunken)); box-shadow: none; font-weight: 500; font-size: var(--text-sm); min-height: var(--control-sm); }
.chip-dot { background: var(--c); }
.chip[aria-pressed="false"] { background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--ink-muted); }
.chip[aria-pressed="false"] .chip-dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
.chip[aria-pressed="true"] { background: var(--cs, var(--surface-sunken)); }
.chip-plain { --cs: var(--surface-sunken); }
.chip-plain[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); box-shadow: none; }
input, select, textarea { background: var(--surface); border-color: var(--line-strong); border-radius: var(--radius-md); }
.area-swatch { width: 12px; height: 12px; background: var(--cb, var(--c)); }

/* sheets */
.scrim { background: color-mix(in srgb, var(--ink-fixed) 40%, transparent); }
.sheet { background: var(--canvas); border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--shadow-sheet); }
@media (min-width: 700px) { .sheet { border-radius: var(--radius-lg); box-shadow: var(--shadow-sheet); } }
.title-input { font-family: var(--font-display); font-size: var(--text-4xl); line-height: 1.15; border-bottom-color: var(--line-strong); }
.done-btn { box-shadow: inset 0 0 0 1.5px var(--ink); font-weight: 500; }
/* done: plain text with a tick, no pill; still a button, so tapping it again undoes it */
.done-btn.is-done { background: none; box-shadow: none; padding: 0 var(--s1); color: var(--ink-soft); }
.done-btn.is-done:hover { color: var(--ink); }
.card-part h3, .part-legend { font-weight: 600; color: var(--ink); font-size: var(--text-sm); }
.checklist li { background: var(--surface); border-radius: var(--radius-pill); padding: 2px 4px 2px 8px; margin-bottom: 6px; }
.check { border-radius: 50%; }
.check[aria-pressed="true"] { background: var(--pistachio); color: var(--ink-fixed); }
.quad-picker button[role="radio"] { border-radius: var(--radius-pill); box-shadow: none; font-weight: 500; }
.quad-picker button[data-q="do"] { background: var(--pink-soft); color: var(--pink-ink); }
.quad-picker button[data-q="schedule"] { background: var(--pistachio-soft); color: var(--pistachio-ink); }
.quad-picker button[data-q="delegate"] { background: var(--yellow-soft); color: var(--yellow-ink); }
.quad-picker button[data-q="drop"] { background: var(--snow-soft); color: var(--snow-ink); }
.quad-picker button[data-q="do"][aria-checked="true"] { background: var(--pink); color: var(--on-pink); }
.quad-picker button[data-q="schedule"][aria-checked="true"] { background: var(--pistachio); color: var(--on-pistachio); }
.quad-picker button[data-q="delegate"][aria-checked="true"] { background: var(--yellow); color: var(--on-yellow); }
.quad-picker button[data-q="drop"][aria-checked="true"] { background: var(--snow); color: var(--on-snow); }
.att-open { border-radius: var(--radius-md); }
.lightbox { background: color-mix(in srgb, var(--canvas) 95%, transparent); }

/* to-do: the matrix as four colour blocks */
.matrix { border: 0; border-radius: 0; overflow: visible; gap: 10px; grid-auto-rows: minmax(10rem, auto); }
.quad { border: 0 !important; border-radius: var(--radius-lg); padding: var(--s4) var(--s3) var(--s3); gap: 6px; }
.quad[data-q="do"] { background: var(--pink); color: var(--on-pink); }
.quad[data-q="schedule"] { background: var(--pistachio); color: var(--on-pistachio); }
.quad[data-q="delegate"] { background: var(--yellow); color: var(--on-yellow); }
.quad[data-q="drop"] { background: var(--snow); color: var(--on-snow); }
.quad-name, .quad[data-q="do"] .quad-name, .quad[data-q="drop"] .quad-name { font-size: var(--text-3xl); line-height: 1.05; font-weight: 400; color: inherit; }
.quad .count, .quad-hint, .quad-empty { color: inherit; opacity: 1; }
.quad .count { font-size: var(--text-md); font-family: var(--font-sans); }
.quad-head { padding: 0 4px 4px; }
.quad .todo-list { gap: 6px; }
.quad .todo-row { background: var(--surface); color: var(--ink); border-radius: var(--radius-md); padding-right: 6px; }
.quad .todo-row:hover { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.quad .inline-add, .quad .text-btn { color: inherit; }
.quad .inline-add-form .hint { color: inherit; }
.quad .drop-line { border-color: currentColor; background: transparent; }
@media (max-width: 899px) {
  .matrix { gap: 8px; grid-auto-rows: minmax(9rem, auto); }
  .quad { padding: var(--s3) 6px 8px; }
  .quad-name { font-size: var(--text-xl); }
  .quad .todo-row { border-radius: 10px; }
  .quad-focus .quad { padding: var(--s4) var(--s3); }
}
.axis { font-size: var(--text-2xs); font-weight: 500; color: var(--ink-muted); }
.tray-head h2 { font-size: var(--text-4xl); }
.todo-row:hover { background: var(--surface-sunken); }
.sort-btn { color: var(--ink-muted); }
.sticker {
  display: inline-block; align-self: flex-start; font-family: var(--font-hand); font-weight: 500; font-size: var(--text-xl); line-height: 1.2;
  background: var(--pistachio-soft); color: var(--ink); padding: 4px 14px 6px; border-radius: var(--radius-pill); transform: rotate(-2deg);
}

/* projects: each project is a colour block in its area's hue */
.area-head { border-bottom: 0; margin-bottom: var(--s3); }
.area-head h2 { gap: 10px; }
.project-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr)); gap: 12px; }
.project-list li + li { border-top: 0; }
.project-list .project-row {
  background: var(--cb); color: var(--co); border-radius: var(--radius-lg);
  padding: var(--s4) var(--s5) var(--s5); min-height: 9rem; justify-content: space-between; gap: var(--s3);
}
.project-list .project-name { font-size: var(--text-4xl); line-height: 1.05; }
.project-list .project-row:hover .project-name { text-decoration: none; }
.project-list .project-row:hover { filter: brightness(1.04); }
.project-list .entry-meta { color: inherit; font-size: var(--text-sm); }
.project-list .progress { background: color-mix(in srgb, currentColor 22%, transparent); max-width: none; height: 4px; }
.project-list .progress span { background: currentColor; }
.loose .entries { background: var(--surface); border-radius: var(--radius-lg); padding: 4px var(--s3); }

.due-strip { border-top: 0; border-bottom: 0; gap: 6px; }
.strip-day { background: var(--surface); border: 0 !important; border-radius: var(--radius-md); }
.strip-day[data-weekend] { background: var(--surface-sunken); }
.strip-num { font-size: var(--text-2xl); color: var(--ink); line-height: 1; }
.strip-day[data-today] { background: var(--primary); color: var(--on-primary); }
.strip-day[data-today] .strip-dow, .strip-day[data-today] .strip-num { color: var(--on-primary); }
.strip-day[data-today] .strip-item { background: var(--surface); }
.strip-item { background: var(--cs); border-radius: 10px; padding: 6px 6px 7px 4px; color: var(--ink); }
.strip-mark { color: var(--c); }
.strip-project { color: var(--ink-muted); }
.strip-overdue { background: var(--pink-soft); }
@media (min-width: 900px) {
  .due-strip { gap: 6px; }
  .strip-day { border-bottom: 0; }
}

/* board */
.proj-header .back { color: var(--ink-muted); font-weight: 500; }
.project-area { font-weight: 600; color: var(--c); font-size: var(--text-sm); }
.column-head { font-family: var(--font-sans); font-size: var(--text-md); font-weight: 600; border-bottom: 0; padding: 6px 4px; }
.column-head .count { background: var(--surface-sunken); border-radius: var(--radius-pill); padding: 1px 9px; font-size: var(--text-xs); color: var(--ink-muted); }
.column { background: color-mix(in srgb, var(--cs) 55%, transparent); border-radius: var(--radius-lg); padding: var(--s2) var(--s2) var(--s1); }
/* typing a new card: an empty section drops its drop space, and the hint lines up with the title */
.column:has(.inline-add-form) .cards:not(:has(li)) { min-height: 0; }
.column .inline-add-form { padding: var(--s1) 0 var(--s2); }
.column .inline-add-form .hint { padding-inline: 4px; }
.cards { gap: 8px; }
.card-tile { background: var(--surface); border: 0; border-radius: var(--radius-md); box-shadow: inset 0 0 0 1px var(--line); padding: var(--s3) var(--s3) var(--s3) var(--s2); }
.card-tile:hover { box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.card-tile[data-done] { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.card-title { font-weight: 500; }
.card-tile .card-meta span { background: var(--cs); color: var(--c); border-radius: var(--radius-pill); padding: 3px 8px; font-size: var(--text-2xs); font-weight: 500; }
.card-tile .card-meta .late { background: var(--pink-soft); color: var(--danger); }
.drag-ghost { box-shadow: var(--shadow-lift); }
.drop-line { border-radius: var(--radius-md); }
.inline-add { font-weight: 500; }

/* calendar */
.day { border-bottom-color: var(--line); }
.day-num { font-size: var(--text-5xl); line-height: 1; color: var(--ink-muted); font-weight: 400; }
.day[data-today] .day-num { color: var(--pink-ink); font-weight: 400; }
.day[data-today] .day-name { color: var(--pink-ink); }
.bracket { border-left-width: 3px; border-color: var(--cb); }
.bracket[data-start] { border-top-width: 3px; }
.bracket[data-end] { border-bottom-width: 3px; }
.month-grid { border-top: 0; }
.month-week { border-bottom-color: var(--line); }
.month-cell { border-left-color: var(--line); }
.month-cell[data-other] { background: var(--surface-sunken); }
.month-cell[aria-selected="true"] { background: var(--surface); box-shadow: inset 0 0 0 2px var(--primary); }
.month-cell[data-today] .cell-num { background: var(--pink); color: var(--on-pink); }
.month-bar { background: var(--cb); color: var(--co); border: 0 !important; border-radius: 4px; font-weight: 600; }
.month-bar:not([data-starts]) { border-top-left-radius: 0; border-bottom-left-radius: 0; }
.month-bar:not([data-ends]) { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.cell-entry:hover { background: var(--cs); }
.cell-mark, .cell-dot { color: var(--c); }

/* timeline */
.gantt { border-top-color: var(--line-strong); }
.gantt-label { background: var(--canvas); }
.gantt-bar { height: 18px; margin-top: -9px; border-radius: var(--radius-pill); background: var(--cs); box-shadow: inset 0 0 0 1.5px var(--cb); }
.gantt-bar[data-derived] { background: transparent; box-shadow: none; border: 1.5px dashed var(--cb); }
.gantt-bar:hover { box-shadow: inset 0 0 0 1.5px var(--cb), 0 0 0 3px var(--cs); }
.gantt-progress { background: var(--cb); opacity: 1; }
.gantt-grid .gantt-today { border-left-color: var(--pink); }
.gantt-today em { color: var(--pink-ink); font-style: normal; font-weight: 600; }
.gantt-mark { color: var(--c); }
.gantt-area .gantt-label { font-weight: 600; color: var(--ink); }

/* settings and setup */
.panel { border-top-color: var(--line); }
.swatch[aria-checked="true"] { box-shadow: inset 0 0 0 2px var(--ink); }
.area-name { border-left-color: var(--cb, var(--c)); border-left-width: 6px; }
.panel .seg-small { grid-template-columns: repeat(3, auto); justify-self: start; align-self: flex-start; }
/* pastels are close to the page: small marks and outlines use each hue's deeper shade */
.area-swatch { background: var(--c); }
.bracket { border-color: var(--c); }
.gantt-bar { box-shadow: inset 0 0 0 1.5px var(--c); }
.gantt-bar[data-derived] { border-color: var(--c); }
.gantt-bar:hover { box-shadow: inset 0 0 0 1.5px var(--c), 0 0 0 3px var(--cs); }
.month-bar { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 35%, transparent); }
.gantt-grid .gantt-today { border-left-color: var(--pink-ink); }

/* matrix tasks sit straight on the quadrant colour, divided by hairlines */
.quad .todo-list { gap: 0; }
.quad .todo-row { background: transparent; color: inherit; border-radius: 0; border-top: 1px solid color-mix(in srgb, currentColor 22%, transparent); }
.quad .todo-list > li:first-child .todo-row { border-top: 0; }
.quad .todo-row:hover { background: color-mix(in srgb, currentColor 7%, transparent); box-shadow: none; }
.quad .todo-row .mark, .quad .todo-row .card-meta, .quad .todo-row .late { color: inherit; }

/* one type size and rhythm for all four quadrants */
.matrix .quad .quad-name { font-size: var(--text-3xl); line-height: 1.1; font-weight: 400; color: inherit; }
.matrix .quad .quad-title { min-height: 0; align-items: baseline; }
.matrix .quad .quad-head { padding: 0 6px 6px; min-height: 3.75rem; }
.matrix .quad .count { font-size: var(--text-sm); }
.matrix .quad .quad-hint { font-size: var(--text-2xs); line-height: 1.3; }
.matrix .quad .todo-body { padding: 8px 0 7px; }
.matrix .quad .todo-title { font-size: var(--text-md); line-height: 1.35; }
.matrix .quad .card-meta { font-size: var(--text-2xs); }
@media (max-width: 899px) {
  .matrix .quad .quad-name { font-size: var(--text-2xl); }
  .matrix .quad .quad-head { min-height: 2.5rem; }
  .matrix .quad .todo-title { font-size: var(--text-sm); }
}

/* item counts as badges */
.matrix .quad .count, .tray-head .count {
  display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 7px;
  border-radius: var(--radius-pill); background: var(--ink-fixed); color: var(--cream);
  font-family: var(--font-sans); font-size: var(--text-2xs); font-weight: 600; line-height: 1; opacity: 1;
  font-variant-numeric: tabular-nums; align-self: center; transform: translateY(-2px);
}
.matrix .quad .quad-title { align-items: center; }
.tray-head h2 { align-items: center; }

/* ======================================================================
   Layout pass: floating pill navigation, greeting and bento tiles,
   day schedule, bigger stacked cards.
   ====================================================================== */
:root { --radius-xl: 28px; }

/* floating dock */
.rail-brand { display: none; }
.rail {
  background: transparent; border: 0;
  padding: 0 var(--s4) calc(var(--s3) + env(safe-area-inset-bottom));
  align-items: center; gap: var(--s2); pointer-events: none;
}
.rail > * { pointer-events: auto; }
.dock {
  display: flex; gap: 4px; padding: 6px; border-radius: var(--radius-pill);
  background: var(--ink); box-shadow: var(--shadow-lift);
}
.dock .tab {
  display: inline-grid; place-items: center; width: 48px; height: 48px; padding: 0; min-height: 0;
  border-radius: 50%; color: color-mix(in srgb, var(--canvas) 72%, transparent); background: transparent; box-shadow: none;
}
.dock .tab:hover { color: var(--canvas); }
.dock .tab[aria-current="page"] { background: var(--canvas); color: var(--ink); }
.tab-label { display: none; }
.add-btn {
  width: 60px; height: 60px; padding: 0; border-radius: 50%; justify-content: center;
  background: var(--pink); color: var(--on-pink); box-shadow: var(--shadow-lift);
}
.add-label { display: none; }
.content { padding-bottom: calc(110px + env(safe-area-inset-bottom)); }
@media (max-width: 899px) {
  .rail { justify-content: center; padding-left: var(--s3); padding-right: var(--s3); }
  .dock .tab { width: 50px; height: 50px; }
  .add-btn { width: 62px; height: 62px; }
}
@media (min-width: 900px) {
  .rail {
    top: 0; bottom: 0; width: 13rem; flex-direction: column; align-items: stretch; justify-content: flex-start;
    padding: var(--s6) var(--s4); gap: var(--s4);
  }
  .rail-brand { display: block; margin: 0 0 var(--s2) var(--s3); font-family: var(--font-display); font-size: var(--text-4xl); line-height: 1; color: var(--ink); }
  .dock { flex-direction: column; border-radius: var(--radius-xl); padding: 8px; }
  .dock .tab { width: 100%; height: 46px; border-radius: var(--radius-pill); display: flex; justify-content: flex-start; gap: var(--s3); padding: 0 var(--s4); }
  .tab-label { display: inline; font-weight: 500; }
  .add-btn { width: 100%; height: 52px; border-radius: var(--radius-pill); gap: var(--s2); }
  .add-label { display: inline; font-weight: 600; }
  .content { padding-bottom: var(--s7); }
}

/* header: round tool buttons */
.topbar { gap: var(--s2); padding-top: calc(env(safe-area-inset-top) + var(--s3)); }
.icon-btn.round { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); }
.icon-btn.round:hover { background: var(--surface-sunken); }
.icon-btn.round[aria-current="page"] { background: var(--ink); color: var(--canvas); box-shadow: none; }

/* greeting */
.greeting { padding: var(--s2) 0 var(--s5); }
.greeting h1 { display: flex; flex-direction: column; font-family: var(--font-display); font-weight: 400; line-height: 1; }
.greeting-hello { font-size: var(--text-5xl); color: var(--ink-muted); }
.greeting-name { font-size: var(--text-7xl); color: var(--ink); }
.greeting-date { margin: var(--s2) 0 0; color: var(--ink-muted); font-size: var(--text-md); }
@media (min-width: 900px) { .greeting-hello { font-size: var(--text-6xl); } .greeting-name { font-size: var(--text-8xl); } }

/* bento tiles */
.bento {
  display: grid; gap: 10px; margin-bottom: var(--s6);
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); grid-template-rows: auto auto;
}
@media (min-width: 900px) { .bento { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 0.8fr); grid-template-rows: auto; max-width: 64rem; } }
.tile {
  display: flex; flex-direction: column; gap: var(--s2); text-align: left; min-width: 0;
  border-radius: var(--radius-xl); padding: var(--s4) var(--s4) var(--s5); color: var(--ink-fixed);
  transition: transform .15s var(--ease-2);
}
.tile:hover { transform: translateY(-1px); }
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } .tile:hover { transform: none; } }
.tile-today { grid-row: span 2; background: var(--snow); }
@media (min-width: 900px) { .tile-today { grid-row: auto; } }
.tile-project { background: var(--cb, var(--lavender)); color: var(--co, var(--ink-fixed)); }
.tile-due { background: var(--pink); }
.tile-top { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); }
.tile-label { font-weight: 600; font-size: var(--text-md); }
.tile-arrow {
  display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; flex: none;
  background: var(--cream); color: var(--ink-fixed);
}
.tile-list { display: flex; flex-direction: column; }
.tile-list li { display: flex; flex-direction: column; padding: var(--s2) 0; border-top: 1px solid color-mix(in srgb, currentColor 20%, transparent); }
.tile-list li:first-child { border-top: 0; padding-top: var(--s1); }
.tile-time { font-size: var(--text-xs); }
.tile-item { font-weight: 600; font-size: var(--text-md); line-height: 1.3; overflow-wrap: anywhere; }
.tile-more { font-size: var(--text-xs); }
.tile-big { font-family: var(--font-display); font-size: var(--text-3xl); line-height: 1.05; overflow-wrap: anywhere; }
.tile-number { font-family: var(--font-display); font-size: var(--text-6xl); line-height: 0.9; }
.tile-meta { font-size: var(--text-xs); }
.tile-empty { font-size: var(--text-md); }
.tile-progress { display: block; height: 4px; border-radius: 2px; background: color-mix(in srgb, currentColor 22%, transparent); margin-top: auto; }
.tile-progress span { display: block; height: 100%; border-radius: 2px; background: currentColor; }

.todo-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s3); }
.todo-head h2 { font-family: var(--font-display); font-weight: 400; font-size: var(--text-4xl); line-height: 1; }

/* chips with count badges */
.chip-count {
  display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; margin-left: 2px;
  border-radius: var(--radius-pill); background: var(--surface); color: var(--ink); font-size: var(--text-2xs); font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.chip[aria-pressed="false"] .chip-count { background: var(--surface-sunken); color: var(--ink-muted); }
.chip-plain[aria-pressed="true"] .chip-count, .chip-plain[aria-checked="true"] .chip-count { background: var(--canvas); color: var(--ink); }
.chip { min-height: var(--control-md); padding: 0 8px 0 12px; }

/* projects: big stacked cards with an arrow */
.project-list { grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: 12px; }
@media (max-width: 899px) { .project-list { grid-template-columns: 1fr; } }
.project-list .project-row { border-radius: var(--radius-xl); min-height: 10rem; padding: var(--s5); }
.project-top { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s3); width: 100%; }
.project-list .project-name { font-size: var(--text-4xl); }
.project-list .project-row .tile-arrow { background: var(--cream); color: var(--ink-fixed); }
.area-block { padding-top: var(--s2); }
.area-head h2 { font-size: var(--text-2xl); }
.strip-day, .loose .entries, .column { border-radius: var(--radius-xl); }
.card-tile { border-radius: 18px; }
.quad { border-radius: var(--radius-xl); }

/* calendar: day / week / month */
.seg-three { grid-template-columns: repeat(3, auto); }
.day-strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-bottom: var(--s5); }
.day-pick {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: var(--s2) 0 6px;
  border-radius: var(--radius-pill); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);
}
.day-pick-dow { font-size: var(--text-2xs); font-weight: 600; color: var(--ink-muted); }
.day-pick-num { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; font-size: var(--text-base); font-weight: 500; font-variant-numeric: tabular-nums; }
.day-pick-dots { height: 10px; font-size: var(--text-2xs); line-height: 10px; letter-spacing: 1px; color: var(--ink-muted); }
.day-pick[data-today] .day-pick-num { background: var(--pink); color: var(--on-pink); }
.day-pick[aria-checked="true"] { background: var(--ink); box-shadow: none; }
.day-pick[aria-checked="true"] .day-pick-dow, .day-pick[aria-checked="true"] .day-pick-dots { color: color-mix(in srgb, var(--canvas) 75%, transparent); }
.day-pick[aria-checked="true"] .day-pick-num { color: var(--canvas); }

.all-day { display: flex; flex-direction: column; gap: 6px; margin-bottom: var(--s5); }

.all-day li[data-kind="trip"], .all-day li[data-kind="event"] { background: var(--cb); color: var(--co); }

.all-day-body { text-align: left; display: flex; justify-content: space-between; gap: var(--s3); align-items: baseline; font-weight: 500; min-height: var(--control-md); align-items: center; }

.schedule { position: relative; margin-bottom: var(--s5); }

.slot {
  position: absolute; display: flex; align-items: center; justify-content: space-between; gap: var(--s2);
  padding: 6px 6px 6px 16px; border-radius: 22px; text-align: left; overflow: hidden;
  background: var(--cb); color: var(--co); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--co) 10%, transparent);

.slot-time {
  flex: none; align-self: flex-start; padding: 5px 10px; border-radius: var(--radius-pill);
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, currentColor 45%, transparent); font-size: var(--text-2xs); font-weight: 600; white-space: nowrap;
}
.slot[data-short] .slot-title { -webkit-line-clamp: 1; }

@media (max-width: 480px) { .slot-time { display: none; } .slot[data-short] .slot-time { display: none; } }
.now-line { position: absolute; left: 3.25rem; right: 0; height: 0; border-top: 2px solid var(--pink-ink); z-index: 2; }
.now-line::before { content: ''; position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--pink-ink); }
.schedule-empty { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) rotate(-2deg); white-space: nowrap; }

/* name setting */
.name-field { display: flex; flex-direction: column; gap: var(--s2); }

/* the Today tile never matches the project tile beside it */

@media (max-width: 480px) {
  .slot { flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; padding: 8px 14px; }
  .slot-time { display: inline-block; align-self: flex-start; padding: 2px 8px; }
  .slot[data-short] { flex-direction: row; align-items: center; justify-content: space-between; padding: 4px 6px 4px 14px; }

}
@media (max-width: 480px) { .slot-title { align-self: flex-start; text-align: left; } .slot[data-short] .slot-title { align-self: center; } }
/* greeting on one line, wrapping only when the name is too long to fit */
.greeting h1 { flex-direction: row; flex-wrap: wrap; align-items: baseline; column-gap: 0.25em; row-gap: 0; font-size: var(--text-4xl); line-height: 1.05; }

/* quadrant titles sit above their colour block, on the page */
.matrix { grid-auto-rows: auto; row-gap: var(--s4); }
.quad-cell { display: flex; flex-direction: column; min-width: 0; gap: 6px; }

.matrix .quad-cell .count { background: var(--qc, var(--ink)); color: var(--ink-fixed); }
.quad-cell[data-q="do"] { --qc: var(--pink); }

}

  display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 8px;
  border-radius: var(--radius-pill); font-family: var(--font-sans); font-size: var(--text-xs); font-weight: 600; line-height: 1;
  transform: none;
}
/* key to the bullet-journal marks */
.mark-key { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 var(--s3); padding: 0; font-size: var(--text-xs); color: var(--ink-muted); }
.mark-key li { display: inline-flex; align-items: center; gap: 6px; }
.mark-key span { display: inline-grid; place-items: center; width: 18px; font-weight: 700; font-size: var(--text-base); color: var(--ink); }

.matrix-wrap { grid-template-rows: auto auto 1fr; }
.mark-key { grid-row: 1; }
.axis-top { grid-row: 2; }
.axis-side { grid-row: 3; }
.matrix { grid-row: 3; }
/* quadrants show only their names: no descriptions, no axis labels */

.matrix-wrap { grid-template-columns: minmax(0, 1fr); }

.matrix { grid-row: 2 !important; }
/* menu sits at the bottom left */

  .rail .add-btn { order: 2; }

/* menu and Add button float together in the bottom-right corner */
.topbar .brand { display: none; margin: 0 auto 0 0; font-family: var(--font-display); font-size: var(--text-3xl); line-height: 1; color: var(--ink); }
.rail {
  position: fixed; left: auto; right: 0; bottom: 0; top: auto; width: auto;
  flex-direction: row; align-items: center; justify-content: flex-end; gap: var(--s2);
  padding: 0 var(--s4) calc(var(--s3) + env(safe-area-inset-bottom));
}

@media (min-width: 900px) {
  .shell { padding-left: 0; }
  .topbar .brand { display: block; }
  .topbar { padding-left: var(--s5); padding-right: var(--s5); }
  .content { padding-left: var(--s5); padding-right: var(--s5); padding-bottom: calc(110px + env(safe-area-inset-bottom)); max-width: 72rem; }
  .content:not(.content-wide) { max-width: 46rem; }
  .rail { top: auto; bottom: 0; width: auto; padding: 0 var(--s5) var(--s5); }

/* gentler corners everywhere, so corners never cut into text */
:root { --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px; --radius-xl: 16px; }
.strip-day, .loose .entries, .column, .quad, .tile, .project-list .project-row, .bento .tile { border-radius: var(--radius-xl); }
.card-tile, .strip-item, .quad .todo-row, .att-open { border-radius: var(--radius-md); }

@media (min-width: 700px) { .sheet { border-radius: var(--radius-xl); } }
.slot { border-radius: var(--radius-md); }
.all-day li { border-radius: var(--radius-md); }
.day-pick { border-radius: var(--radius-md); }
.checklist li { border-radius: var(--radius-md); }
/* a little more room before the first line inside cards */
.strip-day { padding: var(--s3) var(--s2) var(--s3); }

.view.overview .area-block, .view.overview > .filters, .view.overview .archived { max-width: 64rem; }
@media (max-width: 899px) { .strip-day { flex-basis: 7.25rem; } }
.quad .todo-row { border-radius: 0; }
/* event time sits on the left, before the title */
.slot { justify-content: flex-start; padding-left: 6px; padding-right: 16px; gap: 10px; }
.slot .slot-time { order: -1; align-self: center; }
.slot:not([data-short]) .slot-time { align-self: flex-start; }
@media (max-width: 480px) {
  .slot { padding: 8px 14px; }

}
/* time pill then title on one line, both aligned to the top of the event */
.slot, .slot[data-short] { flex-direction: row; align-items: flex-start; justify-content: flex-start; gap: 10px; padding: 7px 14px 7px 7px; }
.slot .slot-time, .slot:not([data-short]) .slot-time, .slot[data-short] .slot-time { display: inline-block; order: -1; align-self: flex-start; padding: 4px 9px; }

.slot, .slot[data-short] {

  padding: 6px 12px; border-radius: var(--radius-md);
}

.slot .slot-time, .slot:not([data-short]) .slot-time, .slot[data-short] .slot-time {
  order: 1; display: block; align-self: auto; padding: 0; border-radius: 0; box-shadow: none;
  font-size: var(--text-sm); font-weight: 400; line-height: 1.3;
}

.slot[data-short] .slot-title { -webkit-line-clamp: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }

@media (max-width: 480px) {
  .slot .slot-title, .slot[data-short] .slot-title { font-size: var(--text-sm); }

/* add menu: card or project */
.add-wrap { position: relative; order: 2; }

}

/* project icons */
.project-icon { display: inline-grid; place-items: center; vertical-align: -0.12em; margin-right: 0.35em; color: inherit; }
.project-title-row h1 .project-icon { color: var(--c); }

/* colour and icon pickers */
.swatch-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* project-only hues: peach, aqua, lilac, sand */

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --peach: #E3BB98; --peach-soft: #3B2B21; --peach-ink: #F3C29C; --on-peach: var(--ink-fixed); --aqua: #A8D0C8; --aqua-soft: #213330; --aqua-ink: #A9DED3; --on-aqua: var(--ink-fixed); --lilac: #CFB3DD; --lilac-soft: #352A3A; --lilac-ink: #E2C2EF; --on-lilac: var(--ink-fixed); --sand: #D0C3AC; --sand-soft: #302A21; --sand-ink: #DCCDAF; --on-sand: var(--ink-fixed); } }
:root[data-theme="dark"] { --peach: #E3BB98; --peach-soft: #3B2B21; --peach-ink: #F3C29C; --on-peach: var(--ink-fixed); --aqua: #A8D0C8; --aqua-soft: #213330; --aqua-ink: #A9DED3; --on-aqua: var(--ink-fixed); --lilac: #CFB3DD; --lilac-soft: #352A3A; --lilac-ink: #E2C2EF; --on-lilac: var(--ink-fixed); --sand: #D0C3AC; --sand-soft: #302A21; --sand-ink: #DCCDAF; --on-sand: var(--ink-fixed); }

/* sections: rename, move and delete right on the project page */
.section-head { position: relative; align-items: center; gap: var(--s2); }
.section-name {
  font: inherit; color: inherit; text-align: left; padding: 2px 4px; margin: -2px -4px;
  border-radius: var(--radius-sm); min-width: 0; overflow-wrap: anywhere; cursor: text;
}

  padding: 2px 8px; margin: -4px 0; border-radius: var(--radius-sm);
}
.section-head-end { display: inline-flex; align-items: center; gap: 2px; flex: none; }
.section-more { width: 32px; height: 32px; min-height: var(--control-sm); color: var(--ink-muted); }

  position: absolute; right: 0; top: calc(100% + 4px); z-index: 12; min-width: 12rem;
  display: flex; flex-direction: column; gap: 2px; padding: 6px;

  font-family: var(--font-sans); font-size: var(--text-md); font-weight: 400; color: var(--ink);

.section-menu .danger-item { color: var(--danger); }

.column-add { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); align-self: flex-start; padding: var(--s2); }
.column-add { display: flex; flex-direction: column; gap: var(--s1); }

/* the board scrolls sideways, which would clip an open section menu; give it room while open */
.board:has(.section-menu) { padding-bottom: 14rem; margin-bottom: -14rem; }

/* Today tile as a calendar day: big date, then event blocks with an area-coloured edge */
.tile-today { gap: var(--s3); }
.cal-head { display: flex; align-items: center; gap: var(--s3); }
