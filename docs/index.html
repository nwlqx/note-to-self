.swatch-area { width: auto !important; padding: 0 12px 0 6px; border-radius: var(--radius-pill) !important; display: inline-flex !important; gap: 6px; }
.swatch-area .swatch-fill { width: 28px; height: 28px; }
.swatch-label { font-size: var(--text-sm); font-weight: 500; }
.icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
.icon-choice { height: 44px; border-radius: var(--radius-md); display: grid; place-items: center; color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.icon-choice:hover { background: var(--surface-sunken); }
.icon-choice[aria-checked="true"] { background: var(--cb); color: var(--co); box-shadow: inset 0 0 0 2px var(--ink); }
.icon-none { grid-column: span 2; font-size: var(--text-sm); font-weight: 500; }

/* project-only hues: peach, aqua, lilac, sand */
:root { --peach: #F6CFAE; --peach-soft: #FCEDE1; --peach-ink: #8E4E1F; --on-peach: var(--ink-fixed); --aqua: #BFE3DC; --aqua-soft: #E7F5F2; --aqua-ink: #2E6B60; --on-aqua: var(--ink-fixed); --lilac: #E2C9EE; --lilac-soft: #F5ECF9; --lilac-ink: #7A438F; --on-lilac: var(--ink-fixed); --sand: #E4D8C3; --sand-soft: #F4EFE6; --sand-ink: #6B5A3A; --on-sand: var(--ink-fixed); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --peach: #E3BB98; --peach-soft: #3B2B21; --peach-ink: #F3C29C; --on-peach: var(--ink-fixed); --aqua: #A8D0C8; --aqua-soft: #213330; --aqua-ink: #A9DED3; --on-aqua: var(--ink-fixed); --lilac: #CFB3DD; --lilac-soft: #352A3A; --lilac-ink: #E2C2EF; --on-lilac: var(--ink-fixed); --sand: #D0C3AC; --sand-soft: #302A21; --sand-ink: #DCCDAF; --on-sand: var(--ink-fixed); } }
:root[data-theme="dark"] { --peach: #E3BB98; --peach-soft: #3B2B21; --peach-ink: #F3C29C; --on-peach: var(--ink-fixed); --aqua: #A8D0C8; --aqua-soft: #213330; --aqua-ink: #A9DED3; --on-aqua: var(--ink-fixed); --lilac: #CFB3DD; --lilac-soft: #352A3A; --lilac-ink: #E2C2EF; --on-lilac: var(--ink-fixed); --sand: #D0C3AC; --sand-soft: #302A21; --sand-ink: #DCCDAF; --on-sand: var(--ink-fixed); }

/* sections: rename, move and delete right on the project page */
.section-head { position: relative; align-items: center; gap: var(--s2); }
.section-name {
  font: inherit; color: inherit; text-align: left; padding: 2px 4px; margin: -2px -4px;
  border-radius: var(--radius-sm); min-width: 0; overflow-wrap: anywhere; cursor: text;
}
.section-name:hover { background: color-mix(in srgb, var(--surface) 70%, transparent); }
.section-name-input {
  font: inherit; color: inherit; flex: 1; min-width: 0; min-height: var(--control-sm); height: 32px;
  padding: 2px 8px; margin: -4px 0; border-radius: var(--radius-sm);
}
.section-head-end { display: inline-flex; align-items: center; gap: 2px; flex: none; }
.section-more { width: 32px; height: 32px; min-height: var(--control-sm); color: var(--ink-muted); }
.section-more[aria-expanded="true"], .section-more:hover { color: var(--ink); }
.section-menu {
  position: absolute; right: 0; top: calc(100% + 4px); z-index: 12; min-width: 12rem;
  display: flex; flex-direction: column; gap: 2px; padding: 6px;
  background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-sheet), inset 0 0 0 1px var(--line);
  font-family: var(--font-sans); font-size: var(--text-md); font-weight: 400; color: var(--ink);
  animation: rise 140ms cubic-bezier(.2,.7,.2,1);
}
@media (prefers-reduced-motion: reduce) { .section-menu { animation: none; } }
.section-menu button { text-align: left; padding: 9px 10px; border-radius: var(--radius-md); min-height: var(--control-md); color: inherit; }
.section-menu button:hover, .section-menu button:focus-visible { background: var(--surface-sunken); }
.section-menu .danger-item { color: var(--danger); }
.section-menu .danger-item.armed { background: color-mix(in srgb, var(--danger) 12%, transparent); font-weight: 600; }
.column-add { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); align-self: flex-start; padding: var(--s2); }
.column-add .inline-add { width: 100%; }
.list-section-add { padding-top: var(--s2); }
/* the board scrolls sideways, which would clip an open section menu; give it room while open */
.board:has(.section-menu) { padding-bottom: 14rem; margin-bottom: -14rem; }

/* Today tile as a calendar day: big date, then event blocks with an area-coloured edge */
.tile-today { gap: var(--s3); }
.cal-head { display: flex; align-items: center; gap: var(--s3); }
.cal-num { font-family: var(--font-display); font-size: var(--text-6xl); line-height: 0.85; letter-spacing: -0.01em; }
.cal-when { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.cal-dow { font-weight: 600; font-size: var(--text-md); }
.cal-month { font-size: var(--text-xs); }
.cal-head .tile-arrow { margin-left: auto; align-self: flex-start; }
.cal-events { display: flex; flex-direction: column; gap: 6px; }
.cal-event {
  display: flex; flex-direction: column; gap: 1px; min-width: 0;
  padding: 7px 10px 8px 12px; border-radius: var(--radius-md);
  background: color-mix(in srgb, var(--cream, #fffdfb) 72%, transparent);
  box-shadow: inset 3px 0 0 var(--c);
}
.cal-event[data-kind="deadline"] { background: transparent; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--ink-fixed) 22%, transparent), inset 3px 0 0 var(--c); }
.cal-time { font-size: var(--text-2xs); color: color-mix(in srgb, var(--ink-fixed) 75%, transparent); }
.cal-title { font-weight: 600; font-size: var(--text-sm); line-height: 1.3; overflow-wrap: anywhere; }
.cal-more { font-size: var(--text-xs); padding-left: 2px; }
@media (max-width: 480px) { .cal-num { font-size: var(--text-5xl); } .cal-head { gap: var(--s2); } }
/* the tile stays pastel in dark mode, so the event edge mixes the area hue with fixed ink in both themes */
.cal-event { --edge: color-mix(in srgb, var(--cb) 45%, var(--ink-fixed)); box-shadow: inset 3px 0 0 var(--edge); }
.cal-event[data-kind="deadline"] { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--ink-fixed) 22%, transparent), inset 3px 0 0 var(--edge); }
/* event blocks take their area's colour, like a calendar; one that matches the tile falls back to cream */
.cal-event, .cal-event[data-kind] { background: var(--cb); color: var(--co); box-shadow: none; }
.cal-event[data-same] { background: var(--cream); }
.cal-event[data-kind="deadline"] { background: transparent; box-shadow: inset 0 0 0 1.5px var(--cb); }
.cal-event[data-kind="deadline"][data-same] { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--ink-fixed) 25%, transparent); }

/* Due today tile: open tasks and deadlines for today, overdue first */
.tile-duetoday { background: var(--lavender); color: var(--on-lavender); }
.due-list { display: flex; flex-direction: column; }
.due-list li { display: grid; grid-template-columns: 16px 1fr; gap: 4px; padding: 7px 0; border-top: 1px solid color-mix(in srgb, currentColor 18%, transparent); }
.due-list li:first-child { border-top: 0; padding-top: 2px; }
.due-list li.cal-more { display: block; border-top: 0; padding-top: 6px; }
.due-mark { font-weight: 700; line-height: 1.35; }
.due-list li[data-kind="deadline"] .due-mark { font-size: var(--text-lg); line-height: 1.2; }
.due-text { display: flex; flex-direction: column; min-width: 0; }
.due-title { font-size: var(--text-md); line-height: 1.35; overflow-wrap: anywhere; }
.due-list li[data-kind="deadline"] .due-title { font-weight: 600; }
.due-late {
  align-self: flex-start; margin-top: 3px; padding: 2px 8px; border-radius: var(--radius-pill);
  font-size: var(--text-2xs); font-weight: 600; line-height: 1.4; color: #A3303D; background: var(--cream);
}
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* Today tile: colourless, like a day cell in the calendar strip */
.tile-today, .tile-today[data-alt] { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
.tile-today .cal-month, .tile-today .tile-empty, .tile-today .cal-more { color: var(--ink-soft); }
.tile-today .tile-arrow { background: var(--surface-sunken); color: var(--ink); }
.tile-today .cal-event[data-kind="deadline"] { color: var(--ink); }

/* Two tiles now: the calendar day and one colourless "Due" card (today's list, then the week's count) */
@media (min-width: 0px) { .bento { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; } }
@media (min-width: 640px) { .bento { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); max-width: 52rem; } }
.tile-today { grid-row: auto; }
.tile-due-all { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); cursor: default; }
.tile-due-all:hover { transform: none; }
.due-head { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); text-align: left; color: inherit; margin: -4px; padding: 4px; border-radius: var(--radius-md); }
.due-head .tile-arrow, .due-head:hover .tile-arrow { background: var(--surface-sunken); color: var(--ink); }
.tile-due-all .due-list li { border-top-color: var(--line); }
.tile-due-all .tile-empty { color: var(--ink-soft); }
.tile-due-all .due-late { background: var(--pink-soft); color: var(--danger); }
.due-week {
  margin-top: auto; display: flex; align-items: center; gap: var(--s3); text-align: left; color: inherit;
  padding: var(--s3) var(--s3); border-radius: var(--radius-md); background: var(--surface-sunken);
}
.due-week:hover { background: color-mix(in srgb, var(--surface-sunken) 80%, var(--ink) 6%); }
.due-week-num { font-family: var(--font-display); font-size: var(--text-4xl); line-height: 0.9; }
.due-week-text { display: flex; flex-direction: column; flex: 1; min-width: 0; font-weight: 600; font-size: var(--text-md); line-height: 1.25; }
.due-week-meta { font-weight: 400; font-size: var(--text-xs); color: var(--ink-soft); }
/* Calendar views use the full content width, like To-do and Timeline */
.view.day-view, .view.week, .content-wide .day-detail { max-width: none; }
.view.month { max-width: none; }

/* Projects peek: hover preview above the Projects tab */
.peek-wrap { position: relative; }
.peek {
  position: absolute; left: 50%; bottom: calc(100% + 14px); transform: translateX(-50%); z-index: 20;
  width: 18.5rem; padding: 8px; display: flex; flex-direction: column; gap: 2px;
  background: var(--surface); color: var(--ink); border-radius: var(--radius-xl);
  box-shadow: var(--shadow-sheet), inset 0 0 0 1px var(--line);
  animation: rise 140ms cubic-bezier(.2,.7,.2,1);
}
.peek::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 18px; } /* keeps hover alive across the gap */
@media (prefers-reduced-motion: reduce) { .peek { animation: none; } }
.peek-head { margin: 4px 8px 6px; font-size: var(--text-xs); font-weight: 600; color: var(--ink-soft); }
.peek-list { display: flex; flex-direction: column; gap: 2px; }
.peek-row {
  width: 100%; display: grid; grid-template-columns: 32px minmax(0, 1fr) 44px; align-items: center; gap: 10px;
  padding: 6px 8px; border-radius: var(--radius-md); text-align: left; color: inherit;
}
.peek-row:hover, .peek-row:focus-visible { background: var(--surface-sunken); }
.peek-row[aria-current="page"] { background: var(--cs); }
.peek-icon { display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--cb); color: var(--co); }
.peek-icon .project-icon { display: inline-flex; margin: 0; }
.peek-text { display: flex; flex-direction: column; min-width: 0; }
.peek-name { font-weight: 600; font-size: var(--text-sm); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.peek-meta { font-size: var(--text-2xs); color: var(--ink-soft); }
.peek-bar { height: 4px; border-radius: 2px; background: var(--surface-sunken); overflow: hidden; }
.peek-bar span { display: block; height: 100%; background: var(--c); border-radius: 2px; }
.peek-empty { margin: 4px 8px 8px; color: var(--ink-soft); font-size: var(--text-sm); }
.peek-all {
  margin-top: 4px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 10px; border-top: 1px solid var(--line); border-radius: 0 0 var(--radius-md) var(--radius-md);
  font-size: var(--text-sm); font-weight: 500; color: inherit; text-align: left;
}
.peek-all:hover, .peek-all:focus-visible { background: var(--surface-sunken); }

/* ---------- Money ---------- */
.m-head-tools { display: flex; gap: var(--s2); }
.m-month { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s4); }
.m-month-name { font-family: var(--font-display); font-weight: 400; font-size: var(--text-3xl); line-height: 1.1; }
.m-month-nav { display: flex; align-items: center; gap: 2px; }
.m-top { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); margin-bottom: var(--s6); }
@media (min-width: 720px) { .m-top { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.m-card {
  display: flex; flex-direction: column; gap: var(--s2); min-width: 0;
  background: var(--surface); color: var(--ink); border-radius: var(--radius-xl); padding: var(--s5);
  box-shadow: inset 0 0 0 1px var(--line-strong);
}
.m-card-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s2); }
.m-big { font-family: var(--font-display); font-size: var(--text-6xl); line-height: 0.95; letter-spacing: -0.01em; font-variant-numeric: lining-nums; }
.m-big.small { font-size: var(--text-5xl); margin: var(--s1) 0 var(--s2); }
.m-of { font-family: var(--font-sans); font-size: var(--text-xs); color: var(--ink-soft); letter-spacing: 0; }
.m-big .m-of { font-size: var(--text-base); }
.m-sub { font-size: var(--text-sm); color: var(--ink-soft); }
.m-sub strong { color: var(--ink); font-weight: 600; }
.m-sub.quiet { font-size: var(--text-xs); }
.m-over, .m-sub strong.m-over { color: var(--danger); }
.m-start { align-self: flex-start; padding-left: 0; }
.m-log { align-self: flex-start; margin-top: auto; display: inline-flex; align-items: center; gap: 6px; }
.m-bar { display: block; height: 6px; border-radius: 3px; background: var(--surface-sunken); overflow: hidden; margin: 2px 0; }
.m-bar > span { display: block; height: 100%; border-radius: 3px; background: var(--c, var(--ink)); }
.m-card .m-bar > span { background: var(--ink); }
.m-bar[data-over] > span { background: var(--danger); }

.m-bill-list { display: flex; flex-direction: column; }
.m-bill-list li { display: flex; align-items: center; gap: var(--s2); border-top: 1px solid var(--line); }
.m-bill-list li:first-child { border-top: 0; }
.m-bill { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--s3); padding: 9px 0; text-align: left; color: inherit; }
.m-bill-list li { position: relative; }
.m-bill::after { content: ''; position: absolute; inset: 0; } /* the whole row opens the bill */
.m-bill-side { display: flex; align-items: center; gap: var(--s2); flex: none; pointer-events: none; }
.m-bill-side .m-paid { position: relative; z-index: 1; pointer-events: auto; }
/* narrow screens: the amount sits above Paid so the bill name has the width */
@media (max-width: 480px) {
  .m-bill-side { flex-direction: column; align-items: flex-end; gap: 4px; padding: 9px 0; }
}
.m-bill-list li[data-late] .m-due { color: var(--danger); font-weight: 600; }
.m-bill-list li[data-today] .m-due { color: var(--ink); font-weight: 600; }
/* "Mark paid" is an action, not a status, so it's an outlined button rather than a filled badge */
.m-paid {
  display: inline-flex; align-items: center; gap: 4px; flex: none; min-height: var(--control-sm); padding: 0 12px 0 9px;
  border-radius: var(--radius-pill); background: transparent; color: var(--ink); font-size: var(--text-xs); font-weight: 600; white-space: nowrap;
  box-shadow: inset 0 0 0 1.5px var(--line-strong);
}
.m-paid svg { width: 14px; height: 14px; flex: none; }
.m-paid:hover, .m-paid:focus-visible { background: var(--pistachio); color: var(--on-pistachio); box-shadow: none; }
.m-card-foot { margin-top: auto; display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; color: var(--ink-soft); font-size: var(--text-sm); padding: 6px 0 0; }
.m-card-foot:hover { color: var(--ink); }

.m-cols { display: grid; gap: var(--s6); grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .m-cols { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: var(--s7); } }
.m-section { min-width: 0; }
.m-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2); }
.m-h2 { font-family: var(--font-display); font-weight: 400; font-size: var(--text-2xl); margin: 0 0 var(--s3); }
.m-h2 + .m-budgets, .m-h2 + .m-trips { margin-top: 0; }
.m-trips { margin-bottom: 0; }
.m-section .m-h2:not(:first-child) { margin-top: var(--s6); }
.m-budgets, .m-trips { display: flex; flex-direction: column; gap: 4px; }
.m-budget, .m-trip {
  width: 100%; display: flex; flex-direction: column; gap: 6px; text-align: left; color: inherit;
  padding: 12px 14px; border-radius: var(--radius-md);
}
.m-budget:hover, .m-trip:hover { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.m-budget[aria-pressed="true"] { background: var(--cs); box-shadow: inset 0 0 0 1.5px var(--c); }
.m-static { cursor: default; }
.m-budget-top { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); }
.m-budget-name { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: var(--text-md); min-width: 0; }
.m-trip .m-budget-name .project-icon { color: var(--c); margin-right: 0; }
.m-budget-num { font-variant-numeric: tabular-nums; font-size: var(--text-md); white-space: nowrap; }
.m-budget-left { font-size: var(--text-xs); color: var(--ink-soft); }
.m-budget-left.m-over { color: var(--danger); font-weight: 600; }
.m-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--cb, var(--ink-faint)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c, var(--ink)) 35%, transparent); flex: none; }

.m-day { margin-bottom: var(--s4); }
.m-day-head { display: flex; justify-content: space-between; gap: var(--s2); font-size: var(--text-xs); font-weight: 600; color: var(--ink-soft); padding: 0 4px 6px; border-bottom: 1px solid var(--line-strong); font-variant-numeric: tabular-nums; }
.m-rows { display: flex; flex-direction: column; }
.m-rows li + li { border-top: 1px solid var(--line); }
.m-row { width: 100%; display: flex; align-items: center; gap: var(--s3); padding: 10px 4px; text-align: left; color: inherit; border-radius: var(--radius-sm); }
.m-row:hover { background: var(--surface); }
.m-row-text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.m-row-title { font-size: var(--text-md); line-height: 1.3; overflow-wrap: anywhere; }
.m-row-meta { font-size: var(--text-2xs); color: var(--ink-soft); }
.m-amount { display: flex; flex-direction: column; align-items: flex-end; flex: none; font-variant-numeric: tabular-nums; }
.m-amount-main { font-weight: 600; font-size: var(--text-md); white-space: nowrap; font-variant-numeric: tabular-nums; }
.m-amount-sub { font-size: var(--text-2xs); color: var(--ink-soft); }

/* sheets */
.m-amount-field { display: flex; align-items: stretch; gap: var(--s2); border-bottom: 1px solid var(--line-strong); padding-bottom: 4px; }
.m-amount-field select { flex: none; width: auto; min-width: 5.5rem; font-weight: 600; }
.m-amount-field input { flex: 1; min-width: 0; border: 0; background: transparent; font-family: var(--font-display); font-size: var(--text-5xl); line-height: 1.1; padding: 0 4px; font-variant-numeric: lining-nums; }
.m-amount-field input:focus-visible { outline: none; }
.m-amount-field:focus-within { border-bottom-color: var(--ink); }
.m-rate { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s2); font-size: var(--text-sm); color: var(--ink-soft); }
.m-rate-input { display: inline-flex; flex-direction: row; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--ink-soft); }
.m-rate-input input { width: 7.5rem; min-height: var(--control-md); padding: 4px 8px; font-variant-numeric: tabular-nums; }
.m-rate-sgd { font-weight: 600; color: var(--ink); }
.m-note { font-size: var(--text-base); }
.m-cat-chips { flex-wrap: wrap; }
.m-cat-chips .chip[aria-checked="true"] { background: var(--cb); color: var(--co); box-shadow: inset 0 0 0 1.5px var(--c); }
.m-cat-chips .chip[aria-checked="true"] .chip-dot { background: var(--co); }
.m-bill-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); }
.m-bill-actions .secondary { display: inline-flex; align-items: center; gap: 6px; }
.money-input { display: flex; flex-direction: row; align-items: center; gap: 6px; max-width: 14rem; }
.money-input .money-prefix { color: var(--ink-soft); font-weight: 600; font-size: var(--text-md); }
.money-input input { flex: 1; min-width: 0; }
.money-input.small { max-width: 9rem; }
.m-cat-edit { display: flex; flex-direction: column; gap: 6px; }
.m-cat-edit li { display: grid; grid-template-columns: 28px minmax(0, 1fr) 9rem 36px; align-items: center; gap: var(--s2); }
.m-swatch { width: 24px; height: 24px; border-radius: 50%; background: var(--cb); box-shadow: inset 0 0 0 1.5px var(--c); }
.m-total { font-size: var(--text-md); color: var(--ink-soft); }
.m-total strong { color: var(--ink); }
.m-rates { display: flex; flex-direction: column; gap: var(--s2); }
.m-rates li { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); }
.m-add-cur { display: flex; gap: var(--s2); align-items: center; }
.m-add-cur select { width: auto; }
.m-split { display: flex; flex-wrap: wrap; gap: 6px; }
.m-split li { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--radius-pill); background: var(--cs); font-size: var(--text-xs); }
.m-split li span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; }
.m-split .m-dot { width: 8px; height: 8px; }

/* project page: money line under the title */
.spend-pill {
  display: inline-flex; align-items: center; gap: 8px; margin-top: var(--s2); padding: 6px 12px 6px 10px;
  border-radius: var(--radius-pill); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong);
  color: var(--ink); font-size: var(--text-sm); font-weight: 600; font-variant-numeric: tabular-nums;
}
.spend-pill:hover { box-shadow: inset 0 0 0 1px var(--ink-soft); }
.spend-of { font-weight: 400; color: var(--ink-soft); }
.spend-bar { width: 56px; height: 5px; border-radius: 3px; background: var(--surface-sunken); overflow: hidden; }
.spend-bar span { display: block; height: 100%; background: var(--c, var(--ink)); }
.spend-pill[data-over] .spend-bar span { background: var(--danger); }
.spend-pill[data-over] { color: var(--danger); }
.secondary { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--control-lg); padding: 0 18px; border-radius: var(--radius-pill); background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line-strong); font-weight: 500; }
.secondary:hover:not(:disabled) { box-shadow: inset 0 0 0 1.5px var(--ink); }
.secondary:disabled { opacity: .45; }

/* Page header: the title shares one row with the tool buttons, inside the page column */
.content { position: relative; padding-top: 20px; --head-h: 46px; }
@media (min-width: 900px) { .content { padding-top: 28px; --head-h: 60px; } }
.topbar {
  position: absolute; top: 20px; right: var(--s4); left: auto; z-index: 6;
  height: var(--head-h); padding: 0; background: none; display: flex; align-items: center; gap: var(--s2);
}
@media (min-width: 900px) { .topbar { top: 28px; right: var(--s5); padding: 0; } }
.view-head, .greeting { padding-top: 0; padding-right: calc(var(--bar-w, 150px) + var(--s3)); }
.view-head { align-items: center; min-height: var(--head-h); flex-wrap: wrap; row-gap: var(--s3); }
.view-head h1 { line-height: 1; }
.greeting h1 { min-height: var(--head-h); align-items: center; }
.greeting-name { white-space: normal; }
.proj-header .back { min-height: var(--head-h); display: inline-flex; align-items: center; }
@media (max-width: 899px) { .greeting h1 { font-size: var(--text-4xl); } }

/* Highlighter under serif headings, colour coded by page (and by quadrant, area or project) */
.content { --hl: var(--rose); }
.content[data-page="todo"] { --hl: var(--pink); }
.content[data-page="projects"] { --hl: var(--lavender); }
.content[data-page="calendar"] { --hl: var(--snow); }
.content[data-page="timeline"] { --hl: var(--pistachio); }
.content[data-page="money"] { --hl: var(--yellow); }
.content[data-page="settings"] { --hl: var(--rose); }
.content[data-page="project"] .view.project { --hl: var(--cb); }
.area-block .area-head { --hl: var(--cb); }
.quad-cell[data-q="do"] { --hl: var(--pink); }
.quad-cell[data-q="schedule"] { --hl: var(--pistachio); }
.quad-cell[data-q="delegate"] { --hl: var(--yellow); }
.quad-cell[data-q="drop"] { --hl: var(--snow); }
.content { --hl-mix: 100%; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .content { --hl-mix: 34%; } }
:root[data-theme="dark"] .content { --hl-mix: 34%; }

.view-head h1, .greeting-name, .project-title-row h1, .cal-sub h2, .month-title, .area-head h2, .tray-head h2,
.quad-name, .todo-head h2, .day-title, .m-month-name, .m-h2, .panel h2, .gantt-area .gantt-label {
  --hl-c: color-mix(in srgb, var(--hl) var(--hl-mix), transparent);
  width: fit-content;
  background-image: linear-gradient(to bottom, transparent 52%, var(--hl-c) 52%, var(--hl-c) 92%, transparent 92%);
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
  padding-inline: 0.14em; margin-inline-start: -0.14em;
}
/* the highlight is for section headings only, not the big page titles */
.view-head h1, .greeting-name, .project-title-row h1 { background-image: none; padding-inline: 0; margin-inline-start: 0; }
/* headings with a dot or a count: highlight the words only */
.area-head h2, .tray-head h2 { background-image: none; padding-inline: 0; margin-inline-start: 0; }
.area-head .hl-text, .tray-head .hl-text {
  --hl-c: color-mix(in srgb, var(--hl) var(--hl-mix), transparent);
  background-image: linear-gradient(to bottom, transparent 52%, var(--hl-c) 52%, var(--hl-c) 92%, transparent 92%);
  -webkit-box-decoration-break: clone; box-decoration-break: clone; padding-inline: 0.14em;
}
/* the dot in an area heading uses the same pastel as its highlight */
.area-head .area-swatch { background: var(--cb); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent); }

/* ---------- project lists ---------- */
.proj-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s5); }
.proj-body .plists { order: -1; }
@media (min-width: 1100px) {
  .proj-body { grid-template-columns: minmax(0, 1fr) 20rem; gap: var(--s6); align-items: start; }
  .proj-body .plists { order: 0; }
}
.plists { display: flex; flex-direction: column; gap: var(--s2); min-width: 0; }
.plists-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
.plists-title { font-family: var(--font-display); font-weight: 400; font-size: var(--text-2xl); line-height: 1.1; }
.plists-title .hl-text {
  --hl-c: color-mix(in srgb, var(--cb) var(--hl-mix, 100%), transparent);
  background-image: linear-gradient(to bottom, transparent 52%, var(--hl-c) 52%, var(--hl-c) 92%, transparent 92%);
  padding-inline: 0.14em; margin-inline-start: -0.14em;
}
.plists-head .text-btn { display: inline-flex; align-items: center; gap: 4px; }
.plists-empty { margin: 0; font-size: var(--text-sm); color: var(--ink-soft); }
.plist-new input { width: 100%; }
.plist { background: var(--surface); border-radius: var(--radius-lg); box-shadow: inset 0 0 0 1px var(--line); padding: 8px 10px 6px; }
.plist-head { position: relative; display: flex; align-items: center; gap: 4px; }
.plist-toggle { width: 28px; height: 28px; display: grid; place-items: center; color: var(--ink-soft); border-radius: var(--radius-sm); flex: none; }
.plist-toggle:hover { background: var(--surface-sunken); color: var(--ink); }
.plist-name { flex: 1; min-width: 0; text-align: left; font-weight: 600; font-size: var(--text-md); color: inherit; padding: 4px 2px; overflow-wrap: anywhere; }
.plist-name-input { flex: 1; min-width: 0; min-height: var(--control-sm); height: 32px; padding: 2px 8px; font-weight: 600; }
.plist-count { font-size: var(--text-xs); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.plist-more { width: 30px; height: 30px; min-height: var(--control-sm); color: var(--ink-soft); }
.plist-bar { display: block; height: 4px; margin: 4px 4px 6px; border-radius: 2px; background: var(--surface-sunken); overflow: hidden; }
.plist-bar span { display: block; height: 100%; background: var(--c, var(--ink)); border-radius: 2px; }
.plist[data-collapsed] .plist-bar { margin-bottom: 2px; }
.plist-items { display: flex; flex-direction: column; min-height: 6px; }
.plist-items > li:not(.drop-line) {
  display: grid; grid-template-columns: 14px 26px minmax(0, 1fr) auto; align-items: center; gap: 4px;
  padding: 1px 0; border-radius: var(--radius-sm); touch-action: pan-y; user-select: none; -webkit-user-select: none;
}
.plist-items > li:hover { background: var(--surface-sunken); }
.plist-grip { color: var(--ink-faint); opacity: 0; cursor: grab; display: grid; place-items: center; }
.plist-items > li:hover .plist-grip { opacity: 1; }
@media (hover: none) { .plist-grip { opacity: .6; } }
.plist-items .check { width: 22px; height: 22px; min-height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line-strong); display: grid; place-items: center; color: var(--ink-fixed); background: transparent; }
.plist-items .check[aria-pressed="true"] { background: var(--cb, var(--pistachio)); box-shadow: inset 0 0 0 1.5px var(--c); }
.plist-text { border: 0; background: transparent; min-height: var(--control-sm); padding: 4px 6px; font-size: var(--text-md); min-width: 0; width: 100%; user-select: text; -webkit-user-select: text; }
.plist-text:focus { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong); outline: none; }
.plist-items li[data-done] .plist-text { color: var(--ink-faint); text-decoration: line-through; }
.plist-actions { display: inline-flex; opacity: 0; }
.plist-items > li:hover .plist-actions, .plist-items > li:focus-within .plist-actions { opacity: 1; }
@media (hover: none) { .plist-actions { opacity: 1; } .plist-actions .icon-btn:first-child { display: inline-grid; } }
.plist-actions .icon-btn { width: 30px; height: 30px; min-height: var(--control-sm); color: var(--ink-soft); }
.plist-actions .icon-btn:hover { color: var(--ink); }
.plist-add { margin-top: 2px; }
.plist-add input { min-height: var(--control-md); }
.plist .drop-line { border: 1.5px dashed var(--line-strong); border-radius: var(--radius-sm); background: transparent; list-style: none; }

/* done things: greyed out and struck through, everywhere */
.mk-done, .mk-done .mk-done-text { color: var(--ink-faint); }
.mk-done-text { text-decoration: line-through; }
.entry[data-done] .entry-title, .card-tile[data-done] .card-title, .todo-row[data-done] .todo-title,
li[data-done] .cell-title, .all-day li[data-done] .all-day-body, .m-row[data-done] .m-row-title {
  color: var(--ink-faint); text-decoration: line-through; text-decoration-color: currentColor; font-weight: 400;
}
.card-tile[data-done] .card-meta, .entry[data-done] .entry-meta { opacity: .7; }
.mark-key .mk-done span { color: var(--ink-faint); } .mk-done-text { font-weight: 400; }

/* matrix and tray rows: a tick box, then the kind mark, then the title */
.todo-row, .quad .todo-row, .quad-focus .quad .todo-row { grid-template-columns: 30px 16px minmax(0, 1fr) auto; }
.todo-row .mark, .quad .todo-row .mark { width: 16px; height: 36px; }
.todo-check {
  align-self: start; margin-top: 7px; width: 22px; height: 22px; min-height: 22px; border-radius: 50%;
  display: grid; place-items: center; background: transparent; color: var(--ink-fixed);
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, currentColor 45%, transparent); cursor: pointer;
}
.quad .todo-check { color: inherit; }
.todo-check:hover { box-shadow: inset 0 0 0 1.5px currentColor; }
.todo-check[aria-pressed="true"] { background: var(--ink-fixed); color: var(--cream); box-shadow: none; }
.tray .todo-check[aria-pressed="true"] { background: var(--ink); color: var(--canvas); }
.todo-row[data-done] { cursor: default; }
.todo-row[data-done] .mark, .todo-row[data-done] .card-meta { opacity: .5; }
.quad .todo-row[data-done] .todo-title { color: inherit; opacity: .55; }
@media (max-width: 899px) { .quad .todo-row { grid-template-columns: 28px 14px minmax(0, 1fr) auto; } .quad .todo-row .mark { width: 14px; } }
/* tick box on the right */
.todo-row, .quad .todo-row, .quad-focus .quad .todo-row { grid-template-columns: 24px minmax(0, 1fr) auto auto; padding-right: 8px; }
.todo-row .mark, .quad .todo-row .mark { width: 24px; }
.todo-check { margin: 9px 0 0 8px; }
@media (max-width: 899px) { .quad .todo-row { grid-template-columns: 20px minmax(0, 1fr) auto auto; padding-right: 4px; } .quad .todo-row .mark { width: 20px; } .todo-check { margin-left: 4px; } }
/* every task title in the matrix, To sort and Due today is bold, not just deadlines */
.todo-title, .todo-title[data-kind], .due-title { font-weight: 600; }
.todo-row[data-done] .todo-title { font-weight: 600; }


/* matrix: no task/deadline marks; a due date shows with the flower */
.todo-row, .quad .todo-row, .quad-focus .quad .todo-row { grid-template-columns: minmax(0, 1fr) auto auto; padding-left: 10px; }
@media (max-width: 899px) { .quad .todo-row { grid-template-columns: minmax(0, 1fr) auto auto; padding-left: 6px; } }
.todo-row .todo-body { padding-left: 0; }
.due-chip { display: inline-flex; align-items: baseline; gap: 3px; }
.due-flower { font-weight: 700; font-size: 1.05em; line-height: 0; transform: translateY(0.12em); }
.due-flower { font-size: 1.5em; transform: translateY(0.3em); margin-right: 1px; } .due-chip { gap: 2px; }
/* no flower anywhere: dated tasks use the same dot as other tasks */
.glyph-deadline { font-size: inherit; transform: none; }
.card-tile[data-kind="deadline"] .card-mark, .strip-item[data-kind="deadline"] .strip-mark, .due-list li[data-kind="deadline"] .due-mark { font-size: inherit; line-height: inherit; transform: none; }
/* bills in Due today: the $ sits in a little coin, the cost on its own line */
.due-list li[data-bill] { grid-template-columns: 24px 1fr; align-items: start; }
.due-list li[data-bill] .due-mark {
  width: 22px; height: 22px; margin-top: 1px; border-radius: 50%; display: grid; place-items: center;
  background: var(--sand-soft, var(--yellow-soft)); color: var(--sand-ink, var(--yellow-ink)); font-size: var(--text-xs); font-weight: 700; line-height: 1;
}
.due-cost { font-size: var(--text-xs); font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; margin-top: 1px; }
.due-cost-tag { font-weight: 400; color: var(--ink-soft); }
.tile-due-all .due-list li:not(.cal-more) { grid-template-columns: 24px 1fr; } .tile-due-all .due-mark { text-align: center; justify-self: center; }

/* ---------- Meals ---------- */
.content[data-page="meals"] { --hl: var(--peach); }
.ml-summary { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 0 0 var(--s4); font-size: var(--text-md); color: var(--ink-soft); }
.ml-summary strong { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.ml-summary .m-over strong, .ml-summary .m-over { color: var(--danger); }
.ml-week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-bottom: var(--s6); }
.ml-day { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ml-day-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 2px; }
.ml-dow { font-size: var(--text-xs); color: var(--ink-soft); }
.ml-dnum { font-family: var(--font-display); font-size: var(--text-3xl); line-height: 1; }
.ml-day[data-today] .ml-dnum { background: var(--peach); color: var(--on-peach); border-radius: 50%; width: 1.6em; height: 1.6em; display: inline-grid; place-items: center; font-size: var(--text-lg); }
.ml-slot {
  display: flex; flex-direction: column; gap: 2px; min-height: 84px; padding: 9px 10px; text-align: left; color: var(--ink);
  border-radius: var(--radius-md); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); min-width: 0;
}
.ml-slot:hover { box-shadow: inset 0 0 0 1px var(--line-strong); }
.ml-slot[data-slot="breakfast"]:not([data-empty]) { background: var(--yellow-soft); }
.ml-slot[data-slot="lunch"]:not([data-empty]) { background: var(--pistachio-soft); }
.ml-slot[data-slot="dinner"]:not([data-empty]) { background: var(--peach-soft); }
.ml-slot[data-empty] { background: transparent; box-shadow: inset 0 0 0 1px var(--line); border: 0; }
.ml-slot-label { font-size: var(--text-2xs); letter-spacing: 0.02em; color: var(--ink-soft); font-weight: 600; }
.ml-meal { font-size: var(--text-sm); font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.ml-cost { font-size: var(--text-2xs); color: var(--ink-soft); font-variant-numeric: tabular-nums; margin-top: auto; }
.ml-add { display: inline-flex; align-items: center; gap: 3px; font-size: var(--text-xs); color: var(--ink-faint); margin-top: auto; }
.ml-slot[data-empty]:hover .ml-add { color: var(--ink); }
@media (max-width: 899px) {
  .ml-week { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .ml-day { display: grid; grid-template-columns: 44px repeat(3, minmax(0, 1fr)); gap: 6px; align-items: stretch; padding: 4px 0; border-top: 1px solid var(--line); }
  .ml-day-head { flex-direction: column; align-items: flex-start; justify-content: center; padding: 0; }
  .ml-slot { min-height: 64px; padding: 7px 8px; }
  .ml-meal { font-size: var(--text-xs); }
}
.ml-cols { display: grid; gap: var(--s6); grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .ml-cols { grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: var(--s7); } }
.ml-groc-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); margin-bottom: var(--s2); }
.ml-note { margin: 0 0 var(--s2); font-size: var(--text-sm); color: var(--ink-soft); }
.ml-groc { display: flex; flex-direction: column; }
.ml-groc li { display: grid; grid-template-columns: 30px minmax(0, 1fr) 34px; align-items: center; gap: 4px; padding: 3px 0; border-top: 1px solid var(--line); }
.ml-groc li:first-child { border-top: 0; }
.ml-groc .check { width: 22px; height: 22px; min-height: 22px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px var(--line-strong); background: transparent; color: var(--ink-fixed); }
.ml-groc .check[aria-pressed="true"] { background: var(--pistachio); box-shadow: none; }
.ml-groc-text { display: flex; flex-direction: column; min-width: 0; padding: 4px 0; }
.ml-groc-name { font-size: var(--text-md); }
.ml-qty { color: var(--ink-soft); font-size: var(--text-sm); }
.ml-groc li[data-done] .ml-groc-name { color: var(--ink-faint); text-decoration: line-through; }
.ml-groc .icon-btn { width: 32px; height: 32px; min-height: var(--control-sm); color: var(--ink-soft); opacity: .6; }
.ml-groc li:hover .icon-btn { opacity: 1; }
.ml-bought-head { display: flex; justify-content: space-between; align-items: center; margin-top: var(--s4); }
.ml-recipes { display: flex; flex-direction: column; gap: 4px; }
.ml-recipe { width: 100%; display: flex; flex-direction: column; gap: 2px; text-align: left; color: inherit; padding: 10px 12px; border-radius: var(--radius-md); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.ml-recipe:hover { box-shadow: inset 0 0 0 1px var(--line-strong); }
.ml-recipe-name { font-weight: 600; font-size: var(--text-md); }
.ml-pick { flex-wrap: wrap; }
.ml-pick .chip[aria-checked="true"] { background: var(--peach); color: var(--on-peach); }
.ml-ings { display: flex; flex-direction: column; gap: 6px; }
.ml-ings li { display: grid; grid-template-columns: minmax(0, 1fr) 7.5rem 34px; gap: 6px; align-items: center; }
@media (min-width: 900px) { .ml-day-head { height: 34px; align-items: center; } }
.ml-day[data-today] .ml-dnum { width: 1.5em; height: 1.5em; font-size: var(--text-lg); }

/* ---------- matrix: project on each task, and a project filter ---------- */
.card-meta .todo-proj { gap: 4px; min-width: 0; }
.card-meta .todo-proj > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.todo-proj .project-icon { display: inline-flex; flex: none; opacity: .85; }
.todo-head .todo-summary { margin-left: auto; }
.proj-filter { position: relative; display: inline-flex; align-items: center; align-self: center; gap: 2px; }
.proj-filter-btn {
  display: inline-flex; align-items: center; gap: 5px; min-height: var(--control-sm); padding: 0 10px;
  border-radius: 999px; font-size: var(--text-sm); color: var(--ink-soft); background: transparent;
  box-shadow: inset 0 0 0 1px var(--line); max-width: 14rem;
}
.proj-filter-btn > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj-filter-btn:hover, .proj-filter-btn[aria-expanded="true"] { color: var(--ink); background: var(--surface-sunken); }
.proj-filter-btn.on { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--ink); }
.proj-filter-clear { width: 28px; height: 28px; min-height: var(--control-xs); color: var(--ink-muted); }
.proj-filter-menu { max-height: 60vh; overflow-y: auto; }
.proj-filter-menu button { display: flex; align-items: center; gap: 8px; text-align: left; padding: 8px 10px; border-radius: var(--radius-sm); }
.proj-filter-menu button:hover { background: var(--surface-sunken); }
.proj-filter-menu button[aria-checked="true"] { font-weight: 600; }
.proj-filter-menu button[aria-checked="true"]::after { content: '✓'; margin-left: auto; padding-left: 12px; }
@media (max-width: 560px) {
  .todo-head { flex-wrap: wrap; }
  .proj-filter-btn { max-width: 10rem; }
}
.card-meta .todo-proj { max-width: 100%; overflow: hidden; }
.card-meta .todo-proj > span:last-child { display: block; min-width: 0; }
.todo-proj-icon { display: inline-flex; vertical-align: -2px; margin-right: 6px; opacity: .8; }
.todo-proj-icon .project-icon { display: inline-flex; }
/* bill $ without the coin behind it */
.due-list li[data-bill] .due-mark { background: none; width: auto; height: auto; margin-top: 0; display: block; color: inherit; font-size: inherit; line-height: 1.35; }

/* ---------- to buy (Budgeting page) ---------- */
.to-buy { margin-top: var(--s6, 2.5rem); }
.to-buy .m-section-head { display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap; }
.to-buy .m-section-head .todo-summary { margin-right: auto; }
.to-buy .buy-price { font-style: normal; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.to-buy [data-done] .buy-price { color: inherit; font-weight: 400; }
.to-buy .buy-log { flex: none; align-self: center; margin-right: 4px; }
.to-buy .buy-hint { margin-top: var(--s3); }
.buy-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.buy-picker button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 10px 12px; border-radius: var(--radius-md, 12px); text-align: center; min-height: 0; } /* both lines centred in the pill */
.buy-picker button strong { font-weight: 600; font-size: var(--text-md); }
.buy-picker button small { font-size: var(--text-xs); opacity: .85; }
.buy-picker button[aria-checked="true"] { box-shadow: inset 0 0 0 2px currentColor; }
.buy-open { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; }
.todo-head h2 { background-image: none; padding-inline: 0; margin-inline-start: 0; }
.tray-head .hl-text { background-image: none; padding-inline: 0; }
.to-buy .m-section-head .m-h2 { background-image: none; padding-inline: 0; margin-inline-start: 0; }
.to-buy .m-section-head > .text-btn { margin-left: auto; }
.to-buy .quad { display: flex; flex-direction: column; }
.buy-foot { margin-top: auto; display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.buy-foot .card-add { flex: 1 1 auto; margin-top: 0; }
.buy-foot .card-add:has(.inline-add-form) { flex-basis: 100%; } /* typing: the boxes take the full width, the total drops below */
.buy-total { margin-left: auto; padding: 6px 4px 2px; font-size: var(--text-xs); color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.buy-total strong { color: var(--ink); font-weight: 600; }
#m-budgets { background-image: none; padding-inline: 0; margin-inline-start: 0; }
.to-buy { margin-top: 0; margin-bottom: calc(var(--s6) + var(--s3)); }

/* ---------- Budgeting: spending as tiles, details in a side drawer ---------- */
.m-spend { margin-bottom: calc(var(--s6) + var(--s3)); }
.m-spend .m-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); }
.m-spend .m-h2 { background-image: none; padding-inline: 0; margin-inline-start: 0; }
.m-stack { display: flex; height: 10px; border-radius: 999px; overflow: hidden; gap: 2px; margin: var(--s2) 0 var(--s4); }
.m-stack > span { background: var(--cb); min-width: 4px; }
.m-tiles { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 700px) { .m-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1000px) { .m-tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.m-tile {
  width: 100%; height: 100%; display: flex; flex-direction: column; align-items: stretch; gap: 6px; text-align: left;
  padding: 12px 14px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);
  min-height: 0; color: var(--ink);
}
.m-tile:hover { box-shadow: inset 0 0 0 1px var(--rule-strong); background: color-mix(in srgb, var(--cs) 45%, var(--surface)); }
.m-tile-name { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: var(--text-md); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.m-tile-name .project-icon { display: inline-flex; flex: none; }
.m-tile-num { font-variant-numeric: tabular-nums; font-size: var(--text-base); font-weight: 600; }
.m-tile-num .m-of { font-weight: 400; font-size: var(--text-xs); color: var(--ink-soft); }
.m-tile .m-bar { margin: 0; }
.m-tile-left, .m-tile-count { font-size: var(--text-xs); color: var(--ink-soft); }
.m-tile-left.m-over { color: var(--danger); font-weight: 600; }

/* side drawer: a bottom sheet on phones, a panel from the right on bigger screens */
@media (min-width: 700px) {
  .scrim-side { align-items: stretch; justify-content: flex-end; }
  .sheet.sheet-side {
    max-width: 28rem; width: 100%; max-height: none; height: 100%; border-radius: 0;
    padding-top: var(--s4); box-shadow: -1px 0 0 var(--rule-strong), -20px 0 50px -24px rgba(20, 30, 40, .35);
    animation: slide-in 240ms cubic-bezier(.2,.7,.2,1);
  }
}
@keyframes slide-in { from { transform: translateX(24px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .sheet.sheet-side { animation: none; } }
.m-drawer-head { display: flex; flex-direction: column; gap: 6px; }
.m-drawer-top { display: flex; align-items: center; justify-content: space-between; }
.m-drawer-top .project-area { display: inline-flex; align-items: center; gap: 6px; }
.m-drawer-month { display: flex; align-items: center; gap: 4px; margin-left: -8px; }
.m-drawer-month .sheet-heading { margin: 0; }
.m-drawer-list { display: flex; flex-direction: column; gap: var(--s3); }
.sheet-side .sheet-actions { position: sticky; bottom: calc(-1 * var(--s5)); background: var(--paper); padding: var(--s3) 0 var(--s2); margin-top: auto; }
.m-stack-wrap { position: relative; margin: var(--s2) 0 var(--s4); padding-top: 2px; }

.m-stack-tip {
  position: absolute; bottom: calc(100% + 6px); transform: translateX(-50%); white-space: nowrap; pointer-events: none; z-index: 3;
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;

}

.m-stack-slice[data-dim] { opacity: .5; }

.m-stack-card { padding: 16px 18px 14px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); margin: var(--s2) 0 var(--s4); }

.m-stack-title { font-weight: 600; font-size: var(--text-base); }
.m-stack-sum { color: var(--ink-soft); font-size: var(--text-md); font-variant-numeric: tabular-nums; }

.m-stack-legend button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--ink-soft); padding: 2px 0; }
.m-stack-legend button:hover, .m-stack-legend button:focus-visible { color: var(--ink); }
.m-stack-legend button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }

.m-stack-tip .m-dot { background: var(--c); }

/* month bar: back to the pastel category colours */

.m-stack-key, .m-stack-tip .m-dot { background: var(--cb); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 25%, transparent); }
/* month bar sits straight on the page, no card */

.m-stack-top { justify-content: flex-end; margin-bottom: 8px; }
.m-stack-top { justify-content: space-between; }
.m-stack-title { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-weight: 600; font-size: var(--text-base); color: var(--ink); border-radius: 4px; }
.m-stack-title .icon, .m-stack-title svg { opacity: .55; transition: transform 120ms, opacity 120ms; }

/* buttons with a leading icon: icon and label on one centred line */

/* category icons */

.content { --gap-section: 48px; }

/* ---------- comfortable edges on every screen size ----------

:root { --gutter: 20px; }

@media (min-width: 900px) { :root { --gutter: 32px; } }
.content { padding-left: calc(var(--gutter) + env(safe-area-inset-left)); padding-right: calc(var(--gutter) + env(safe-area-inset-right)); }
.topbar { right: calc(var(--gutter) + env(safe-area-inset-right)); }

.rail { padding-left: var(--gutter); padding-right: var(--gutter); }

   out from the screen width (what's left after 12px side margins, the Add button, gaps and the
   dock's padding, split five ways), between 34px and 44px, so the circles stay round and centred. */
@media (max-width: 400px) {
  .rail { left: 0; gap: 6px; padding-left: 12px; padding-right: 12px; }
  .rail .dock { gap: 2px; padding: 5px; }
  .dock .tab { --tab: clamp(34px, calc((100vw - 24px - 54px - 6px - 10px - 8px) / 5), 44px); width: var(--tab); height: var(--tab); }

.sheet { padding-left: calc(24px + env(safe-area-inset-left)); padding-right: calc(24px + env(safe-area-inset-right)); }
@media (min-width: 700px) { .sheet { padding-left: 32px; padding-right: 32px; } }
/* app name on the welcome screen */
.setup-brand { margin: 0 0 calc(-1 * var(--s2)); font-family: var(--font-display); font-size: var(--text-3xl); line-height: 1; color: var(--ink); }
