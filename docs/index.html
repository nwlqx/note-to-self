/* Page header: the title shares one row with the tool buttons, inside the page column */
.content { position: relative; padding-top: 20px; --head-h: 46px; }
@media (min-width: 900px) { .content { padding-top: 28px; --head-h: 60px; } }
.topbar {
  position: absolute; top: 20px; right: var(--s4); left: auto; z-index: 6;
  height: var(--head-h); padding: 0; background: none; display: flex; align-items: center; gap: var(--s2);
}
@media (min-width: 900px) { .topbar { top: 28px; right: var(--s5); padding: 0; } }
.view-head, .greeting { padding-top: 0; padding-right: calc(var(--bar-w, 150px) + var(--s3)); }
.view-head { align-items: center; min-height: var(--head-h); flex-wrap: wrap; row-gap: var(--s3); }
.view-head h1 { line-height: 1; }
.greeting h1 { min-height: var(--head-h); align-items: center; }
.greeting-name { white-space: normal; }
.proj-header .back { min-height: var(--head-h); display: inline-flex; align-items: center; }
@media (max-width: 899px) { .greeting h1 { font-size: 2rem; } }

/* Highlighter under serif headings, colour coded by page (and by quadrant, area or project) */
.content { --hl: var(--rose); }
.content[data-page="todo"] { --hl: var(--pink); }
.content[data-page="projects"] { --hl: var(--lavender); }
.content[data-page="calendar"] { --hl: var(--snow); }
.content[data-page="timeline"] { --hl: var(--pistachio); }
.content[data-page="money"] { --hl: var(--yellow); }
.content[data-page="settings"] { --hl: var(--rose); }
.content[data-page="project"] .view.project { --hl: var(--cb); }
.area-block .area-head { --hl: var(--cb); }
.quad-cell[data-q="do"] { --hl: var(--pink); }
.quad-cell[data-q="schedule"] { --hl: var(--pistachio); }
.quad-cell[data-q="delegate"] { --hl: var(--yellow); }
.quad-cell[data-q="drop"] { --hl: var(--snow); }
.content { --hl-mix: 100%; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .content { --hl-mix: 34%; } }
:root[data-theme="dark"] .content { --hl-mix: 34%; }

.view-head h1, .greeting-name, .project-title-row h1, .cal-sub h2, .month-title, .area-head h2, .tray-head h2,
.quad-name, .todo-head h2, .day-title, .m-month-name, .m-h2, .panel h2, .gantt-area .gantt-label {
  --hl-c: color-mix(in srgb, var(--hl) var(--hl-mix), transparent);
  width: fit-content;
  background-image: linear-gradient(to bottom, transparent 52%, var(--hl-c) 52%, var(--hl-c) 92%, transparent 92%);
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
  padding-inline: 0.14em; margin-inline-start: -0.14em;
}
/* the highlight is for section headings only, not the big page titles */
.view-head h1, .greeting-name, .project-title-row h1 { background-image: none; padding-inline: 0; margin-inline-start: 0; }
/* headings with a dot or a count: highlight the words only */
.area-head h2, .tray-head h2 { background-image: none; padding-inline: 0; margin-inline-start: 0; }
.area-head .hl-text, .tray-head .hl-text {
  --hl-c: color-mix(in srgb, var(--hl) var(--hl-mix), transparent);
  background-image: linear-gradient(to bottom, transparent 52%, var(--hl-c) 52%, var(--hl-c) 92%, transparent 92%);
  -webkit-box-decoration-break: clone; box-decoration-break: clone; padding-inline: 0.14em;
}
/* the dot in an area heading uses the same pastel as its highlight */
.area-head .area-swatch { background: var(--cb); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent); }

/* ---------- project lists ---------- */
.proj-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s5); }
.proj-body .plists { order: -1; }
@media (min-width: 1100px) {
  .proj-body { grid-template-columns: minmax(0, 1fr) 20rem; gap: var(--s6); align-items: start; }
  .proj-body .plists { order: 0; }
}
.plists { display: flex; flex-direction: column; gap: var(--s2); min-width: 0; }
.plists-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
.plists-title { font-family: var(--font-display); font-weight: 400; font-size: 1.625rem; line-height: 1.1; }
.plists-title .hl-text {
  --hl-c: color-mix(in srgb, var(--cb) var(--hl-mix, 100%), transparent);
  background-image: linear-gradient(to bottom, transparent 52%, var(--hl-c) 52%, var(--hl-c) 92%, transparent 92%);
  padding-inline: 0.14em; margin-inline-start: -0.14em;
}
.plists-head .text-btn { display: inline-flex; align-items: center; gap: 4px; }
.plists-empty { margin: 0; font-size: 0.875rem; color: var(--ink-soft); }
.plist-new input { width: 100%; }
.plist { background: var(--surface); border-radius: var(--radius-lg); box-shadow: inset 0 0 0 1px var(--line); padding: 8px 10px 6px; }
.plist-head { position: relative; display: flex; align-items: center; gap: 4px; }
.plist-toggle { width: 28px; height: 28px; display: grid; place-items: center; color: var(--ink-soft); border-radius: var(--radius-sm); flex: none; }
.plist-toggle:hover { background: var(--surface-sunken); color: var(--ink); }
.plist-name { flex: 1; min-width: 0; text-align: left; font-weight: 600; font-size: 0.9375rem; color: inherit; padding: 4px 2px; overflow-wrap: anywhere; }
.plist-name-input { flex: 1; min-width: 0; min-height: 32px; height: 32px; padding: 2px 8px; font-weight: 600; }
.plist-count { font-size: 0.8125rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.plist-more { width: 30px; height: 30px; min-height: 30px; color: var(--ink-soft); }
.plist-bar { display: block; height: 4px; margin: 4px 4px 6px; border-radius: 2px; background: var(--surface-sunken); overflow: hidden; }
.plist-bar span { display: block; height: 100%; background: var(--c, var(--ink)); border-radius: 2px; }
.plist[data-collapsed] .plist-bar { margin-bottom: 2px; }
.plist-items { display: flex; flex-direction: column; min-height: 6px; }
.plist-items > li:not(.drop-line) {
  display: grid; grid-template-columns: 14px 26px minmax(0, 1fr) auto; align-items: center; gap: 4px;
  padding: 1px 0; border-radius: var(--radius-sm); touch-action: pan-y; user-select: none; -webkit-user-select: none;
}
.plist-items > li:hover { background: var(--surface-sunken); }
.plist-grip { color: var(--ink-faint); opacity: 0; cursor: grab; display: grid; place-items: center; }
.plist-items > li:hover .plist-grip { opacity: 1; }
@media (hover: none) { .plist-grip { opacity: .6; } }
.plist-items .check { width: 22px; height: 22px; min-height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line-strong); display: grid; place-items: center; color: var(--ink-fixed); background: transparent; }
.plist-items .check[aria-pressed="true"] { background: var(--cb, var(--pistachio)); box-shadow: inset 0 0 0 1.5px var(--c); }
.plist-text { border: 0; background: transparent; min-height: 34px; padding: 4px 6px; font-size: 0.9375rem; min-width: 0; width: 100%; user-select: text; -webkit-user-select: text; }
.plist-text:focus { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong); outline: none; }
.plist-items li[data-done] .plist-text { color: var(--ink-faint); text-decoration: line-through; }
.plist-actions { display: inline-flex; opacity: 0; }
.plist-items > li:hover .plist-actions, .plist-items > li:focus-within .plist-actions { opacity: 1; }
@media (hover: none) { .plist-actions { opacity: 1; } .plist-actions .icon-btn:first-child { display: inline-grid; } }
.plist-actions .icon-btn { width: 30px; height: 30px; min-height: 30px; color: var(--ink-soft); }
.plist-actions .icon-btn:hover { color: var(--ink); }
.plist-add { margin-top: 2px; }
.plist-add input { min-height: 36px; }
.plist .drop-line { border: 1.5px dashed var(--line-strong); border-radius: var(--radius-sm); background: transparent; list-style: none; }

/* done things: greyed out and struck through, everywhere */
.mk-done, .mk-done .mk-done-text { color: var(--ink-faint); }
.mk-done-text { text-decoration: line-through; }
.entry[data-done] .entry-title, .card-tile[data-done] .card-title, .todo-row[data-done] .todo-title,
li[data-done] .cell-title, .all-day li[data-done] .all-day-body, .m-row[data-done] .m-row-title {
  color: var(--ink-faint); text-decoration: line-through; text-decoration-color: currentColor; font-weight: 400;
}
.card-tile[data-done] .card-meta, .entry[data-done] .entry-meta { opacity: .7; }
.mark-key .mk-done span { color: var(--ink-faint); } .mk-done-text { font-weight: 400; }

/* matrix and tray rows: a tick box, then the kind mark, then the title */
.todo-row, .quad .todo-row, .quad-focus .quad .todo-row { grid-template-columns: 30px 16px minmax(0, 1fr) auto; }
.todo-row .mark, .quad .todo-row .mark { width: 16px; height: 36px; }
.todo-check {
  align-self: start; margin-top: 7px; width: 22px; height: 22px; min-height: 22px; border-radius: 50%;
  display: grid; place-items: center; background: transparent; color: var(--ink-fixed);
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, currentColor 45%, transparent); cursor: pointer;
}
.quad .todo-check { color: inherit; }
.todo-check:hover { box-shadow: inset 0 0 0 1.5px currentColor; }
.todo-check[aria-pressed="true"] { background: var(--ink-fixed); color: var(--cream); box-shadow: none; }
.tray .todo-check[aria-pressed="true"] { background: var(--ink); color: var(--canvas); }
.todo-row[data-done] { cursor: default; }
.todo-row[data-done] .mark, .todo-row[data-done] .card-meta { opacity: .5; }
.quad .todo-row[data-done] .todo-title { color: inherit; opacity: .55; }
@media (max-width: 899px) { .quad .todo-row { grid-template-columns: 28px 14px minmax(0, 1fr) auto; } .quad .todo-row .mark { width: 14px; } }
/* tick box on the right */
.todo-row, .quad .todo-row, .quad-focus .quad .todo-row { grid-template-columns: 24px minmax(0, 1fr) auto auto; padding-right: 8px; }
.todo-row .mark, .quad .todo-row .mark { width: 24px; }
.todo-check { margin: 9px 0 0 8px; }
@media (max-width: 899px) { .quad .todo-row { grid-template-columns: 20px minmax(0, 1fr) auto auto; padding-right: 4px; } .quad .todo-row .mark { width: 20px; } .todo-check { margin-left: 4px; } }
/* every task title in the matrix, To sort and Due today is bold, not just deadlines */
.todo-title, .todo-title[data-kind], .due-title { font-weight: 600; }
.todo-row[data-done] .todo-title { font-weight: 600; }


/* matrix: no task/deadline marks; a due date shows with the flower */
.todo-row, .quad .todo-row, .quad-focus .quad .todo-row { grid-template-columns: minmax(0, 1fr) auto auto; padding-left: 10px; }
@media (max-width: 899px) { .quad .todo-row { grid-template-columns: minmax(0, 1fr) auto auto; padding-left: 6px; } }
.todo-row .todo-body { padding-left: 0; }
.due-chip { display: inline-flex; align-items: baseline; gap: 3px; }
.due-flower { font-weight: 700; font-size: 1.05em; line-height: 0; transform: translateY(0.12em); }
.due-flower { font-size: 1.5em; transform: translateY(0.3em); margin-right: 1px; } .due-chip { gap: 2px; }
/* no flower anywhere: dated tasks use the same dot as other tasks */
.glyph-deadline { font-size: inherit; transform: none; }
.card-tile[data-kind="deadline"] .card-mark, .strip-item[data-kind="deadline"] .strip-mark, .due-list li[data-kind="deadline"] .due-mark { font-size: inherit; line-height: inherit; transform: none; }
/* bills in Due today: the $ sits in a little coin, the cost on its own line */
.due-list li[data-bill] { grid-template-columns: 24px 1fr; align-items: start; }
.due-list li[data-bill] .due-mark {
  width: 22px; height: 22px; margin-top: 1px; border-radius: 50%; display: grid; place-items: center;
  background: var(--sand-soft, var(--yellow-soft)); color: var(--sand-ink, var(--yellow-ink)); font-size: 0.8125rem; font-weight: 700; line-height: 1;
}
.due-cost { font-size: 0.8125rem; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; margin-top: 1px; }
.due-cost-tag { font-weight: 400; color: var(--ink-soft); }
.tile-due-all .due-list li:not(.cal-more) { grid-template-columns: 24px 1fr; } .tile-due-all .due-mark { text-align: center; justify-self: center; }

/* ---------- Meals ---------- */
.content[data-page="meals"] { --hl: var(--peach); }
.ml-summary { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 0 0 var(--s4); font-size: 0.9375rem; color: var(--ink-soft); }
.ml-summary strong { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.ml-summary .m-over strong, .ml-summary .m-over { color: var(--danger); }
.ml-week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-bottom: var(--s6); }
.ml-day { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ml-day-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 2px; }
.ml-dow { font-size: 0.8125rem; color: var(--ink-soft); }
.ml-dnum { font-family: var(--font-display); font-size: 1.75rem; line-height: 1; }
.ml-day[data-today] .ml-dnum { background: var(--peach); color: var(--on-peach); border-radius: 50%; width: 1.6em; height: 1.6em; display: inline-grid; place-items: center; font-size: 1.25rem; }
.ml-slot {
  display: flex; flex-direction: column; gap: 2px; min-height: 84px; padding: 9px 10px; text-align: left; color: var(--ink);
  border-radius: var(--radius-md); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); min-width: 0;
}
.ml-slot:hover { box-shadow: inset 0 0 0 1px var(--line-strong); }
.ml-slot[data-slot="breakfast"]:not([data-empty]) { background: var(--yellow-soft); }
.ml-slot[data-slot="lunch"]:not([data-empty]) { background: var(--pistachio-soft); }
.ml-slot[data-slot="dinner"]:not([data-empty]) { background: var(--peach-soft); }
.ml-slot[data-empty] { background: transparent; box-shadow: inset 0 0 0 1px var(--line); border: 0; }
.ml-slot-label { font-size: 0.6875rem; letter-spacing: 0.02em; color: var(--ink-soft); font-weight: 600; }
.ml-meal { font-size: 0.875rem; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.ml-cost { font-size: 0.75rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; margin-top: auto; }
.ml-add { display: inline-flex; align-items: center; gap: 3px; font-size: 0.8125rem; color: var(--ink-faint); margin-top: auto; }
.ml-slot[data-empty]:hover .ml-add { color: var(--ink); }
@media (max-width: 899px) {
  .ml-week { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .ml-day { display: grid; grid-template-columns: 44px repeat(3, minmax(0, 1fr)); gap: 6px; align-items: stretch; padding: 4px 0; border-top: 1px solid var(--line); }
  .ml-day-head { flex-direction: column; align-items: flex-start; justify-content: center; padding: 0; }

}
.ml-cols { display: grid; gap: var(--s6); grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .ml-cols { grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: var(--s7); } }
.ml-groc-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); margin-bottom: var(--s2); }
.ml-note { margin: 0 0 var(--s2); font-size: 0.875rem; color: var(--ink-soft); }
.ml-groc { display: flex; flex-direction: column; }
.ml-groc li { display: grid; grid-template-columns: 30px minmax(0, 1fr) 34px; align-items: center; gap: 4px; padding: 3px 0; border-top: 1px solid var(--line); }
.ml-groc li:first-child { border-top: 0; }
.ml-groc .check { width: 22px; height: 22px; min-height: 22px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px var(--line-strong); background: transparent; color: var(--ink-fixed); }
.ml-groc .check[aria-pressed="true"] { background: var(--pistachio); box-shadow: none; }
.ml-groc-text { display: flex; flex-direction: column; min-width: 0; padding: 4px 0; }
.ml-groc-name { font-size: 0.9375rem; }
.ml-qty { color: var(--ink-soft); font-size: 0.875rem; }
.ml-groc li[data-done] .ml-groc-name { color: var(--ink-faint); text-decoration: line-through; }
.ml-groc .icon-btn { width: 32px; height: 32px; min-height: 32px; color: var(--ink-soft); opacity: .6; }
.ml-groc li:hover .icon-btn { opacity: 1; }
.ml-bought-head { display: flex; justify-content: space-between; align-items: center; margin-top: var(--s4); }
.ml-recipes { display: flex; flex-direction: column; gap: 4px; }
.ml-recipe { width: 100%; display: flex; flex-direction: column; gap: 2px; text-align: left; color: inherit; padding: 10px 12px; border-radius: var(--radius-md); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.ml-recipe:hover { box-shadow: inset 0 0 0 1px var(--line-strong); }
.ml-recipe-name { font-weight: 600; font-size: 0.9375rem; }
.ml-pick { flex-wrap: wrap; }
.ml-pick .chip[aria-checked="true"] { background: var(--peach); color: var(--on-peach); }
.ml-ings { display: flex; flex-direction: column; gap: 6px; }
.ml-ings li { display: grid; grid-template-columns: minmax(0, 1fr) 7.5rem 34px; gap: 6px; align-items: center; }
@media (min-width: 900px) { .ml-day-head { height: 34px; align-items: center; } }
.ml-day[data-today] .ml-dnum { width: 1.5em; height: 1.5em; font-size: 1.25rem; }

/* ---------- matrix: project on each task, and a project filter ---------- */
.card-meta .todo-proj { gap: 4px; min-width: 0; }

.proj-filter { position: relative; display: inline-flex; align-items: center; align-self: center; gap: 2px; }
.proj-filter-btn {
  display: inline-flex; align-items: center; gap: 5px; min-height: 32px; padding: 0 10px;
  border-radius: 999px; font-size: 0.875rem; color: var(--ink-soft); background: transparent;
  box-shadow: inset 0 0 0 1px var(--line); max-width: 14rem;
}
.proj-filter-btn > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj-filter-btn:hover, .proj-filter-btn[aria-expanded="true"] { color: var(--ink); background: var(--surface-sunken); }
.proj-filter-btn.on { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--ink); }
.proj-filter-clear { width: 28px; height: 28px; min-height: 28px; color: var(--ink-muted); }
.proj-filter-menu { max-height: 60vh; overflow-y: auto; }
.proj-filter-menu button { display: flex; align-items: center; gap: 8px; text-align: left; padding: 8px 10px; border-radius: var(--radius-sm); }
.proj-filter-menu button:hover { background: var(--surface-sunken); }
.proj-filter-menu button[aria-checked="true"] { font-weight: 600; }
.proj-filter-menu button[aria-checked="true"]::after { content: '✓'; margin-left: auto; padding-left: 12px; }
@media (max-width: 560px) {
  .todo-head { flex-wrap: wrap; }
  .proj-filter-btn { max-width: 10rem; }
}
.card-meta .todo-proj { max-width: 100%; overflow: hidden; }
.card-meta .todo-proj > span:last-child { display: block; min-width: 0; }
.todo-proj-icon { display: inline-flex; vertical-align: -2px; margin-right: 6px; opacity: .8; }
.todo-proj-icon .project-icon { display: inline-flex; }
/* bill $ without the coin behind it */
.due-list li[data-bill] .due-mark { background: none; width: auto; height: auto; margin-top: 0; display: block; color: inherit; font-size: inherit; line-height: 1.35; }

/* ---------- to buy (Budgeting page) ---------- */
.to-buy { margin-top: var(--s6, 2.5rem); }
.to-buy .m-section-head { display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap; }
.to-buy .m-section-head .todo-summary { margin-right: auto; }
.to-buy .buy-price { font-style: normal; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.to-buy [data-done] .buy-price { color: inherit; font-weight: 400; }
.to-buy .buy-log { flex: none; align-self: center; margin-right: 4px; }
.to-buy .buy-hint { margin-top: var(--s3); }
.buy-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.buy-picker button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 10px 12px; border-radius: var(--radius-md, 12px); text-align: center; min-height: 0; } /* both lines centred in the pill */
.buy-picker button strong { font-weight: 600; font-size: 0.9375rem; }
.buy-picker button small { font-size: 0.8125rem; opacity: .85; }
.buy-picker button[aria-checked="true"] { box-shadow: inset 0 0 0 2px currentColor; }
.buy-open { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; }
.todo-head h2 { background-image: none; padding-inline: 0; margin-inline-start: 0; }
.tray-head .hl-text { background-image: none; padding-inline: 0; }
.to-buy .m-section-head .m-h2 { background-image: none; padding-inline: 0; margin-inline-start: 0; }
.to-buy .m-section-head > .text-btn { margin-left: auto; }
.to-buy .quad { display: flex; flex-direction: column; }
.buy-foot { margin-top: auto; display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.buy-foot .inline-add, .buy-foot .inline-add-form { flex: 1 1 auto; }
.buy-total { margin-left: auto; padding: 6px 4px 2px; font-size: 0.8125rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.buy-total strong { color: var(--ink); font-weight: 600; }
#m-budgets { background-image: none; padding-inline: 0; margin-inline-start: 0; }
.to-buy { margin-top: 0; margin-bottom: calc(var(--s6) + var(--s3)); }

/* ---------- Budgeting: spending as tiles, details in a side drawer ---------- */
.m-spend { margin-bottom: calc(var(--s6) + var(--s3)); }
.m-spend .m-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); }
.m-spend .m-h2 { background-image: none; padding-inline: 0; margin-inline-start: 0; }
.m-stack { display: flex; height: 10px; border-radius: 999px; overflow: hidden; gap: 2px; margin: var(--s2) 0 var(--s4); }
.m-stack > span { background: var(--cb); min-width: 4px; }
.m-tiles { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 700px) { .m-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1000px) { .m-tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.m-tile {
  width: 100%; height: 100%; display: flex; flex-direction: column; align-items: stretch; gap: 6px; text-align: left;
  padding: 12px 14px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);
  min-height: 0; color: var(--ink);
}
.m-tile:hover { box-shadow: inset 0 0 0 1px var(--rule-strong); background: color-mix(in srgb, var(--cs) 45%, var(--surface)); }
.m-tile-name { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 0.9375rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

.m-tile-num { font-variant-numeric: tabular-nums; font-size: 1.0625rem; font-weight: 600; }

.m-tile .m-bar { margin: 0; }
.m-tile-left, .m-tile-count { font-size: 0.8125rem; color: var(--ink-soft); }
.m-tile-left.m-over { color: var(--danger); font-weight: 600; }

/* side drawer: a bottom sheet on phones, a panel from the right on bigger screens */
@media (min-width: 700px) {
  .scrim-side { align-items: stretch; justify-content: flex-end; }
  .sheet.sheet-side {
    max-width: 28rem; width: 100%; max-height: none; height: 100%; border-radius: 0;
    padding-top: var(--s4); box-shadow: -1px 0 0 var(--rule-strong), -20px 0 50px -24px rgba(20, 30, 40, .35);
    animation: slide-in 240ms cubic-bezier(.2,.7,.2,1);
  }
}
@keyframes slide-in { from { transform: translateX(24px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .sheet.sheet-side { animation: none; } }
.m-drawer-head { display: flex; flex-direction: column; gap: 6px; }
.m-drawer-top { display: flex; align-items: center; justify-content: space-between; }
.m-drawer-top .project-area { display: inline-flex; align-items: center; gap: 6px; }
.m-drawer-month { display: flex; align-items: center; gap: 4px; margin-left: -8px; }
.m-drawer-month .sheet-heading { margin: 0; }
.m-drawer-list { display: flex; flex-direction: column; gap: var(--s3); }
.sheet-side .sheet-actions { position: sticky; bottom: calc(-1 * var(--s5)); background: var(--paper); padding: var(--s3) 0 var(--s2); margin-top: auto; }
.m-stack-wrap { position: relative; margin: var(--s2) 0 var(--s4); padding-top: 2px; }
.m-stack-wrap .m-stack { margin: 0; height: 12px; }
.m-stack-slice { all: unset; cursor: pointer; background: var(--cb); min-width: 4px; height: 100%; transition: opacity 120ms, transform 120ms; }
.m-stack-slice:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.m-stack-slice[data-dim] { opacity: .35; }
.m-stack-tip {
  position: absolute; bottom: calc(100% + 6px); transform: translateX(-50%); white-space: nowrap; pointer-events: none; z-index: 3;
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
  background: var(--surface); box-shadow: var(--shadow-sheet), inset 0 0 0 1px var(--line); font-size: 0.8125rem; color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.m-stack-tip strong { font-weight: 600; }
.m-stack-pct { color: var(--ink-soft); }
.m-stack-tip .m-dot { background: var(--cb); }
.m-stack-tip { bottom: auto; top: calc(100% + 6px); }
.m-stack-slice[data-dim] { opacity: .5; }
/* month bar, styled after the macOS storage bar */
.m-stack-card { padding: 16px 18px 14px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); margin: var(--s2) 0 var(--s4); }
.m-stack-top { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; margin-bottom: 10px; }
.m-stack-title { font-weight: 600; font-size: 1rem; }
.m-stack-sum { color: var(--ink-soft); font-size: 0.9375rem; font-variant-numeric: tabular-nums; }
.m-stack-card .m-stack-wrap { margin: 0; padding: 0; }
.m-stack-card .m-stack { height: 26px; border-radius: 7px; gap: 0; background: var(--surface-sunken); }
.m-stack-card .m-stack-slice { background: var(--c); box-shadow: inset -1px 0 0 var(--surface); min-width: 3px; }
.m-stack-left { display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden; background: var(--surface-sunken); box-shadow: inset 1px 0 0 var(--rule-strong); }
.m-stack-left span { font-size: 0.8125rem; font-weight: 600; color: var(--ink-soft); white-space: nowrap; padding: 0 8px; font-variant-numeric: tabular-nums; }
.m-stack-legend { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.m-stack-legend button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 0.8125rem; color: var(--ink-soft); padding: 2px 0; }
.m-stack-legend button:hover, .m-stack-legend button:focus-visible { color: var(--ink); }
.m-stack-legend button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
.m-stack-legend li[data-dim] { opacity: .5; }
.m-stack-key { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.m-stack-tip .m-dot { background: var(--c); }
.m-tiles-label { margin: var(--s4) 0 var(--s2); font-size: 0.8125rem; font-weight: 600; color: var(--ink-soft); letter-spacing: .02em; }
/* month bar: back to the pastel category colours */
.m-stack-card .m-stack-slice { background: var(--cb); box-shadow: inset -2px 0 0 var(--surface); }
.m-stack-key, .m-stack-tip .m-dot { background: var(--cb); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 25%, transparent); }
/* month bar sits straight on the page, no card */
.m-stack-card { padding: 0; background: none; box-shadow: none; border-radius: 0; }
.m-stack-top { justify-content: flex-end; margin-bottom: 8px; }
.m-stack-top { justify-content: space-between; }
.m-stack-title { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-weight: 600; font-size: 1rem; color: var(--ink); border-radius: 4px; }
.m-stack-title .icon, .m-stack-title svg { opacity: .55; transition: transform 120ms, opacity 120ms; }
.m-stack-title:hover { text-decoration: underline; text-underline-offset: 3px; }
.m-stack-title:hover svg { opacity: 1; transform: translate(1px, -1px); }
.m-stack-title:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
/* buttons with a leading icon: icon and label on one centred line */
.primary:has(> svg), .secondary:has(> svg) { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.sheet-side .sheet-actions { align-items: center; }
.sheet-side .sheet-actions { border-top: 1px solid var(--rule); }
/* category icons */
.m-cat-edit li { grid-template-columns: 28px 32px minmax(0, 1fr) 9rem 36px; }
.m-icon-btn { width: 32px; height: 32px; min-height: 32px; padding: 0; display: grid; place-items: center; border-radius: 9px; background: var(--cs); color: var(--c); box-shadow: inset 0 0 0 1px var(--line); }
.m-icon-btn[aria-expanded="true"] { box-shadow: inset 0 0 0 2px var(--c); }
.m-icon-none { color: var(--ink-faint); }
.m-icon-grid { grid-column: 1 / -1; margin: 4px 0 8px; color: var(--c); }
.m-cat-icon { display: inline-flex; flex: none; color: var(--c); }
.m-tile-name .m-cat-icon { width: 22px; height: 22px; border-radius: 7px; background: var(--cs); align-items: center; justify-content: center; }
@media (max-width: 560px) { .m-cat-edit li { grid-template-columns: 28px 32px minmax(0, 1fr) 6.5rem 32px; } }
/* spending tiles: bars in the category's own pastel; only a busted budget turns red */
.m-tile .m-bar, .m-drawer-head .m-bar { height: 7px; border-radius: 4px; }
.m-tile .m-bar > span, .m-drawer-head .m-bar > span { background: var(--cb); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 14%, transparent); border-radius: 4px; }
.m-tile .m-bar[data-over] > span, .m-drawer-head .m-bar[data-over] > span { background: var(--danger); box-shadow: none; }
/* the greeting is the largest text in the app */
.greeting h1 { font-size: 3rem; line-height: 1.02; }
@media (min-width: 900px) { .greeting h1 { font-size: 4.5rem; } }
@media (max-width: 899px) { .m-big:not(.small) { font-size: 2.75rem; } }
.todo-head .proj-filter { margin-left: auto; }
/* the Today and Due cards line up with the Do and Schedule quadrants below */
@media (min-width: 640px) { .bento { max-width: none; column-gap: 10px; } }
@media (min-width: 1200px) { .bento { max-width: calc(100% - 20rem - var(--s6)); } }

/* ---------- spacing rhythm ----------
   page title -> content: 32px; greeting -> cards: 40px;
   between major sections: 48px (40px on phones); section heading -> its content: 16px */
.content { --gap-section: 48px; }
@media (max-width: 699px) { .content { --gap-section: 40px; } }
.view-head { padding-bottom: var(--s6); }
.greeting { padding-bottom: 40px; }
.greeting-date { margin-top: var(--s3); }
/* To-do */
.todo > .bento { margin-bottom: 0; }
.todo-head { margin-top: var(--gap-section); margin-bottom: var(--s4); }
/* Projects */
.due-strip-wrap { margin-bottom: 0; }
.due-strip-wrap + .filters { margin-top: var(--gap-section); }
/* Meals */
.ml-week { margin-bottom: 0; }
.ml-cols { margin-top: var(--gap-section); }
/* Budgeting */
.m-top { margin-bottom: 0; }
.to-buy, .m-spend { margin-top: var(--gap-section); margin-bottom: 0; }
.to-buy .m-section-head, .m-spend .m-section-head, .m-spend > .m-h2 { margin-bottom: var(--s4); }
/* Calendar */
.day-title { margin-top: var(--s6); }
.area-block .quiet-head { margin-top: var(--s5); margin-bottom: var(--s3); }
.area-block + .area-block { margin-top: var(--s4); }
/* project cards: the icon sits centred on the first line of the name, at a size that matches it */
.project-name { display: flex; align-items: flex-start; gap: 10px; }
.project-name .project-icon { flex: none; margin: 0; width: 1.05em; height: 1.05em; }

.project-name-text { min-width: 0; }
.project-name .project-icon { width: auto; place-items: center start; }
.add-inline { display: inline-flex; align-items: center; gap: 4px; }
/* more breathing room above the page title (and the buttons that share its row) */
.content { padding-top: calc(env(safe-area-inset-top) + 40px); }
.topbar { top: calc(env(safe-area-inset-top) + 40px); padding-top: 0; }
@media (min-width: 900px) {
  .content { padding-top: 64px; }
  .topbar { top: 64px; }
}
.strip-item { grid-template-columns: minmax(0, 1fr); padding-left: 8px; }
/* project icon before a task name: one small, even gap */
.todo-proj-icon .project-icon { margin-right: 0; }
.todo-proj-icon { margin-right: 5px; }
.strip-title .todo-proj-icon { margin-right: 4px; vertical-align: -1px; }

/* ---------- comfortable edges on every screen size ----------
   page gutter: 20px on small phones, 24px on large phones and tablets, 32px on laptops */
:root { --gutter: 20px; }
@media (min-width: 480px) { :root { --gutter: 24px; } }

:root { --violet: #C6B1EC; --violet-soft: #EEE7FA; --violet-ink: #5B3A9A; --on-violet: var(--ink-fixed); }

:root[data-theme="dark"] { --violet: #B9A4E0; --violet-soft: #30283F; --violet-ink: #D4C4F3; }
:root[data-palette="2"] { --violet: #BFB4D6; --violet-soft: #ECE8F3; --violet-ink: #554874; }
@media (prefers-color-scheme: dark) { :root[data-palette="2"]:not([data-theme="light"]) { --violet: #B2A7C9; --violet-soft: #312D3B; --violet-ink: #D3CBE6; } }
:root[data-palette="2"][data-theme="dark"] { --violet: #B2A7C9; --violet-soft: #312D3B; --violet-ink: #D3CBE6; }

/* ---------- greeting: wraps like normal text, the name stays whole ----------
   Only the first line steps around the buttons; "afternoon, Natasha" can share a line. */
.greeting h1 { display: block; padding-right: 0; min-height: 0; }
.greeting-spacer { float: right; width: calc(var(--bar-w, 150px) + var(--s3)); height: var(--head-h); }
.greeting-hello, .greeting-name { display: inline; }
.greeting-name { white-space: nowrap; }
@media (max-width: 899px) {
  .greeting h1 { font-size: clamp(2rem, 9vw, 3rem); line-height: 1.04; }
  /* keep the greeting the largest text on phones */
  .view-head h1 { font-size: 2rem; }
  .m-big:not(.small) { font-size: 2rem; }
}

/* ---------- sync status: smaller and quieter ---------- */
.sync { font-size: 0.75rem; color: var(--ink-faint); opacity: .8; font-style: normal; }
@media (max-width: 899px) {
  /* on phones it sits under the round buttons instead of beside them */
  .topbar .sync { position: absolute; top: calc(100% + 4px); right: 4px; font-size: 0.6875rem; white-space: nowrap; }
}
.m-tile-name .project-icon { width: 22px; height: 22px; border-radius: 7px; background: var(--cs); color: var(--c); align-items: center; justify-content: center; }

/* ---------- Mobile matrix: every card gets its own "Add a task"; one left edge for everything ---------- */
@media (max-width: 899px) {
  /* headings start where the task text inside the card starts */
  .matrix .quad-cell .quad-head { padding: 0 0 0 16px; }
  /* "+ Add a task" and "1 more" line up with the task titles; the plus glyph's own inset is taken out */
  .matrix .quad .inline-add { padding-left: 3px; }
  .matrix .quad .text-btn.small { padding-left: 6px; }
  .matrix .quad .inline-add-form { padding-left: 6px; padding-right: 4px; }
  .matrix .quad .inline-add-form input { min-width: 0; width: 100%; }
  /* the tick circle sits centred on the first line of the title */
  /* smaller tick circle, centred on the first line of the title: body padding + half the leftover line height */
  .matrix .quad .todo-check, .quad-focus .quad .todo-check {
    width: 18px; height: 18px; min-height: 18px;
    margin-top: calc(8px + (var(--q-title-fs, 0.875rem) * 1.35 - 18px) / 2);
  }
  .matrix .quad .todo-check svg { width: 12px; height: 12px; }
  .matrix .quad .todo-title { font-size: var(--q-title-fs, 0.875rem); line-height: 1.35; }
  .matrix .quad .todo-body { padding-top: 8px; }
  /* To sort: the add button lines up with the heading */
  .tray > .inline-add { padding-left: 3px; }
  .tray-empty { padding-left: 6px; }
}

/* ---------- Day timeline: tap an empty spot to add a one-hour event ---------- */
.schedule[title] { cursor: pointer; }
.schedule .slot { cursor: pointer; }
.slot.slot-draft {
  background: color-mix(in srgb, var(--pink) 55%, transparent); color: var(--ink);
  box-shadow: inset 0 0 0 1.5px var(--pink-ink); pointer-events: none; z-index: 1;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .slot.slot-draft { color: var(--ink-fixed); background: var(--pink); } }
:root[data-theme="dark"] .slot.slot-draft { color: var(--ink-fixed); background: var(--pink); }
.field-grid.field-grid-two { grid-template-columns: repeat(2, minmax(0, 1fr)); }

/* ---------- preview only: Empty / Filled switch, pinned top centre ---------- */
.preview-toggle {
  position: fixed; z-index: 60; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  display: inline-grid; grid-template-columns: auto auto; box-shadow: 0 6px 18px -10px rgba(0, 0, 0, .35);
}
.preview-toggle button { min-height: 30px; padding: 0 14px; font-size: 0.8125rem; }
@media (max-width: 899px) { .shell:has(> .preview-toggle) .content { padding-top: calc(env(safe-area-inset-top) + 72px); } }

/* Due today's label sits on the same line as "Friday" in the Today tile, not centred in its header */
.due-head { align-items: flex-start; }
.due-head .tile-label { line-height: 1.2; padding-top: 4px; }
@media (max-width: 480px) { .due-head .tile-label { padding-top: 2px; } }

/* ---------- Day strip (Calendar) styled like the Projects two-week strip ----------
   Label on the left, serif number on the right, weekends on the sunken grey.
   The chosen day (Calendar) and today (Projects) get a pink highlighter stroke on the number only. */
.day-strip { gap: 8px; }
.day-pick, .day-pick[aria-checked="true"], .day-pick[data-today], .day-pick[aria-checked="true"][data-today] {
  display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr; align-items: start; gap: 6px 4px;
  min-height: 84px; padding: 12px 12px 10px; text-align: left;
  background: var(--surface); color: var(--ink); box-shadow: none; border-radius: var(--radius-xl);
}
.day-pick[data-weekend] { background: var(--surface-sunken); }
.day-pick .day-pick-dow, .day-pick[aria-checked="true"] .day-pick-dow { align-self: center; font-size: 0.875rem; font-weight: 400; color: var(--ink-muted); }
.day-pick[data-today] .day-pick-dow { color: var(--ink); font-weight: 600; }
.day-pick .dp-short { display: none; }
.day-pick .day-pick-num, .day-pick[data-today] .day-pick-num, .day-pick[aria-checked="true"] .day-pick-num, .day-pick[aria-checked="true"][data-today] .day-pick-num {
  width: auto; height: auto; display: inline-block; border-radius: 0; background: none; padding: 0;
  font-family: var(--font-display, "Instrument Serif", Georgia, serif); font-weight: 400; font-size: 1.75rem; line-height: 1; color: var(--ink);
}
.day-pick .day-pick-dots, .day-pick[aria-checked="true"] .day-pick-dots { grid-column: 1 / -1; align-self: end; text-align: left; color: var(--ink-muted); }
.day-pick[aria-checked="true"] .day-pick-num, .day-pick[aria-checked="true"][data-today] .day-pick-num,
.strip-day[data-today] .strip-num {
  padding-inline: 0.12em; margin-inline-end: -0.12em;
  background: linear-gradient(to bottom, transparent 50%, color-mix(in srgb, var(--pink) var(--hl-mix, 100%), transparent) 50%, color-mix(in srgb, var(--pink) var(--hl-mix, 100%), transparent) 90%, transparent 90%);
}
/* Projects strip: today is an ordinary tile now, only its number is highlighted */
.strip-day[data-today] { background: var(--surface); color: inherit; }
.strip-day[data-today][data-weekend] { background: var(--surface-sunken); }
.strip-day[data-today] .strip-dow { color: var(--ink); font-weight: 600; }
.strip-day[data-today] .strip-num { color: var(--ink); }
.strip-day[data-today] .strip-item { background: var(--cs); }
/* phones: seven narrow tiles, so the letter sits above the number */
@media (max-width: 640px) {
  .day-strip { gap: 4px; }
  .day-pick, .day-pick[aria-checked="true"], .day-pick[data-today], .day-pick[aria-checked="true"][data-today] {
    grid-template-columns: 1fr; justify-items: center; text-align: center; min-height: 0; padding: 8px 2px 6px; gap: 4px; border-radius: var(--radius-md);
  }
  .day-pick .dp-long { display: none; }
  .day-pick .dp-short { display: inline; }
  .day-pick .day-pick-num, .day-pick[aria-checked="true"] .day-pick-num { font-size: 1.5rem; }
  .day-pick .day-pick-dots, .day-pick[aria-checked="true"] .day-pick-dots { text-align: center; }
}
/* Month view: today's number gets the pink highlighter stroke, not a circle */
.month-cell[data-today] .cell-num {
  width: auto; min-width: 0; border-radius: 0; color: var(--ink); font-weight: 600; padding-inline: 0.18em;
  background: linear-gradient(to bottom, transparent 48%, color-mix(in srgb, var(--pink) var(--hl-mix, 100%), transparent) 48%, color-mix(in srgb, var(--pink) var(--hl-mix, 100%), transparent) 82%, transparent 82%);
}
/* Week view: today's number keeps the ink colour and gets the pink highlighter stroke, like the other date views */
.day[data-today] .day-num {
  color: var(--ink); width: fit-content; padding-inline: 0.1em; margin-inline-start: -0.1em; background-color: transparent;
  background-image: linear-gradient(to bottom, transparent 50%, color-mix(in srgb, var(--pink) var(--hl-mix, 100%), transparent) 50%, color-mix(in srgb, var(--pink) var(--hl-mix, 100%), transparent) 88%, transparent 88%);
}
.day[data-today] .day-name { color: var(--ink); font-weight: 600; }
/* Dates are never bold: the pink highlighter is the only "today" / "selected" marker on a date number */
.strip-day[data-today] .strip-num, .strip-num,
.month-cell[data-today] .cell-num, .cell-num,
.day-pick .day-pick-num, .day-pick[data-today] .day-pick-num, .day-pick[aria-checked="true"] .day-pick-num, .day-pick[aria-checked="true"][data-today] .day-pick-num,
.day[data-today] .day-num, .day-num,
.ml-day[data-today] .ml-dnum, .ml-dnum,
.cal-num { font-weight: 400; }
/* Projects: a small label above the two-week strip, same style as the "Projects" / "Unbudgeted" labels on Budgeting */
.due-strip-wrap .strip-label {
  margin: 0 0 var(--s2); padding: 0; background: none; font-family: var(--font-sans); font-size: 0.8125rem; font-weight: 600;
  line-height: 1.3; letter-spacing: .02em; color: var(--ink-soft);
}
/* keyboard hints only where there's a keyboard and a mouse */
@media (hover: none), (pointer: coarse) { .key-hint { display: none; } }
/* Meals: today's date uses the same pink highlighter as every other date */
.ml-day[data-today] .ml-dnum { --hl-c: color-mix(in srgb, var(--pink) var(--hl-mix, 100%), transparent); }

/* ---------- polish pass ---------- */
/* A screen-reader label inside the scrolling two-week strip escaped the strip and widened the page on phones */
.due-strip, .strip-item, .todo-proj-icon { position: relative; }
/* Readable secondary text: weekday labels and "Add" on Meals sit at 4.5:1 or better */
.strip-dow { color: var(--ink-muted); }
.ml-add { color: var(--ink-muted); }
.ml-groc li[data-done] .ml-groc-name { color: var(--ink-muted); }
.ml-slot-label { font-size: 0.75rem; }
/* Fingertip-sized tap areas on touch screens without changing how things look:
   an invisible 44px hit area around small controls */
@media (pointer: coarse) {
  .check, .todo-check, .m-card-foot, .m-stack-title, .m-stack-legend button, .ml-food-seg { position: relative; }
  .check::before, .todo-check::before { content: ''; position: absolute; inset: -13px; }
  .m-card-foot::before, .m-stack-title::before, .m-stack-legend button::before { content: ''; position: absolute; inset: -10px -4px; }
  .ml-food-seg::before { content: ''; position: absolute; inset: -11px 0; }
  .ml-slot[data-slot="others"] { min-height: 44px; }
}
/* long project or category names end in an ellipsis instead of being cut mid-letter */
.m-tile-name { min-width: 0; }
.m-tile-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Settings › Areas: move/remove buttons sit on the same line as the name box, not floating between rows */
.area-row .row-actions { grid-row: 1; align-self: center; }
/* Projects strip: "Overdue" sits on the same line as "Today" and the day names, even without a number beside it */
.strip-head { min-height: 1.75rem; align-items: center; }
/* one safety net for every animation and transition when the device asks for reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}
/* Overdue sits above the two-week strip at every width (it used to scroll away as the first column on phones) */
.due-strip-wrap > .strip-overdue {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3);
  min-height: 0; margin-bottom: 6px; padding: var(--s3) var(--s4);
}
.due-strip-wrap > .strip-overdue .strip-head { margin: 0; flex: none; min-height: 0; }
.due-strip-wrap > .strip-overdue ul { display: flex; flex-direction: row; flex-wrap: wrap; gap: var(--s2); }
/* Projects: cards keep a card width on narrower screens too, so a lone project doesn't stretch across the page */
@media (max-width: 899px) { .project-list { grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); } }
/* Overdue: a plain checklist (tick circle, icon, title, due date) instead of coloured pills */
.due-strip-wrap > .strip-overdue { display: block; }
.due-strip-wrap > .strip-overdue .strip-head { margin-bottom: 4px; }
.overdue-list { display: grid !important; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: 0 var(--s5) !important; }
.overdue-row { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 0; border-top: 1px solid color-mix(in srgb, var(--danger) 14%, transparent); }
.overdue-row .overdue-check { width: 20px; height: 20px; min-height: 20px; margin-top: 1px; background: transparent; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--ink) 40%, transparent); }
.overdue-row .overdue-check:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
.overdue-body { display: flex; flex-direction: column; gap: 1px; text-align: left; min-width: 0; color: var(--ink); }
.overdue-title { font-size: 0.9375rem; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.overdue-title .todo-proj-icon { margin-right: 5px; vertical-align: -2px; color: var(--ink-muted); }
.overdue-date { font-size: 0.8125rem; color: var(--danger); }
.overdue-body:hover .overdue-title { text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
@media (max-width: 640px) { .overdue-list { grid-template-columns: 1fr; } }
/* Overdue band lines up with the two-week strip below it, which bleeds 16px into the side margins on narrower screens */
@media (max-width: 899px) { .due-strip-wrap > .strip-overdue { margin-inline: -16px; } }

/* ---------- "Add a task" / "Add an item": an outlined pill in the card's own ink, no fill ---------- */
.matrix .quad .inline-add, .quad .inline-add, .tray > .inline-add {
  align-self: flex-start; min-height: 32px; margin-top: var(--s2); padding: 0 12px 0 9px; gap: 4px;
  font-size: 0.875rem; /* matches the task titles in the cards */
  white-space: nowrap;
  border-radius: var(--radius-pill); color: inherit;
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, currentColor 30%, transparent);
  transition: box-shadow .15s ease;
}
.matrix .quad .inline-add:hover, .quad .inline-add:hover, .tray > .inline-add:hover,
.matrix .quad .inline-add:focus-visible, .quad .inline-add:focus-visible, .tray > .inline-add:focus-visible {
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, currentColor 70%, transparent);
}
.tray > .inline-add { color: var(--ink-soft); }
.matrix .quad .inline-add svg, .quad .inline-add svg, .tray > .inline-add svg { width: 14px; height: 14px; flex: none; }
@media (prefers-reduced-motion: reduce) { .quad .inline-add, .tray > .inline-add { transition: none; } }
/* narrow cards: when the full label no longer fits, shorten it to "+ Add" */
.quad { container-type: inline-size; }
.inline-add-rest { white-space: pre; }
@container (max-width: 112px) {
  .quad .inline-add-rest { display: none; }
}
/* "2 more" under the Bills card's list; the rest open in the Bills drawer */
.m-bill-more { align-self: flex-start; padding-left: 0; }
/* the Bills drawer's title, at page-title scale */
.m-bills-heading { font-size: var(--t-h1); line-height: 1.1; }
.m-bills-head { width: 100%; text-align: left; color: inherit; min-height: 44px; margin: -10px 0 -8px; align-items: center; border-radius: var(--radius-sm); }
.m-bills-head:hover .m-stack-title { text-decoration: underline; text-underline-offset: 3px; }
.m-bills-head:hover .m-stack-title svg { opacity: 1; transform: translate(1px, -1px); }
/* phones: the quadrant header ("Do ↗") is one wide tap target that opens it full screen */
.quad-open { display: inline-flex; opacity: .55; transition: transform 120ms, opacity 120ms; }
.quad-title:not(:disabled) { width: 100%; min-height: 44px; }
.quad-title:not(:disabled):hover .quad-open { opacity: 1; transform: translate(1px, -1px); }
.matrix .quad-cell .quad-title .quad-open { margin-left: -6px; } /* 4px after the name, not the header's 10px gap */
/* desktop: the To sort picker floats under the grid button while the mouse is over it */
.tray li { position: relative; }
.row-picker-pop {
  position: absolute; right: 0; top: calc(100% - 6px); z-index: 5; width: 17rem; padding: 8px;
  background: var(--surface); border-radius: var(--radius-md); box-shadow: 0 0 0 1px var(--line), var(--shadow-lift);
}
/* "Up to date, 2:57am" doubles as a check-now button */
.sync-now { cursor: pointer; padding: 0; background: none; text-align: right; }
.sync-now:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
/* event sheet: "Add to Google Calendar" */
.gcal-add { align-self: flex-start; text-decoration: none; }
.gcal-add svg { flex: none; }
.cal-toggles { margin: calc(-1 * var(--s3)) 0 var(--s4); }
/* project cards: "Next" sits on its own line under the progress count, date pill first */
.project-next { display: flex; align-items: baseline; gap: 8px; min-width: 0; color: inherit; }
.project-next-date {
  flex: none; padding: 2px 9px; border-radius: var(--radius-pill); font-size: 0.8125rem; font-weight: 600;
  background: color-mix(in srgb, currentColor 12%, transparent); white-space: nowrap;
}
.project-next-date[data-late] { color: var(--danger); }
.project-next-title { font-weight: 500; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
/* Google Calendar events: plain rows and blocks with nothing to open, so no pointer or hover */
.is-static { cursor: default; }
.entry-body.is-static:hover .entry-title { text-decoration: none; }
.cell-entry.is-static:hover { background: none; }
.slot.is-static:hover { filter: none; }
.peek-row.is-static:hover { background: none; }
.proj-new-list { white-space: nowrap; }
.project-tools { flex-wrap: wrap; }
.plists { scroll-margin-top: 80px; } /* clear of the top bar when "+ Checklist" scrolls here */
</style>
